/* Real camera scanner: native BarcodeDetector (QR + barcodes) where the browser has it, jsQR otherwise.
   Also reads a photo (useful on phones that block live camera on plain http). */
function Scanner({onResult,onClose}){
  const video=useRef(); const canvas=useRef(); const [err,setErr]=useState(""); const [status,setStatus]=useState("Starting camera…"); const [manual,setManual]=useState("");
  const fileRef=useRef(); const stopRef=useRef(()=>{});
  const decodeFrom=async(src,w,h)=>{
    if("BarcodeDetector" in window){ try{ const det=new window.BarcodeDetector({formats:["qr_code","code_128","code_39","ean_13","ean_8","upc_a","data_matrix"]}); const r=await det.detect(src); if(r&&r.length) return r[0].rawValue; }catch(e){} }
    await loadScript(JSQR_URL); const c=canvas.current; c.width=w; c.height=h; const ctx=c.getContext("2d",{willReadFrequently:true}); ctx.drawImage(src,0,0,w,h); const img=ctx.getImageData(0,0,w,h); const q=window.jsQR(img.data,w,h); return q?q.data:null;
  };
  useEffect(()=>{ let stream=null, alive=true, timer=null;
    (async()=>{ try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error("This browser cannot open the camera here. Use 'Scan a photo' or type the ID.");
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
      if(!alive) return; video.current.srcObject=stream; await video.current.play(); setStatus("Point the camera at a QR code or barcode");
      const tick=async()=>{ if(!alive) return; const v=video.current; if(v&&v.videoWidth){ try{ const val=await decodeFrom(v,v.videoWidth,v.videoHeight); if(val&&alive){ alive=false; if(navigator.vibrate) navigator.vibrate(80); onResult(val); return; } }catch(e){ setErr(e.message); } } timer=setTimeout(tick,250); };
      tick();
    }catch(e){ setErr(/Permission|NotAllowed/i.test(e.name+e.message)?"Camera permission was refused. Allow the camera for this site, or use 'Scan a photo'.":(e.message||String(e))); setStatus(""); } })();
    stopRef.current=()=>{ alive=false; clearTimeout(timer); if(stream) stream.getTracks().forEach(t=>t.stop()); };
    return ()=>stopRef.current();
  },[]);
  const onPhoto=e=>{ const f=e.target.files[0]; if(!f) return; const img=new Image(); img.onload=async()=>{ const sc=Math.min(1,1400/Math.max(img.width,img.height)); try{ const val=await decodeFrom(img,Math.round(img.width*sc),Math.round(img.height*sc)); if(val){ stopRef.current(); onResult(val); } else setErr("No QR code found in that photo. Hold the code flat, well lit and fill the frame."); }catch(x){ setErr(x.message); } }; img.src=URL.createObjectURL(f); e.target.value=""; };
  return html`<${Modal} title="Scan QR / barcode" sub="Requests, POs, GRN, GIN, gate passes, bin cards" onClose=${()=>{ stopRef.current(); onClose(); }} narrow>
    <div class="scanner"><video ref=${video} playsinline muted/><i class="scan-frame"/><canvas ref=${canvas} class="hidden"/></div>
    ${status&&html`<div class="sm muted" style="text-align:center">${status}</div>`}${err&&html`<div class="notice notice-warn"><${Icon} name="alert"/><span>${err}</span></div>`}
    <div class="row wrap"><input type="file" accept="image/*" capture="environment" class="hidden" ref=${fileRef} onChange=${onPhoto}/><button class="btn btn-ghost" onClick=${()=>fileRef.current.click()}><${Icon} name="upload"/>Scan a photo</button><span class="grow"/><input class="input" style="max-width:220px" placeholder="…or type the ID" value=${manual} onInput=${e=>setManual(e.target.value)} onKeyDown=${e=>{ if(e.key==="Enter"&&manual.trim()){ stopRef.current(); onResult(manual.trim()); } }}/><button class="btn btn-primary" disabled=${!manual.trim()} onClick=${()=>{ stopRef.current(); onResult(manual.trim()); }}>Open</button></div><//>`;
}

/* ---------- Journey rail & timeline ---------- */

  })}</div>`;

/* Track view: one readable row per approval step — who, designation, date, remarks, status pill.

function TrackTable({req,state}){
  const flow=FLOW[req.type]; const idx=stageIndex(req); const dead=req.status!=="active";

  const n=nextStage(req);

  const userOf=e=>e&&((e.uid&&state.users.find(u=>u.id===e.uid))||state.users.find(u=>u.name===e.by));
  const officers=s=>state.users.filter(u=>u.active&&(s.owner==="hod"?u.id===req.requesterId:u.role===s.owner)).map(u=>u.name);
  const rows=flow.map((s,i)=>{
    if(i<=idx){ const e=evFor(s); const u=userOf(e); return {s,i,kind:"done",name:e?e.by:"—",desig:(e&&e.desig)||(u&&u.designation)||(ROLES[s.owner]||{}).label||s.who,at:e&&e.at,remark:e&&e.comment,pill:e&&e.role==="super"&&/not required/i.test(e.action)?"Not required":s.label}; }

    <div class="tbl-wrap track-tbl"><table class="tbl"><thead><tr><th>#</th><th>Step</th><th>Name</th><th>Designation</th><th>Date</th><th>Remarks</th><th class="c">Status</th></tr></thead><tbody>
      ${rows.map(r=>html`<tr class=${"tr-"+r.kind}><td data-l="#"><span class="tnum">${r.i+1}</span></td><td data-l="Step"><b>${r.s.label}</b></td><td data-l="Name">${r.name}</td><td data-l="Designation" class="muted">${r.desig||"—"}</td><td data-l="Date" class="nowrap">${r.at?fmtD(r.at):"—"}</td><td data-l="Remarks" class="sm">${r.remark||""}</td><td data-l="Status" class="c"><${Tag} tone=${tone[r.kind]}>${r.pill}</${Tag}></td></tr>`)}

      ${storeMode?html`<select class="select wide" value=${it.itemId||""} onChange=${e=>pick(i,e.target.value)}><option value="">Select stock item…</option>${stock.map(s=>html`<option value=${s.id}>${s.name} · ${s.qty} ${s.uom} in ${s.store.split(" ")[0]}</option>`)}</select>`
                :html`<input class="input wide" placeholder="Item name & specification" value=${it.name} onInput=${e=>set(i,"name",e.target.value)}/>`}
      <${Pick} value=${it.category} options=${CATS} disabled=${storeMode} onChange=${v=>set(i,"category",v)}/>
      <${Pick} value=${it.uom} options=${UOMS} disabled=${storeMode} onChange=${v=>set(i,"uom",v)}/>
      <input class="input" type="number" min="1" value=${it.qty} onInput=${e=>set(i,"qty",Number(e.target.value))}/>
      <input class="input" type="number" min="0" placeholder="PKR" value=${it.price} disabled=${storeMode} onInput=${e=>set(i,"price",Number(e.target.value))}/>
      <button class="iconbtn" style="width:32px;height:32px" title="Remove row" onClick=${()=>onChange(items.filter((_,j)=>j!==i))} disabled=${items.length===1}><${Icon} name="trash"/></button>
    </div>`)}
    <div class="row between wrap"><div class="row wrap"><button class="btn btn-ghost btn-sm" onClick=${()=>onChange([...items,{name:"",category:"MED",uom:"Pcs",qty:1,price:0}])}><${Icon} name="plus"/>Add item</button>${!storeMode&&html`<${ExcelItemsButton} onRows=${rows=>onChange([...items.filter(i=>i.name),...rows])}/>`}</div>
      <span class="sm muted">Estimated total <b class="num">${pkr(items.reduce((s,i)=>s+(i.qty||0)*(i.price||0),0))}</b></span></div>
  </div>`;
}

/* ---------- Modal ---------- */
function Modal({title,sub,onClose,children,footer,narrow}){
  useEffect(()=>{ const k=e=>{ if(e.key==="Escape") onClose(); }; window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k); },[]);
  return html`<div class="overlay" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}><div class=${"modal "+(narrow?"narrow":"")} role="dialog" aria-modal="true">
    <div class="modal-h"><div class="grow"><h3>${title}</h3>${sub&&html`<div class="sm muted">${sub}</div>`}</div><button class="iconbtn close" onClick=${onClose} aria-label="Close"><${Icon} name="x"/></button></div>
    <div class="modal-b">${children}</div>
    ${footer&&html`<div class="modal-f">${footer}</div>`}
  </div></div>`;
}

/* All mutations go through makeActions(commit, user, toast).
   commit(fn) clones state, lets fn mutate the draft, then saves. */
function nextNumber(state, prefix, width=4){
  const re=new RegExp("^"+prefix.replace(/[-]/g,"\\-")+"(\\d+)$");
  let max=0;
  const scan=id=>{ const m=re.exec(id); if(m) max=Math.max(max,Number(m[1])); };
  state.requests.forEach(r=>scan(r.id)); state.docs.forEach(d=>scan(d.id)); (state.assets||[]).forEach(x=>scan(x.tag)); (state.beneficiaries||[]).forEach(x=>scan(x.id)); (state.invoices||[]).forEach(x=>scan(x.id)); (state.invoices||[]).forEach(i=>scan(i.id)); state.rfqs.forEach(r=>scan(r.id)); state.pos.forEach(p=>scan(p.id)); state.stock.forEach(s=>scan(s.id));
  (state.docs||[]).forEach(d=>{ if(d.gatePass) scan(d.gatePass); });
  return prefix+pad(max+1,width);
}
const MONTH = ()=>pad(new Date().getMonth()+1,2);

function makeActions(commit, user, toast){
  const who = ()=>({by:user.name, role:user.role, uid:user.id, desig:user.designation||""});
  const log=(d,doc,action,comment,dept)=>d.audit.unshift({id:uid(),at:nowISO(),doc,action,comment:comment||"",dept:dept||user.dept||"", ...who()});
  const advance=(d,req,stageKey,action,comment)=>{ req.stage=stageKey; req.timeline.push({at:nowISO(),stage:stageKey,action,comment,...who()}); log(d,req.id,action,comment,req.dept); };

  return {
    submitRequest(type, form){
      let id; commit(d=>{
        id=nextNumber(d, type==="procurement"?`AKF-MR-${YEAR}-`:`AKF-SR-${YEAR}-`);
        const items=form.items.filter(i=>i.name&&i.qty>0);
        const req={ id, type, createdAt:nowISO(), dept:form.dept==="OTHER"?(form.otherDept||"OTHER"):form.dept, requesterId:user.id, requester:user.name, purpose:form.purpose.trim(), donor:form.donor, projectCode:form.projectCode||"GEN-"+YEAR, urgency:form.urgency, status:"active", stage:"submitted", items, links:{}, timeline:[] };
        req.timeline.push({at:nowISO(),stage:"submitted",action:"Request submitted",comment:form.note||"",...who()});
        d.requests.unshift(req); log(d,id,"Request submitted",form.note,req.dept);
      });
      toast(`${id} submitted`,"ok"); return id;
    },
    cancel(reqId,comment){ commit(d=>{ const r=d.requests.find(r=>r.id===reqId); r.status="cancelled"; r.timeline.push({at:nowISO(),stage:r.stage,action:"Cancelled by requester",comment,...who()}); log(d,r.id,"Cancelled",comment,r.dept); }); toast("Request cancelled"); },
    reject(reqId,comment){ commit(d=>{ const r=d.requests.find(r=>r.id===reqId); const n=nextStage(r); r.status="rejected"; r.timeline.push({at:nowISO(),stage:n?n.key:r.stage,action:"Rejected",comment,...who()}); log(d,r.id,"Rejected",comment,r.dept); }); toast("Request rejected","bad"); },
    sendBack(reqId,comment){ commit(d=>{ const r=d.requests.find(r=>r.id===reqId); const prev=FLOW[r.type][Math.max(0,stageIndex(r)-1)].key; r.timeline.push({at:nowISO(),stage:r.stage,action:"Sent back for revision",comment,...who()}); r.stage=prev; log(d,r.id,"Sent back",comment,r.dept); }); toast("Sent back one step"); },
    /* One step forward in the approval matrix — only the owner of the next step can call it (no auto-approval, no bypass). */
    forward(reqId,comment){ let n; commit(d=>{ const r=d.requests.find(r=>r.id===reqId); n=nextStage(r); if(!n||!canAct(user,r)) return;
        const action={budget:"Budget approved",rec_hr:"Recommended",rec_rm:"Recommended",approved:"Approved",checked:"Items confirmed"}[n.key]||n.done;
        advance(d,r,n.key,action,comment); });
      const after=n&&FLOW.procurement.concat(FLOW.store).find(s=>s.key===n.key); toast(`${after?after.done:"Done"} — forwarded to the next step`,"ok"); },
    confirmReceipt(reqId,comment){ commit(d=>{ const r=d.requests.find(r=>r.id===reqId); advance(d,r,"closed","Receipt confirmed",comment); }); toast("Receipt confirmed — request completed","ok"); },

    /* --- Procurement: RFQ → quotes → PO --- */
    sendRFQ(reqId, vendorIds, days){
      let id; commit(d=>{
        const r=d.requests.find(r=>r.id===reqId); id=nextNumber(d,`RFQ-${YEAR}-`,3);
        const deadline=new Date(Date.now()+days*864e5).toISOString();
        d.rfqs.unshift({ id, requestId:reqId, at:nowISO(), deadline, status:"Open", quotes:vendorIds.map(v=>{ const tk=secureToken(); return {id:"Q"+uid(),vendorId:v,token:tk,link:vendorLink(tk),status:"Sent",sub:0,gst:0,wht:0,net:0,docs:0,deliveryDays:0}; }) });
        r.links.rfq=id; const act=`${id} sent to ${vendorIds.length} vendor${vendorIds.length>1?"s":""}`; r.timeline.push({at:nowISO(),stage:"note",action:act,comment:`Deadline ${fmtDT(deadline)} · record each quotation as it arrives`,...who()}); log(d,r.id,act,"",r.dept);
      }); toast(`${id} sent — record quotations as they arrive`,"ok");
    },
    /* Quotations collected → the comparative statement goes to the purchase committee */
    closeRFQ(reqId){ commit(d=>{ const r=d.requests.find(r=>r.id===reqId); const rfq=d.rfqs.find(x=>x.id===r.links.rfq); rfq.status="Evaluation"; rfq.quotes.forEach(q=>{ if(q.status!=="Submitted") q.status="Expired"; });
        advance(d,r,"rfq",`${rfq.id} closed — ${rfq.quotes.filter(q=>q.status==="Submitted").length} quotations to purchase committee`,""); }); toast("Sent to the purchase committee","ok"); },
    /* Up to the direct-purchase limit: one vendor quotation, no RFQ/committee (policy step is logged). */
    directPurchase(reqId,{vendorId,amount,inclusive,deliveryDays,docs}){
      let id; commit(d=>{ const r=d.requests.find(r=>r.id===reqId); const v=d.vendors.find(v=>v.id===vendorId); const lim=Number(d.settings.directPurchaseLimit)||100000;
        id=nextNumber(d,`RFQ-${YEAR}-`,3); const t=quoteCalc(amount,inclusive,v); const qid="Q"+uid();
        d.rfqs.unshift({ id, requestId:reqId, at:nowISO(), deadline:nowISO(), status:"Closed", direct:true, quotes:[{id:qid,vendorId,link:"Direct purchase",status:"Submitted",docs:docs||100,deliveryDays:deliveryDays||3,at:nowISO(),...t}], committee:{quoteId:qid,direct:true,at:nowISO(),by:user.name,byId:user.id,reason:`Direct purchase — value ≤ ${pkr(lim)}`,members:[]} });
        r.links.rfq=id; advance(d,r,"rfq",`Direct purchase quotation from ${v.name} (${id})`,`Total incl. tax ${pkr(t.gross)} · ${inclusive?"vendor price included taxes":"GST added from vendor profile"}`);
        r.stage="committee"; r.timeline.push({at:nowISO(),stage:"committee",action:"Purchase committee not required",comment:`Request value ≤ ${pkr(lim)} (direct purchase policy)`,by:"System policy",role:"super"}); log(d,r.id,"Committee not required — direct purchase",pkr(t.gross),r.dept);
      }); toast(`${id} recorded — issue the PO next`,"ok");
    },
    /* Purchase committee picks one vendor; a comparative statement (CS) document is generated. */
    committeeDecide(rfqId,quoteId,{members,reason}){
      let cs; commit(d=>{ const rfq=d.rfqs.find(r=>r.id===rfqId); const r=d.requests.find(x=>x.id===rfq.requestId); const q=rfq.quotes.find(q=>q.id===quoteId); const v=d.vendors.find(v=>v.id===q.vendorId);
        cs=nextNumber(d,`AKF-CS-${YEAR}-`); rfq.committee={quoteId,members,reason,at:nowISO(),by:user.name,byId:user.id}; rfq.csId=cs; rfq.status="Closed";
        d.docs.unshift({id:cs,type:"CS",title:"Comparative statement",at:nowISO(),by:user.name,byId:user.id,amount:grossOf(q),ref:rfq.id,store:"",lines:r.items.map(i=>({item:i.name,qty:i.qty,uom:i.uom,price:i.price}))});
        r.links.cs=cs; advance(d,r,"committee",`Committee selected ${v.name}`,`${cs} · ${pkr(grossOf(q))} incl. tax${reason?" · "+reason:""}`);
      }); toast(`${cs} comparative statement generated`,"ok");
    },
    markOpened(rfqId,qId){ commit(d=>{ const q=d.rfqs.find(r=>r.id===rfqId).quotes.find(q=>q.id===qId); if(q.status==="Sent") q.status="Opened"; }); },
    recordQuote(rfqId,qId,{amount,inclusive,docs,deliveryDays}){
      commit(d=>{ const rfq=d.rfqs.find(r=>r.id===rfqId); const q=rfq.quotes.find(q=>q.id===qId); const v=d.vendors.find(v=>v.id===q.vendorId);
        const t=quoteCalc(amount,inclusive,v); Object.assign(q,{status:"Submitted",docs,deliveryDays,at:nowISO(),...t});
        log(d,rfq.id,`Quotation received from ${v.name}`,`Total incl. tax ${pkr(t.gross)} (${inclusive?"taxes included by vendor":"GST added automatically"}) · docs ${docs}% · ${deliveryDays} days`); });
      toast("Quotation recorded — link expired","ok");
    },
    makeLink(rfqId,qId){ commit(d=>{ const q=d.rfqs.find(r=>r.id===rfqId).quotes.find(x=>x.id===qId); q.token=secureToken(); q.link=vendorLink(q.token); }); },
    logSend(rfqId,qId,via){ commit(d=>{ const rfq=d.rfqs.find(r=>r.id===rfqId); const q=rfq&&rfq.quotes.find(x=>x.id===qId); if(!q) return; q.sentVia=via; q.sentAt=nowISO(); const v=d.vendors.find(x=>x.id===q.vendorId)||{}; log(d,rfq.id,`Quotation link ${via==="copied"?"copied":"sent by "+via} · ${v.name}`,""); }); },
    expireLink(rfqId,qId){ commit(d=>{ const q=d.rfqs.find(r=>r.id===rfqId).quotes.find(q=>q.id===qId); q.status="Expired"; }); },
    /* PO goes only to the vendor the committee selected; every other quoting vendor gets a regret letter. */
    issuePO(rfqId,qId,deliveryBy){
      let id, regrets=0; commit(d=>{ const rfq=d.rfqs.find(r=>r.id===rfqId); qId=(rfq.committee&&rfq.committee.quoteId)||qId; const q=rfq.quotes.find(q=>q.id===qId); const v=d.vendors.find(v=>v.id===q.vendorId); const r=d.requests.find(r=>r.id===rfq.requestId);
        id=nextNumber(d,`PO-${YEAR}-`); d.pos.unshift({id,rfqId,requestId:r.id,vendorId:v.id,at:nowISO(),sub:q.sub,gst:q.gst,gross:grossOf(q),wht:q.wht,net:q.net,inclusive:!!q.inclusive,status:"Issued",deliveryBy,byId:user.id});
        rfq.status="Closed"; rfq.poId=id; r.links.po=id;
        rfq.quotes.forEach(x=>{ const xv=d.vendors.find(v=>v.id===x.vendorId); const won=x.id===qId;
          d.smsLog.unshift({at:nowISO(),to:xv.contact,vendor:xv.name,kind:won?"Success":"Regret",text:won?`Congratulations. ${xv.name} selected for ${id} (${pkr(q.net)}). Alkhidmat Foundation Islamabad.`:`Thank you for quoting on ${rfq.id}. Another vendor was selected this time. Alkhidmat Foundation Islamabad.`});
          if(!won&&x.status==="Submitted"){ const rid=nextNumber(d,`AKF-RGT-${YEAR}-`); d.docs.unshift({id:rid,type:"RGT",title:"Regret letter",at:nowISO(),by:user.name,byId:user.id,amount:0,ref:rfq.id,vendorId:xv.id,store:"",lines:[]}); regrets++; } });
        advance(d,r,"po",`${id} issued to ${v.name}`,`Total incl. tax ${pkr(grossOf(q))} · net payable ${pkr(q.net)} after WHT ${Math.round(whtRate(v.type,v.filer)*100)}%${regrets?` · ${regrets} regret letter${regrets>1?"s":""}`:""}`);
      }); toast(`${id} issued · ${regrets} regret letter${regrets===1?"":"s"} generated`,"ok");
    },

    /* --- Store: GRN, issue, donations, movements --- */
    receiveGRN(reqId,{store,rack,bin,lines,note,rating}){
      let id; commit(d=>{ const r=d.requests.find(r=>r.id===reqId); const po=d.pos.find(p=>p.id===r.links.po); id=nextNumber(d,`AKF-GRN-P-${YEAR}-${MONTH()}-`);
        if(po&&rating){ const v=d.vendors.find(v=>v.id===po.vendorId); if(v){ const n=(v.deliveries||0); v.rating=Math.round(((v.rating||3)*n+rating)/(n+1)); v.deliveries=n+1; v.lastDelivery=nowISO(); v.onTime=(v.onTime||0)+(new Date()<=new Date(po.deliveryBy+"T23:59:59")?1:0); log(d,v.id,"Vendor performance updated",`Delivery rated ${rating}/5 · new rating ${v.rating}/5`); } }
        let amount=0;
        lines.forEach(l=>{ amount+=l.qty*l.price; let s=d.stock.find(s=>s.name.toLowerCase()===l.item.toLowerCase()&&s.store===store);
          if(!s){ const code=store.split(" ")[0]; s={id:nextNumber(d,`AKF-ISB-${code}-${l.category}-${YEAR}-`,5),name:l.item,category:l.category,uom:l.uom,qty:0,price:l.price,store,rack,bin,expiry:l.expiry||"",batch:l.batch||"",min:5}; d.stock.push(s); }
          s.qty+=l.qty; s.price=l.price; if(l.expiry) s.expiry=l.expiry; if(l.batch) s.batch=l.batch; d.ledger.unshift({id:uid(),at:nowISO(),itemId:s.id,type:"in",qty:l.qty,ref:id,note:"Purchase receipt "+(po?po.id:"")}); l.itemId=s.id; });
        d.docs.unshift({id,type:"GRN-P",title:"Goods receipt (purchase)",at:nowISO(),by:user.name,amount,ref:po?po.id:"",store,lines,note});
        if(po){ po.status="Received"; }
        const ath=Number(d.settings.assetThreshold)||50000; d.assets=d.assets||[];
        lines.forEach(l=>{ if(l.qty>0&&(l.category==="IT"||l.price>=ath)){ for(let k=0;k<Math.min(l.qty,50);k++){ const tag=nextNumber(d,`AKF-AST-${YEAR}-`); d.assets.push({tag,name:l.item,itemId:l.itemId,value:l.price,location:store,custodian:"Store",status:"In store",at:nowISO(),serial:l.batch||"",requestId:r.id,grn:id}); } } });
        r.links.grn=id; r.items.forEach((it,i)=>{ if(lines[i]) it.itemId=lines[i].itemId; });
        advance(d,r,"grn",`GRN ${id} · goods received in ${store.split(" ")[0]}`,note);
      }); toast(`${id} created · stock updated`,"ok");
    },
    issueToDept(reqId,{vehicle,driver,note}){
      let id,gp; commit(d=>{ const r=d.requests.find(r=>r.id===reqId); id=nextNumber(d,`AKF-GIN-${YEAR}-`); gp=nextNumber(d,`AKF-GP-${YEAR}-${MONTH()}-`);
        let amount=0; const lines=[];
        r.items.forEach(it=>{ let s=d.stock.find(s=>s.id===it.itemId)||d.stock.find(s=>s.name.toLowerCase()===it.name.toLowerCase());
          if(s){ s.qty=Math.max(0,s.qty-it.qty); d.ledger.unshift({id:uid(),at:nowISO(),itemId:s.id,type:"out",qty:it.qty,ref:id,note:`Issued to ${r.dept}`}); }
          amount+=it.qty*it.price; lines.push({item:it.name,qty:it.qty,uom:it.uom,price:it.price}); });
        d.docs.unshift({id,type:"GIN",title:"Goods Issuance Note",at:nowISO(),by:user.name,byId:user.id,amount,ref:r.id,store:"CS1 Central Store 1",lines,gatePass:gp,vehicle,driver,to:`${r.dept} · ${r.requester} (HOD)`,receiverId:r.requesterId,note});
        (d.assets||[]).filter(a=>a.requestId===r.id&&a.status==="In store").forEach(a=>{ a.status="Issued"; a.custodian=`${r.dept} · ${r.requester}`; a.location=r.dept; a.issuedAt=nowISO(); a.gdn=id; });
        r.links.issue=id; advance(d,r,"issued",`Issued to HOD via GIN ${id} · Gate pass ${gp}`,note);
      }); toast(`GIN ${id} issued · gate pass ${gp}`,"ok");
    },
    /* Purchased goods that should be kept: a GIN to store is recorded, stock stays in the store, request completes. */
    placeInStore(reqId,{store,rack,bin,note}){
      let id; commit(d=>{ const r=d.requests.find(r=>r.id===reqId); id=nextNumber(d,`AKF-GIN-${YEAR}-`); let amount=0; const lines=[];
        r.items.forEach(it=>{ const s=d.stock.find(s=>s.id===it.itemId)||d.stock.find(s=>s.name.toLowerCase()===it.name.toLowerCase()); if(s){ if(rack) s.rack=rack; if(bin) s.bin=bin; } amount+=it.qty*it.price; lines.push({item:it.name,qty:it.qty,uom:it.uom,price:it.price}); });
        d.docs.unshift({id,type:"GIN",title:"Goods Issuance Note (placed in store)",at:nowISO(),by:user.name,byId:user.id,amount,ref:r.id,store,lines,to:`${store} · Rack ${rack||"—"} Bin ${bin||"—"}`,note});
        r.links.issue=id; r.placedInStore=true; advance(d,r,"issued",`Issued & placed in store via GIN ${id}`,`${store} · Rack ${rack||"—"} Bin ${bin||"—"}${note?" · "+note:""}`);
        advance(d,r,"closed","Completed — items held in store",`Available for store requests from ${store}`);
      }); toast(`GIN ${id} · items placed in store`,"ok");
    },
    /* Signature, name and designation that print on every document this person signs */
    saveProfileSign(userId,{name,designation,signature}){ commit(d=>{ const u=d.users.find(x=>x.id===userId); if(!u) return; if(name) u.name=name; u.designation=designation; if(signature!==undefined) u.signature=signature; log(d,u.username,"Signature / designation updated",u.name+" · "+u.designation); }); toast("Signature saved — it will appear on printed documents","ok"); },
    /* Excel import: rows already validated by the import screen */
    importRows(kind,rows){
      let n=0; commit(d=>{
        if(kind==="stock") rows.forEach(r=>{ const store=r.store||STORES[0]; const code=store.split(" ")[0]; let s=d.stock.find(x=>x.name.toLowerCase()===r.name.toLowerCase()&&x.store===store);
          if(!s){ s={id:nextNumber(d,`AKF-ISB-${code}-${r.category}-${YEAR}-`,5),name:r.name,category:r.category,uom:r.uom,qty:0,price:r.price,store,rack:r.rack,bin:r.bin,expiry:r.expiry,batch:r.batch,min:r.min}; d.stock.push(s); }
          s.qty+=r.qty; s.price=r.price||s.price; if(r.min) s.min=r.min; if(r.rack) s.rack=r.rack; if(r.bin) s.bin=r.bin; if(r.expiry) s.expiry=r.expiry; if(r.batch) s.batch=r.batch;
          if(r.qty>0) d.ledger.unshift({id:uid(),at:nowISO(),itemId:s.id,type:"in",qty:r.qty,ref:"EXCEL-IMPORT",note:"Opening balance (Excel import)"}); n++; });
        if(kind==="vendors") rows.forEach(r=>{ const ex=d.vendors.find(v=>v.name.toLowerCase()===r.name.toLowerCase()||(r.ntn&&v.ntn===r.ntn)); if(ex) Object.assign(ex,r); else d.vendors.push({...r,id:"V-"+pad(d.vendors.length+1,3),rating:r.rating||3}); n++; });
        if(kind==="budgets") rows.forEach(r=>{ const ex=d.budgets.find(b=>b.code===r.code); if(ex) Object.assign(ex,r); else d.budgets.push(r); n++; });
        if(kind==="users") rows.forEach(r=>{ const ex=d.users.find(u=>u.username===r.username); if(ex) Object.assign(ex,r); else d.users.push({...r,id:"u"+uid(),active:true}); n++; });
        log(d,"EXCEL-IMPORT",`Excel import · ${kind}`,`${rows.length} rows`);
      }); toast(`${n} ${kind} rows imported`,"ok"); return n;
    },
    /* Stock received outside a procurement request: purchased (GRN-P) or donation in kind (GDN-D) */
    /* Stock received outside a procurement request: purchased (GRN-P) or donation in kind (GDN-D) */
    receiveStock({kind,date,store,from,ref,purpose,lines,note}){
      let id; commit(d=>{ id=autoDocId(d,kind,date||nowISO().slice(0,10)); const at=atOfDate(date); let amount=0;
        const out=lines.map(l=>{ amount+=l.qty*l.price; const s=findOrCreateItem(d,{name:l.item,category:l.category,uom:l.uom,price:l.price,store,rack:l.rack,bin:l.bin,expiry:l.expiry,min:l.min,condition:l.condition||"New"});
          s.qty+=l.qty; if(l.price) s.price=l.price; if(l.expiry) s.expiry=l.expiry; if(l.rack) s.rack=l.rack; if(l.bin) s.bin=l.bin;
          d.ledger.unshift({id:uid(),at,itemId:s.id,type:"in",qty:l.qty,ref:id,note:(kind==="GRN-P"?"Purchase · ":"Donation in kind · ")+from});
          return {item:s.name,qty:l.qty,uom:s.uom,price:l.price,condition:condOf(s),expiry:l.expiry||""}; });
        d.docs.unshift({id,type:kind,title:kind==="GRN-P"?"Goods Received Note (purchase)":"Goods Donation Note (donation in kind)",at,by:user.name,byId:user.id,amount,ref:ref||"",from,purpose,store,lines:out,note});
        log(d,id,kind==="GRN-P"?"Stock received (purchase)":"Stock received (donation in kind)",`${from} · ${lines.length} item${lines.length>1?"s":""} · ${pkr(amount)}`);
      }); toast(`${id} created · stock updated`,"ok");
    },
    /* Direct issue (GIN) — distributions and dispatches approved outside a store request; the approval reference is mandatory */
    issueStock({date,store,to,purpose,receiver,approval,lines,note}){
      let id; commit(d=>{ id=autoDocId(d,"GIN",date||nowISO().slice(0,10)); const at=atOfDate(date); let amount=0; const out=[];
        lines.forEach(l=>{ const s=d.stock.find(x=>x.id===l.itemId); if(!s||l.qty<=0) return; s.qty=Math.max(0,s.qty-l.qty); amount+=l.qty*s.price; out.push({item:s.name,qty:l.qty,uom:s.uom,price:s.price,condition:condOf(s)});
          d.ledger.unshift({id:uid(),at,itemId:s.id,type:"out",qty:l.qty,ref:id,note:"Issued to "+to}); });
        d.docs.unshift({id,type:"GIN",title:"Goods Issuance Note",at,by:user.name,byId:user.id,amount,ref:approval,approval,store,lines:out,to:to+(receiver?" · received by "+receiver:""),purpose,note});
        log(d,id,"Stock issued (GIN)",`${to} · ${out.length} item${out.length>1?"s":""} · approval ${approval}`);
      }); toast(`GIN ${id} issued · stock updated`,"ok");
    },
    /* Excel import of the AKF stock register workbook (Home + Received + Dispatched sheets).
       Every receipt and issue gets an automatic document number in date order; the number written in Excel is kept as a reference. */
    importRegister({items,received,issued,store,replace,openingDate,defaultType}){
      let res={items:0,received:0,issued:0,skipped:0}; commit(d=>{
        if(replace){ d.stock=[]; d.ledger=[]; d.docs=docsAfterReplace(d); }
        const fresh=new Set(); const openAt=atOfDate(openingDate);
        items.forEach(it=>{ const before=d.stock.length; const s=findOrCreateItem(d,{...it,store:it.store||store}); if(d.stock.length>before) fresh.add(s.id);
          if(it.min) s.min=it.min; if(it.price) s.price=it.price;
          if(it.opening>0&&fresh.has(s.id)){ s.qty+=it.opening; d.ledger.unshift({id:uid(),at:openAt,itemId:s.id,type:"in",qty:it.opening,ref:"AKF-OPENING-"+openingDate,note:"Opening stock (stock register import)"}); }
          res.items++; });
        /* "Add" mode skips rows already in the portal: same document type, same date and the same items and quantities */
        const sig=(type,date,lines)=>[type,date,lines.map(l=>itemKey(l.item||l.name)+":"+l.qty).sort().join(",")].join("|");
        const have=new Set(replace?[]:d.docs.filter(x=>x.lines).map(x=>sig(x.type==="GRN-D"?"GDN-D":x.type,new Date(x.at).toLocaleDateString("en-CA"),x.lines)));
        const excelRef=no=>no&&!/^AKF-/.test(no)?"Excel no. "+no:"";
        groupMoves(received,r=>recvKey(r,defaultType)).forEach(g=>{ const f=g[0], type=f.type||defaultType;
          if(have.has(sig(type,f.date,g))){ res.skipped+=g.length; return; }
          const id=autoDocId(d,type,f.date,f.no); const at=atOfDate(f.date); let amount=0;
          const lines=g.map(r=>{ const s=findOrCreateItem(d,{name:r.name,store:r.store||store,condition:r.condition||undefined}); s.qty+=r.qty; amount+=r.qty*(s.price||0);
            d.ledger.unshift({id:uid(),at,itemId:s.id,type:"in",qty:r.qty,ref:id,note:(type==="GRN-P"?"Purchase · ":"Donation in kind · ")+(r.from||"—")+(r.purpose?" · "+r.purpose:"")}); res.received++;
            return {item:s.name,qty:r.qty,uom:s.uom,price:s.price||0,condition:condOf(s)}; });
          d.docs.unshift({id,type,title:type==="GRN-P"?"Goods Received Note (purchase)":"Goods Donation Note (donation in kind)",at,by:user.name,byId:user.id,amount,ref:excelRef(f.no),from:g.map(r=>r.from).find(Boolean)||"",purpose:[...new Set(g.map(r=>r.purpose).filter(Boolean))].join(" · "),store:f.store||store,lines,note:"Imported from stock register (Excel)"}); });
        groupMoves(issued,issKey).forEach(g=>{ const f=g[0];
          if(have.has(sig("GIN",f.date,g))){ res.skipped+=g.length; return; }
          const id=autoDocId(d,"GIN",f.date,f.no); const at=atOfDate(f.date); let amount=0;
          const lines=g.map(r=>{ const s=findOrCreateItem(d,{name:r.name,store:r.store||store,condition:r.condition||undefined}); s.qty-=r.qty; amount+=r.qty*(s.price||0);
            d.ledger.unshift({id:uid(),at,itemId:s.id,type:"out",qty:r.qty,ref:id,note:"Issued to "+(r.to||"—")+(r.purpose?" · "+r.purpose:"")}); res.issued++;
            return {item:s.name,qty:r.qty,uom:s.uom,price:s.price||0,condition:condOf(s)}; });
          d.docs.unshift({id,type:"GIN",title:"Goods Issuance Note",at,by:user.name,byId:user.id,amount,ref:excelRef(f.no),store:f.store||store,lines,to:f.to||"",purpose:[...new Set(g.map(r=>r.purpose).filter(Boolean))].join(" · "),note:"Imported from stock register (Excel)"}); });
        d.stock.forEach(s=>{ if(s.qty<0) s.qty=0; });
        log(d,"EXCEL-IMPORT",replace?"Stock register imported (replaced all stock)":"Stock register imported",`${res.items} items · ${res.received} received rows · ${res.issued} issued rows${res.skipped?` · ${res.skipped} already imported, skipped`:""}`);
      }); toast(`Stock register imported · ${res.items} items, ${res.received} received, ${res.issued} issued`,"ok"); return res;
    },
    stockMove(kind,{itemId,qty,note,toStore}){
      const map={transfer:["AKF-ST","Stock transfer"],return:["AKF-RTN","Return to store"],disposal:["AKF-DIS","Disposal"],psv:["AKF-PSV","Physical stock verification"]};
      let id; commit(d=>{ const s=d.stock.find(s=>s.id===itemId); id=nextNumber(d,`${map[kind][0]}-${YEAR}-`);
        let type="out", q=qty;
        if(kind==="return"){ type="in"; s.qty+=qty; }
        else if(kind==="psv"){ const diff=qty-s.qty; type=diff>=0?"in":"out"; q=Math.abs(diff); s.qty=qty; }
        else if(kind==="transfer"){ s.qty=Math.max(0,s.qty-qty); const code=toStore.split(" ")[0]; let t=d.stock.find(x=>x.name===s.name&&x.store===toStore&&condOf(x)===condOf(s)); if(!t){ t={...s,id:nextNumber(d,`AKF-ISB-${code}-${s.category}-${YEAR}-`,5),store:toStore,qty:0,rack:"",bin:""}; d.stock.push(t);} t.qty+=qty; d.ledger.unshift({id:uid(),at:nowISO(),itemId:t.id,type:"in",qty,ref:id,note:"Transfer in from "+s.store.split(" ")[0]}); }
        else { s.qty=Math.max(0,s.qty-qty); }
        if(q>0) d.ledger.unshift({id:uid(),at:nowISO(),itemId:s.id,type,qty:q,ref:id,note:map[kind][1]+(note?" · "+note:"")});
        d.docs.unshift({id,type:map[kind][0].replace("AKF-",""),title:map[kind][1],at:nowISO(),by:user.name,amount:q*s.price,ref:s.id,store:s.store,lines:[{item:s.name,qty:q,uom:s.uom,price:s.price}],note:(kind==="transfer"?"To "+toStore+" · ":"")+(note||"")});
        log(d,id,map[kind][1],`${s.name} · ${q} ${s.uom}`+(note?" · "+note:""));
      }); toast(`${id} recorded`,"ok");
    },

    amendItems(reqId,items,reason){
      commit(d=>{ const r=d.requests.find(r=>r.id===reqId); const changes=[];
        items.forEach((n,i)=>{ const o=r.items[i]; if(!o){ changes.push(`+ ${n.name} ${n.qty} ${n.uom} @ ${fmt(n.price)}`); return; } if(o.qty!==n.qty) changes.push(`${o.name}: qty ${o.qty} → ${n.qty}`); if(o.price!==n.price) changes.push(`${o.name}: price ${fmt(o.price)} → ${fmt(n.price)}`); if(o.name!==n.name) changes.push(`${o.name} → ${n.name}`); });
        r.items.slice(items.length).forEach(o=>changes.push(`− ${o.name}`));
        r.items=items; const txt=changes.join(" · ")||"No change";
        r.timeline.push({at:nowISO(),stage:r.stage,action:"Request amended (old → new)",comment:`${txt}${reason?" · "+reason:""}`,...who()}); log(d,r.id,"Request amended",txt,r.dept); });

    distribute({beneficiary,lines,donor,note}){ let id,gp; commit(d=>{ id=nextNumber(d,`AKF-BEN-RCT-${YEAR}-${MONTH()}-`,5); let amount=0; const out=[];
        lines.forEach(l=>{ const s=d.stock.find(x=>x.id===l.itemId); if(!s||l.qty<=0) return; s.qty=Math.max(0,s.qty-l.qty); amount+=l.qty*s.price; out.push({item:s.name,qty:l.qty,uom:s.uom,price:s.price,batch:s.batch,expiry:s.expiry}); d.ledger.unshift({id:uid(),at:nowISO(),itemId:s.id,type:"out",qty:l.qty,ref:id,note:"Beneficiary distribution · "+beneficiary.village}); });
        d.docs.unshift({id,type:"BEN",title:"Beneficiary receipt",at:nowISO(),by:user.name,amount,ref:"Donor: "+donor,store:"CS1 Central Store 1",lines:out,beneficiary,note});
        log(d,id,"Beneficiary receipt issued",`${beneficiary.name} · ${beneficiary.cnic} · ${pkr(amount)}`); }); toast(`${id} issued`,"ok"); },
    attach(reqId,file){ commit(d=>{ const r=d.requests.find(r=>r.id===reqId); r.attachments=r.attachments||[]; r.attachments.push({id:uid(),at:nowISO(),by:user.name,...file}); log(d,r.id,"Attachment added",`${file.label} · ${file.name}`,r.dept); }); toast("Attachment saved","ok"); },

    restore(json){ try{ const s=JSON.parse(json); if(!s||!Array.isArray(s.requests)||!Array.isArray(s.users)) throw 0; saveState(s); location.reload(); }catch(e){ toast("That file is not a valid portal backup","bad"); } },
    saveSettings(st){ commit(d=>{ const diffs=Object.keys(st).filter(k=>String(d.settings[k])!==String(st[k])).map(k=>`${k}: ${d.settings[k]} → ${st[k]}`); d.settings={...d.settings,...st}; if(diffs.length) log(d,"SETTINGS","Settings changed",diffs.join(" · ")); }); toast("Settings saved","ok"); },
    async changePasswordSB(next){ try{ await DB.changePassword(next); commit(d=>{ const u=d.users.find(u=>u.id===user.id); if(u) u.password=next; log(d,user.username,"Password changed",""); }); toast("Password changed","ok"); return true; }catch(e){ toast(e.message||"Could not change password","bad"); return false; } },

/* Permission: can this user act on this request now? */
/* No bypass: only the owner of the NEXT step can act — not even the Super Admin.
   The requester's own steps (confirm receipt) belong to whoever raised the request. */
function canAct(user, req){
  if(!req || req.status!=="active" || req.stage==="closed") return false;
  const owner=ownerOf(req);
  if(owner==="president" && SETTINGS.actingApprover && SETTINGS.actingApprover===user.role) return true;
  if(READ_ONLY_ROLES.includes(user.role)) return false;
  if(owner==="hod") return req.requesterId===user.id || (user.role==="hod" && req.dept===user.dept);
  return owner===user.role;
}
/* A request becomes visible to an officer only once it has reached that officer's step
   (i.e. it was recommended by every step before). HODs see their department; everyone sees what they raised. */
/* Department scope for reports, logs and activity: Admin Officer = procurement & vendors,
   Store Officer = store; HODs = their department; management sees everything. */
function inScope(user,r){
  if(user.role==="admin_officer") return r.type==="procurement";
  if(user.role==="store_officer") return r.type==="store"||["po","grn","issued","closed"].includes(r.stage);
  if(user.role==="hod") return r.dept===user.dept;
  return true;
}
function auditFor(user,state){
  const a=state.audit;
  if(user.role==="hod") return a.filter(x=>x.dept===user.dept);
  if(user.role==="admin_officer") return a.filter(x=>/^(AKF-MR|RFQ|PO|AKF-CS|AKF-RGT|INV|V-\d)/.test(x.doc)||x.role==="admin_officer"||x.role==="vendor");
  if(user.role==="store_officer") return a.filter(x=>/^(AKF-SR|AKF-GRN|AKF-GIN|AKF-GDN|AKF-GP|AKF-ISB|AKF-ST|AKF-RTN|AKF-DIS|AKF-PSV|AKF-BEN|AKF-AST|EXCEL)/.test(x.doc)||x.role==="store_officer");
  return a;
}
function visibleRequests(user, requests){
  if(user.role==="super"||READ_ONLY_ROLES.includes(user.role)) return requests;
  return requests.filter(r=>{
    if(r.requesterId===user.id) return true;
    if(user.role==="hod") return r.dept===user.dept;
    const flow=FLOW[r.type]||[]; const reached=stageIndex(r)+1;
    if(r.timeline.some(t=>t.uid===user.id||(t.role===user.role&&!t.uid))) return true;
    if(SETTINGS.actingApprover===user.role&&flow.some((s,i)=>s.owner==="president"&&i<=reached)) return true;
    return flow.some((s,i)=>s.owner===user.role&&i<=reached);
  });
}

const ActBox=({next,children})=>html`<div class="actions no-print"><h4>Your action · ${next?next.label:""} (${next?next.who:""}${next&&next.owner==="president"&&SETTINGS.actingApprover?" · acting approver":""})</h4>${children}</div>`;
const CommentArea=({ph,value,onInput})=>html`<textarea class="textarea" placeholder=${ph||"Comment (optional, saved to the log with date & time)"} value=${value} onInput=${e=>onInput(e.target.value)} style="min-height:56px"/>`;
function RequestModal({req,state,user,A,onClose,openDoc,readOnly}){

  const next=nextStage(req);
  const total=reqTotal(req);

  const po=state.pos.find(p=>p.id===req.links.po);
  const vendorName=id=>(state.vendors.find(v=>v.id===id)||{}).name||id;
  const isHodOwner=user.role==="hod"&&req.requesterId===user.id;
  const escalated=isEscalated(req);

  const Act=ActBox; const actProps={next};
  const CommentBox=({ph})=>html`<${CommentArea} ph=${ph} value=${comment} onInput=${setComment}/>`;
  const rejectBtn=html`<button class="btn btn-bad" onClick=${()=>{ if(!comment.trim()){alert("Add a reason before rejecting.");return;} A.reject(req.id,comment); onClose(); }}>Reject</button>`;
  const backBtn=html`<button class="btn btn-ghost" onClick=${()=>{ A.sendBack(req.id,comment); onClose(); }}>Send back</button>`;

  let actionBlock=null;
  if(can && next){
    const k=next.key;
    const nextAfter=FLOW[req.type][stageIndex(req)+2];
    const fwdLabel=nextAfter?` & forward to ${nextAfter.who}`:"";
    if(k==="budget"){ const bu=budgetUse(state,req.projectCode); const over=bu.exists&&bu.remaining<0;
      actionBlock=html`<${Act} ...${actProps}><${BudgetPanel} code=${req.projectCode} use=${bu}/>
        ${mode==="amend"?html`<${AmendForm} req=${req} onCancel=${()=>setMode(null)} onSave=${(items,reason)=>{A.amendItems(req.id,items,reason);setMode(null);}}/>`:""}
        ${CommentBox({ph:over?"Over budget — explain why this should still proceed (required)":"Budget line / donor availability…"})}

    if(k==="checked") actionBlock=html`<${Act} ...${actProps}>${html`<${StockCheck} req=${req} stock=${state.stock}/>`}${CommentBox({ph:"Availability note, rack / bin…"})}<div class="row wrap"><button class="btn btn-primary" onClick=${()=>{A.forward(req.id,comment);onClose();}}><${Icon} name="check"/>Confirm items${fwdLabel}</button>${backBtn}${rejectBtn}</div><//>`;

    if(k==="rfq"){ const lim=Number(state.settings.directPurchaseLimit)||100000; const needRfq=total>lim;

    footer=${html`<${Tag} tone=${statusTone(req)} dot>${statusLabel(req)}</${Tag}>${escalated&&html`<${Tag} tone="bad"><${Icon} name="alert" cls="icon" style="width:12px"/>Pending ${Math.round(hoursSince(req.timeline[req.timeline.length-1].at))}h · escalated (48h rule)</${Tag}>`}<span class="grow"/>${cancelable&&html`<button class="btn btn-ghost btn-sm" onClick=${()=>{ if(confirm("Cancel this request?")) {A.cancel(req.id,"Cancelled by requester");onClose();} }}>Cancel request</button>`}<button class="btn btn-ghost btn-sm" onClick=${printOpenArea}><${Icon} name="print"/>Print</button>`}>
    <div class="print-only"><${DocHeader} title=${req.type==="procurement"?"Purchase requisition":"Store requisition"} sub=${`${req.dept} · ${req.requester} · ${fmtDT(req.createdAt)}`} id=${req.id}/></div>

    ${actionBlock}
    <${TrackTable} req=${req} state=${state}/>
    <div class="split">

        <div class="kv"><dt>Purpose</dt><dd>${req.purpose}</dd><dt>Donor / project</dt><dd>${req.donor} · ${req.projectCode}</dd><dt>Urgency</dt><dd>${req.urgency==="Emergency"?html`<${Tag} tone="bad">Emergency</${Tag}>`:"Normal"}</dd><dt>Submitted</dt><dd>${fmtDT(req.createdAt)}</dd>
          ${Object.keys(req.links).length>0&&html`<dt>Linked documents</dt><dd class="row wrap">${Object.values(req.links).map(l=>html`<button class="btn btn-soft btn-sm id" onClick=${()=>openDoc(l)}>${l}</button>`)}</dd>`}</div>

      ${t&&html`<div class="notice notice-info"><${Icon} name="shield"/><span class="num">Subtotal ${fmt(t.sub)} + GST ${fmt(t.gst)} = <b>Total incl. tax ${pkr(t.gross)}</b> · WHT ${fmt(t.wht)} deducted at payment → net payable ${pkr(t.net)}</span></div>`}

    ${collect&&rfq.status==="Open"&&html`<div class="row wrap"><span class="sm muted grow">${submitted.length} of ${rfq.quotes.length} quotations recorded. ${reqTotal(req)>lim?"Above the direct-purchase limit: at least 2 quotations are needed for the committee.":""}</span><button class="btn btn-primary" disabled=${!submitted.length||(reqTotal(req)>lim&&submitted.length<2)} onClick=${()=>{ if(submitted.length<rfq.quotes.length&&!confirm("Some vendors have not quoted. Their links will expire. Send to committee now?")) return; A.closeRFQ(req.id); onIssued(); }}><${Icon} name="send"/>Send comparative statement to committee</button></div>`}

/* Magic-link sending: copy, WhatsApp (opens WhatsApp with the message ready), e-mail; each send is logged */

/* Comparative statement table — shared by the RFQ, committee screen and the printed CS */
function ComparativeTable({rfq,state,selectable,choice,onChoose,actions}){
  const scores=scoreQuotes(rfq.quotes,state.vendors); const v=id=>state.vendors.find(x=>x.id===id)||{};
  const subs=rfq.quotes.filter(q=>q.status==="Submitted"); const best=subs.length?subs.reduce((a,b)=>(scores[b.id].total>scores[a.id].total?b:a)):null;
  const sel=rfq.committee?rfq.committee.quoteId:choice;
  return html`<div class="stack" style="gap:6px"><div class="row between wrap"><div><b>${rfq.id}</b> <span class="sm muted">· ${rfq.direct?"direct purchase":`deadline ${fmtDT(rfq.deadline)}`} · ${subs.length}/${rfq.quotes.length} quotations</span></div><${Tag} tone=${rfq.status==="Open"?"warn":"ok"}>${rfq.status}</${Tag}></div>
    <div class="tbl-wrap"><table class="tbl" style="min-width:720px"><thead><tr><th>Vendor</th><th>Status</th><th class="r">Subtotal</th><th class="r">GST</th><th class="r">Total incl. tax</th><th class="r">WHT</th><th class="r">Net payable</th><th class="r">Score</th>${(selectable||actions)&&html`<th/>`}</tr></thead><tbody>
      ${rfq.quotes.map(q=>{ const vv=v(q.vendorId); const sc=scores[q.id];
        return html`<tr style=${sel===q.id?"background:var(--ok-bg)":""}>

function CommitteePanel({rfq,state,A,req,user,onDone}){

  return html`<div class="stack"><div class="sm muted">Compare the quotations (all totals include applicable taxes), select one vendor and record the committee members. A comparative statement is generated for the file.</div>

function TrackBox({state,user,openReq,openDoc,inline}){
  const [q,setQ]=useState("");
  const hits=useMemo(()=>{ const s=q.trim().toLowerCase(); if(s.length<2) return []; const reqs=visibleRequests(user,state.requests).filter(r=>r.id.toLowerCase().includes(s)||r.purpose.toLowerCase().includes(s)||r.items.some(i=>i.name.toLowerCase().includes(s))).map(r=>({id:r.id,label:r.purpose,kind:"req",sub:statusLabel(r)}));
    const docs=user.role==="hod"?[]:state.docs.filter(d=>d.id.toLowerCase().includes(s)||(d.gatePass||"").toLowerCase().includes(s)).map(d=>({id:d.id,label:d.title,kind:"doc",sub:fmtD(d.at)}));
    const pos=user.role==="hod"?[]:state.pos.filter(p=>p.id.toLowerCase().includes(s)).map(p=>({id:p.id,label:"Purchase order",kind:"doc",sub:p.status}));
    const invs=user.role==="hod"?[]:state.invoices.filter(i=>i.id.toLowerCase().includes(s)).map(i=>({id:i.poId,label:i.id+" · "+i.status,kind:"doc",sub:pkr(i.amount)}));
    const stock=user.role==="hod"?[]:state.stock.filter(x=>x.id.toLowerCase().includes(s)||x.name.toLowerCase().includes(s)).map(x=>({id:x.id,label:x.name+" · "+x.qty+" "+x.uom,kind:"stock",sub:x.store}));
    return [...reqs,...docs,...pos,...invs,...stock].slice(0,8); },[q,state,user]);
  const [scan,setScan]=useState(false);
  const openAny=raw=>{ setScan(false); const id=idFromScan(raw); if(/^AKF-(MR|SR)-/.test(id)) return openReq(id); if(/^AKF-ISB-/.test(id)) return openDoc(id,"stock"); const gp=state.docs.find(d=>d.gatePass===id); if(gp) return openDoc(gp.id); if(state.docs.some(d=>d.id===id)||state.pos.some(p=>p.id===id)||state.rfqs.some(r=>r.id===id)) return openDoc(id); const st=state.stock.find(s=>s.batch===id||s.name.toLowerCase()===id.toLowerCase()); if(st) return openDoc(st.id,"stock"); setQ(id); window.__toast&&window.__toast(`Scanned "${id}" — no exact record; showing search results`,""); };
  const scanBtn=html`<button class="iconbtn scanbtn" title="Scan QR / barcode with the camera" aria-label="Scan QR or barcode" onClick=${()=>setScan(true)}><${Icon} name="scan"/></button>`;
  /* the scanner is mounted on <body> so the top bar's blur effect cannot trap the full-screen dialog */
  useEffect(()=>{ if(!scan) return; const host=document.createElement("div"); document.body.appendChild(host); render(html`<${Scanner} onResult=${openAny} onClose=${()=>setScan(false)}/>`,host); return ()=>{ render(null,host); host.remove(); }; },[scan]);
  return html`<div class=${inline?"search":"stack"} style=${inline?"position:relative":""}>
    ${inline?html`<${Icon} name="search"/><input placeholder="Track any ID: AKF-MR-2026-0003, PO-2026-0044, GRN…" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Track a document"/>${scanBtn}`
            :html`<div class="row"><div class="search grow" style="max-width:none"><${Icon} name="search"/><input placeholder="Enter request, PO, GRN, GIN or item code…" value=${q} onInput=${e=>setQ(e.target.value)}/></div><button class="btn btn-primary" onClick=${()=>setScan(true)}><${Icon} name="scan"/>Scan</button></div>`}
    ${hits.length>0&&html`<div class=${inline?"card pop":"list"} style=${inline?"padding:6px":""}>${hits.map(hit=>html`<button class="item" style=${inline?"border:0;padding:8px 10px":""} onClick=${()=>{ setQ(""); hit.kind==="req"?openReq(hit.id):hit.kind==="doc"?openDoc(hit.id):openDoc(hit.id,"stock"); }}><div class="t"><b class="id">${hit.id}</b><${Tag}>${hit.sub}</${Tag}></div><div class="m ellipsis">${hit.label}</div></button>`)}</div>`}
    ${!inline&&q.length>=2&&!hits.length&&html`<${Empty} title="No match">Check the ID and try again.<//>`}
  </div>`;
}

/* ---------- Notifications derived from state ---------- */
function buildNotifications(state,user){
  const n=[]; const reqs=visibleRequests(user,state.requests);
  reqs.filter(r=>canAct(user,r)).forEach(r=>n.push({tone:"info",icon:"stamp",t:`${nextStage(r).label} needed · ${r.id}`,d:`${r.dept} · ${pkr(reqTotal(r))}`,at:r.timeline[r.timeline.length-1].at,id:r.id}));
  reqs.filter(r=>isEscalated(r)).forEach(r=>n.push({tone:"bad",icon:"alert",t:`48h escalation · ${r.id}`,d:`Waiting for ${nextStage(r).who} for ${Math.round(hoursSince(r.timeline[r.timeline.length-1].at))}h`,at:r.timeline[r.timeline.length-1].at,id:r.id}));
  if(user.role==="hod") reqs.filter(r=>r.requesterId===user.id&&r.status==="rejected").slice(0,2).forEach(r=>n.push({tone:"bad",icon:"x",t:`Rejected · ${r.id}`,d:(r.timeline[r.timeline.length-1]||{}).comment||"",at:r.timeline[r.timeline.length-1].at,id:r.id}));
  if(["super","store_officer","gen_sec","president"].includes(user.role)){ const soon=state.stock.filter(s=>s.expiry&&(new Date(s.expiry)-Date.now())/864e5<30); if(soon.length) n.push({tone:"warn",icon:"clock",t:`${soon.length} item${soon.length>1?"s":""} expiring within 30 days`,d:soon.map(s=>s.name).join(", "),at:nowISO()});
    const low=state.stock.filter(s=>s.qty<=s.min); if(low.length) n.push({tone:"warn",icon:"box",t:`${low.length} item${low.length>1?"s":""} below minimum stock`,d:low.map(s=>s.name).join(", "),at:nowISO()}); }
  taskNotifications(state,user).forEach(x=>{ x.key=x.key||[x.icon,x.task,x.at].join("|"); n.push(x); });
  /* stable key per notification: a new event (new step, new day for stock alerts) makes it unread again */
  n.forEach(x=>{ x.key=x.key||[x.icon,x.id||x.t.replace(/\d+/g,"#"),x.id?x.at:nowISO().slice(0,10)].join("|"); });
  return n.sort((a,b)=>a.at<b.at?1:-1);
}

  const queue=reqs.filter(r=>r.status==="active"&&mineRole(r));
  const myEv=r=>r.timeline.find(t=>(t.uid===user.id||(!t.uid&&t.role===user.role))&&t.stage!=="submitted");
  const decided=reqs.filter(r=>user.role==="super"?r.timeline.some(t=>APPROVER_ROLES.includes(t.role)):myEv(r)).filter(r=>!queue.includes(r)).sort((a,b)=>a.timeline[a.timeline.length-1].at<b.timeline[b.timeline.length-1].at?1:-1);
  const total=queue.reduce((s,r)=>s+reqTotal(r),0);
  const prevOf=r=>r.timeline[r.timeline.length-1];
  return html`<div class="stack" style="gap:16px">
    ${user.role==="super"&&html`<div class="notice notice-info"><${Icon} name="eye"/><span>Super Admin view: you can see every approval queue but cannot approve — each step must be signed by its own officer (no bypass).</span></div>`}
    <div class="grid3"><${Kpi} label=${user.role==="super"?"In approval queues":"Awaiting your decision"} value=${queue.length} tone=${queue.length?"warn":"ok"} sub=${pkr(total)+" total"}/><${Kpi} label="Escalated in queue" value=${queue.filter(isEscalated).length} tone=${queue.filter(isEscalated).length?"bad":""} sub="Older than 48 hours"/><${Kpi} label="Decided this month" value=${decided.filter(r=>{ const e=myEv(r)||prevOf(r); return monthKey(e.at)===monthKey(nowISO()); }).length} sub=${`${reqs.filter(r=>r.status==="rejected").length} rejected overall`}/></div>
    <${Card} title="Approval queue" desc=${`Only requests already recommended by every earlier step reach you. Your step: ${user.role==="super"?"all approver steps":[...new Set(FLOW.procurement.concat(FLOW.store).filter(s=>s.owner===user.role).map(s=>s.label))].join(" / ")}.`}>
      ${queue.length?html`<div class="list">${queue.map(r=>html`<button class="item" onClick=${()=>openReq(r.id)}><div class="t"><b class="id">${r.id}</b><${Tag} tone=${r.type==="procurement"?"info":"violet"}>${r.type==="procurement"?"Procurement":"Store issue"}</${Tag}>${r.urgency==="Emergency"&&html`<${Tag} tone="bad">Emergency</${Tag}>`}${isEscalated(r)&&html`<${Tag} tone="bad">48h</${Tag}>`}<span class="grow"/><b class="num">${pkr(reqTotal(r))}</b></div><div class="m">${r.purpose}</div><div class="xs faint">${r.dept} · ${r.requester} · ${r.donor} · ${nextStage(r).label.toLowerCase()} by ${nextStage(r).who} · last step ${ago(prevOf(r).at)} by ${prevOf(r).by}</div></button>`)}</div>`:html`<${Empty} title="Queue is clear">Requests appear here once the previous step has recommended them.<//>`}
    <//>
    <${Card} title=${user.role==="super"?"Decided by approvers":"Decided by you"} desc="History of approvals, recommendations and rejections"><${RequestTable} rows=${decided} openReq=${openReq}/><//>
  </div>`;
}

  const stock=state.stock.filter(s=>!q||(s.name+s.id+s.category+s.store).toLowerCase().includes(q.toLowerCase()));

    ${form&&!["receive","issue","beneficiary"].includes(form)&&html`<${MoveForm} kind=${form} stock=${state.stock} preset=${sel} onCancel=${()=>setForm(null)} onSave=${p=>{A.stockMove(form,p);setForm(null);}}/>`}
    ${tab==="register"&&!isHod&&html`<${StockRegister} state=${state} openItem=${id=>{ setSel(id); setTab("stock"); }}/>`}

    ${tab==="stock"&&!isHod&&(()=>{ const low=state.stock.filter(s=>s.qty<=s.min); if(!low.length) return ""; const already=state.requests.some(r=>r.status==="active"&&r.stage!=="closed"&&r.purpose.startsWith("Reorder")); return html`<div class="notice notice-warn" style="align-items:center"><${Icon} name="alert"/><span class="grow"><b>${low.length} item${low.length>1?"s":""} at or below minimum:</b> ${low.map(s=>`${s.name} (${s.qty}/${s.min})`).join(", ")}</span>${!readOnly&&!already&&html`<button class="btn btn-primary btn-sm" onClick=${()=>openReq(A.reorder(low.map(s=>({name:s.name,category:s.category,uom:s.uom,qty:Math.max(1,s.min*2-s.qty),price:s.price}))))}><${Icon} name="cart"/>Raise reorder request</button>`}${already&&html`<${Tag} tone="info">Reorder request open</${Tag}>`}</div>`; })()}

      ${selItem?html`<${Card} title=${selItem.name} desc=${selItem.id} right=${html`<button class="btn btn-ghost btn-sm" onClick=${()=>openDoc(selItem.id,"stock")}><${Icon} name="qr"/>Bin card</button>`}>

        <div style="margin-top:12px"><b class="sm">Ledger (in / out / balance)</b><${Ledger} itemId=${selItem.id} state=${state} openDoc=${openDoc}/></div><//>`
        :html`<${Card} title="Bin card"><${Empty} title="Select an item">The ledger and QR bin card appear here.<//><//>`}
    </div>`}
    ${(tab==="requests"||isHod)&&html`<${Card} title=${isHod?"My department's store requests":"Store issue requests"} desc="HOD → Store Officer (confirm items) → Manager Admin & HR → Regional Manager → President → GIN issue → HOD" right=${bar}><${RequestTable} rows=${rows} openReq=${openReq} showDept=${!isHod}/><//>`}

    ${tab==="docs"&&!isHod&&html`<${Card} title="Store documents" desc="GRN-P (purchase), GDN-D (donation in kind), GIN (goods issuance note) + gate pass, comparative statements, regret letters, transfers, returns, disposals, stock counts — each with a verifiable QR">
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Document</th><th>Type</th><th>Reference</th><th class="r">Amount</th><th>By</th><th class="r">Date</th></tr></thead><tbody>${state.docs.map(d=>html`<tr class="click" onClick=${()=>openDoc(d.id)}><td><b class="id">${d.id}</b>${d.gatePass&&html`<div class="xs faint id">${d.gatePass}</div>`}</td><td><${Tag} tone=${(d.type.startsWith("GRN")||d.type==="GDN-D")?"ok":d.type==="GIN"?"info":d.type==="BEN"?"violet":d.type==="DIS"?"bad":"neutral"}>${d.type}</${Tag}></td><td class="sm">${d.ref}</td><td class="r num">${fmt(d.amount)}</td><td class="sm">${d.by}</td><td class="r sm nowrap">${fmtD(d.at)}</td></tr>`)}</tbody></table></div><//>`}
  </div>`;
}
function Ledger({itemId,state,openDoc}){
  const rows=state.ledger.filter(l=>l.itemId===itemId).sort((a,b)=>a.at<b.at?-1:1); let bal=0;

/* Received / Issued registers — the portal's version of the Received and Dispatched sheets */
function movementRows(state,kind,range){
  const inRange=iso=>{ const d=new Date(iso).toLocaleDateString("en-CA"); return (!range.from||d>=range.from)&&(!range.to||d<=range.to); };
  const excelNo=d=>{ const m=/(?:Register|Excel) no\. (\S+)/.exec(d.ref||""); return m?m[1]:""; };
  const vendorOf=d=>{ const po=state.pos.find(p=>p.id===d.ref); return po?(state.vendors.find(v=>v.id===po.vendorId)||{}).name:""; };
  const reqOf=id=>state.requests.find(r=>r.id===id);
  const posted=new Set(state.ledger.map(l=>l.ref)); /* only documents that moved stock, so the lists agree with the register */
  const docs=state.docs.filter(d=>posted.has(d.id)&&inRange(d.at)&&(kind==="received"?["GRN-P","GDN-D"].includes(d.type):(d.type==="BEN"||(d.type==="GIN"&&!/placed in store/i.test(d.title)))));
  return docs.flatMap(d=>d.lines.map(l=>{ const r=reqOf(d.ref);
    return kind==="received"
      ?{doc:d,date:d.at,excel:excelNo(d),type:d.type,item:l.item,cond:l.condition||"",qty:l.qty,uom:l.uom,party:d.from||vendorOf(d)||(d.ref||"").replace(/^Donor: /,""),purpose:d.purpose||(r?r.purpose:"")}
      :{doc:d,date:d.at,excel:excelNo(d),type:d.type,item:l.item,cond:l.condition||"",qty:l.qty,uom:l.uom,party:d.to||(d.beneficiary?d.beneficiary.name+" · "+d.beneficiary.village:r?r.dept:""),purpose:d.purpose||(d.beneficiary?d.beneficiary.purpose:r?r.purpose:"")}; }))

    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>${isR?"Document":"GIN"}</th>${isR&&html`<th>Type</th>`}<th>Particulars</th><th>Condition</th><th class="r">${isR?"Received qty":"Issued qty"}</th><th>${isR?"Donor / Supplier":"Issued to"}</th><th>Purpose</th></tr></thead>

      ${!rows.length&&html`<tr><td colspan="8"><div class="empty" style="padding:16px">Nothing ${isR?"received":"issued"} in this period.</div></td></tr>`}</tbody></table></div><//>`;
}
function MoveForm({kind,stock,preset,onCancel,onSave}){

    <${Field} label=${kind==="psv"?"Counted quantity":"Quantity"}><input class="input" type="number" min="0" value=${qty} onInput=${e=>setQty(Number(e.target.value))}/><//>
    ${kind==="transfer"?html`<${Field} label="To store"><select class="select" value=${toStore} onChange=${e=>setToStore(e.target.value)}>${STORES.filter(x=>x!==s.store).map(x=>html`<option>${x}</option>`)}</select><//>`:html`<${Field} label=${kind==="disposal"?"Reason & approval ref (required)":"Note"}><input class="input" value=${note} onInput=${e=>setNote(e.target.value)} placeholder=${kind==="disposal"?"Expired · photo DIS-07 · approved by President":"Optional"}/><//>`}
    </div>${kind==="psv"&&s&&html`<div class="notice notice-info" style="margin-top:10px"><${Icon} name="shield"/><span>System balance ${s.qty} ${s.uom} · counted ${qty} · variance <b class="num">${qty-s.qty>0?"+":""}${qty-s.qty}</b></span></div>`}
    <div class="row" style="margin-top:12px"><button class="btn btn-ghost" onClick=${onCancel}>Cancel</button><span class="grow"/><button class="btn btn-primary" disabled=${!ok} onClick=${()=>onSave({itemId,qty,note,toStore})}>Record</button></div><//>`;

/* Reports dashboard. Sections by role: Super Admin / management see all;
   Admin Officer sees Procurement + Vendors & RFQ; Store Officer sees Store.
   Every chart shows values on hover and filters the register below when clicked. */
function Reports({state,user,openReq,openDoc}){
  const r=user.role;
  const sections=r==="admin_officer"?[["proc","Procurement"],["vend","Vendors & RFQ"]]:r==="store_officer"?[["store","Store"]]:[["proc","Procurement"],["vend","Vendors & RFQ"],["store","Store"]];
  const [sec,setSec]=useState(sections[0][0]);
  const blankF={from:"",to:"",dept:"all",status:"all",vendor:"all",cat:"all",store:"all",month:"",docType:"all"};
  const [f,setF]=useState(blankF); const set=(k,v)=>setF(x=>({...x,[k]:x[k]===v?blankF[k]:v}));
  const inRange=iso=>{ if(!iso) return true; const d=iso.slice(0,10); if(f.from&&d<f.from) return false; if(f.to&&d>f.to) return false; if(f.month&&monthKey(iso)!==f.month) return false; return true; };
  const deptOf=rid=>(state.requests.find(x=>x.id===rid)||{}).dept;
  const allReqs=visibleRequests(user,state.requests).filter(x=>inScope(user,x));
  const statusOf=x=>x.status!=="active"?"Rejected / cancelled":x.stage==="closed"?"Completed":"In progress";
  const reqs=allReqs.filter(x=>inRange(x.createdAt)&&(f.dept==="all"||x.dept===f.dept)&&(f.status==="all"||statusOf(x)===f.status));
  const pos=state.pos.filter(p=>inRange(p.at)&&(f.dept==="all"||deptOf(p.requestId)===f.dept)&&(f.vendor==="all"||p.vendorId===f.vendor));
  const rfqs=state.rfqs.filter(x=>inRange(x.at)&&(f.dept==="all"||deptOf(x.requestId)===f.dept)&&(f.vendor==="all"||x.quotes.some(q=>q.vendorId===f.vendor)));
  const stock=state.stock.filter(s=>(f.cat==="all"||s.category===f.cat)&&(f.store==="all"||s.store===f.store));
  const docs=state.docs.filter(d=>inRange(d.at)&&(f.store==="all"||d.store===f.store)&&(f.docType==="all"||d.type===f.docType));
  const vname=id=>(state.vendors.find(v=>v.id===id)||{}).name||id;
  const depts=[...new Set([...DEPTS.filter(d=>d!=="OTHER"),...allReqs.map(x=>x.dept)])];
  const stores=[...new Set([...STORES,...state.stock.map(s=>s.store)])];
  const months=[...new Set([...state.requests.map(x=>monthKey(x.createdAt)),...state.pos.map(p=>monthKey(p.at)),...state.docs.map(d=>monthKey(d.at)),monthKey(nowISO())])].sort().slice(-12);
  const mLabel=k=>new Date(k+"-01").toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
  const color=i=>PALETTE[i%PALETTE.length];
  const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
  /* ---- procurement data ---- */
  const statusData=[["Completed","#0F8A5F"],["In progress","#0B51A7"],["Rejected / cancelled","#C8322B"]].map(([label,c])=>({label,value:allReqs.filter(x=>inRange(x.createdAt)&&(f.dept==="all"||x.dept===f.dept)&&statusOf(x)===label).length,color:c}));
  const spendByDept=depts.map((d,i)=>({label:d,value:sum(pos.filter(p=>deptOf(p.requestId)===d),p=>p.gross||p.net),color:color(i)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const reqByDept=depts.map((d,i)=>({label:d,value:allReqs.filter(x=>inRange(x.createdAt)&&x.dept===d).length,color:color(i+2)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const cycle={}; reqs.forEach(x=>x.timeline.forEach((t,i)=>{ if(i===0) return; const h=(new Date(t.at)-new Date(x.timeline[i-1].at))/36e5; const k=(FLOW[x.type]||[]).find(s=>s.key===t.stage); if(!k||h<0) return; (cycle[k.who]=cycle[k.who]||[]).push(h); }));
  const cycleData=Object.entries(cycle).map(([label,arr],i)=>({label,value:Math.round(arr.reduce((s,x)=>s+x,0)/arr.length*10)/10,unit:" h",color:color(i)}));
  const trend=months.map(k=>({key:k,label:mLabel(k),value:sum(state.pos.filter(p=>monthKey(p.at)===k&&(f.dept==="all"||deptOf(p.requestId)===f.dept)),p=>p.gross||p.net),color:"#0B51A7"}));
  const pendingAt={}; reqs.filter(x=>x.status==="active"&&x.stage!=="closed").forEach(x=>{ const n=nextStage(x); if(n) pendingAt[n.who]=(pendingAt[n.who]||0)+1; });
  const pendingData=Object.entries(pendingAt).map(([label,value],i)=>({label,value,color:color(i+1)}));
  const budgetData=state.budgets.filter(b=>f.dept==="all"||b.dept===f.dept).map((b,i)=>{ const u=budgetUse(state,b.code); return {label:b.code,value:Math.round((u.spent+u.committed)/Math.max(1,u.allocated)*100),unit:"%",hint:`${pkr(u.spent+u.committed)} of ${pkr(u.allocated)}`,color:u.remaining<0?"#C8322B":color(i)}; });
  /* ---- vendor data ---- */
  const vendSpend=state.vendors.map((v,i)=>({label:v.name,key:v.id,value:sum(state.pos.filter(p=>p.vendorId===v.id&&inRange(p.at)&&(f.dept==="all"||deptOf(p.requestId)===f.dept)),p=>p.gross||p.net),color:color(i)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const rfqStatus=["Open","Evaluation","Closed"].map((s,i)=>({label:s,value:rfqs.filter(x=>x.status===s).length,color:["#B96A00","#5B3FD3","#0F8A5F"][i]}));
  const quotes=rfqs.flatMap(x=>x.quotes); const resp=[["Submitted","#0F8A5F"],["Opened","#0B51A7"],["Sent","#7A86A6"],["Expired","#C8322B"]].map(([label,c])=>({label,value:quotes.filter(q=>q.status===label).length,color:c}));
  const vendorRows=state.vendors.filter(v=>f.vendor==="all"||v.id===f.vendor).map(v=>{ const vp=pos.filter(p=>p.vendorId===v.id); const vq=rfqs.flatMap(x=>x.quotes).filter(q=>q.vendorId===v.id); return {v,po:vp.length,spend:sum(vp,p=>p.gross||p.net),wht:sum(vp,p=>p.wht),inv:vq.length,won:vp.length,rate:vq.length?Math.round(vp.length/vq.length*100):0}; });
  /* ---- store data ---- */
  const catData=[...new Set(state.stock.map(s=>s.category))].map((c,i)=>({label:c,value:sum(state.stock.filter(s=>s.category===c&&(f.store==="all"||s.store===f.store)),s=>s.qty*s.price),color:color(i)})).filter(d=>d.value>0);
  const storeData=stores.map((s,i)=>({label:s,value:sum(state.stock.filter(x=>x.store===s&&(f.cat==="all"||x.category===f.cat)),x=>x.qty*x.price),color:color(i+3)})).filter(d=>d.value>0);
  const isIn=d=>d.type.startsWith("GRN")||d.type==="GDN-D", isOut=d=>["GIN","BEN"].includes(d.type)&&!/placed in store/i.test(d.title);
  const flow=months.map(k=>({key:k,label:mLabel(k),value:sum(state.docs.filter(d=>monthKey(d.at)===k&&isIn(d)&&(f.store==="all"||d.store===f.store)),d=>d.amount),color:"#0F8A5F"}));
  const flowOut=months.map(k=>({key:k,label:mLabel(k),value:sum(state.docs.filter(d=>monthKey(d.at)===k&&isOut(d)&&(f.store==="all"||d.store===f.store)),d=>d.amount),color:"#C8322B"}));
  const docTypes=[...new Set(state.docs.map(d=>d.type))].map((t,i)=>({label:t,value:state.docs.filter(d=>d.type===t&&inRange(d.at)).length,color:color(i)}));
  const storeReqs=allReqs.filter(x=>x.type==="store"&&inRange(x.createdAt)&&(f.dept==="all"||x.dept===f.dept)&&(f.status==="all"||statusOf(x)===f.status));
  const low=stock.filter(s=>s.qty<=s.min), expiring=stock.filter(s=>s.expiry&&(new Date(s.expiry)-Date.now())/864e5<30);
  /* ---- export ---- */
  const table=()=>{ if(sec==="proc") return {name:"procurement",head:["Request","Type","Department","Project","Purpose","Amount","Status","Waiting for","Submitted"],rows:reqs.map(x=>[x.id,x.type,x.dept,x.projectCode,x.purpose,reqTotal(x),statusLabel(x),(nextStage(x)||{}).who||"",fmtDT(x.createdAt)])};
    if(sec==="vend") return {name:"vendors",head:["Vendor","NTN","Filer","GST","RFQs invited","POs won","Win rate %","Spend incl. tax","WHT"],rows:vendorRows.map(x=>[x.v.name,x.v.ntn,x.v.filer?"Filer":"Non-filer",x.v.gstRegistered===false?"No":"Yes",x.inv,x.won,x.rate,x.spend,x.wht])};
    return {name:"store",head:["Item code","Item","Category","Store","Rack","Bin","Qty","Unit","Unit price","Value","Min","Expiry"],rows:stock.map(s=>[s.id,s.name,s.category,s.store,s.rack,s.bin,s.qty,s.uom,s.price,s.qty*s.price,s.min,s.expiry||""])}; };
  const csv=()=>{ const t=table(); const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v; return [t.head,...t.rows].map(r=>r.map(q).join(",")).join("\n"); };
  const dlCSV=()=>{ const t=table(); const ok=downloadText(`AKF-${t.name}-report-${nowISO().slice(0,10)}.csv`,csv(),"text/csv"); window.__toast&&window.__toast(ok?"CSV downloaded":"Download blocked",ok?"ok":"bad"); };
  const dlXLSX=async()=>{ try{ await loadScript(XLSX_URL); const t=table(); const ws=XLSX.utils.aoa_to_sheet([t.head,...t.rows]); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,t.name); XLSX.writeFile(wb,`AKF-${t.name}-report-${nowISO().slice(0,10)}.xlsx`); }catch(e){ window.__toast&&window.__toast(e.message,"bad"); } };
  const active=Object.entries(f).filter(([k,v])=>v&&v!=="all");
  const sel=(k,opts,all)=>html`<select class="select" value=${f[k]} onChange=${e=>setF(x=>({...x,[k]:e.target.value}))}><option value="all">${all}</option>${opts.map(([v,l])=>html`<option value=${v}>${l}</option>`)}</select>`;
  return html`<div class="stack page-body" style="gap:16px">
    <div class="row between wrap"><div class="seg">${sections.map(([k,l])=>html`<button class=${sec===k?"active":""} onClick=${()=>setSec(k)}>${l}</button>`)}</div>
      <div class="row wrap"><button class="btn btn-ghost" onClick=${dlXLSX}><${Icon} name="download"/>Excel</button><button class="btn btn-ghost" onClick=${dlCSV}><${Icon} name="download"/>CSV</button><button class="btn btn-ghost" onClick=${printOpenArea}><${Icon} name="print"/>Print report</button></div></div>
    <div class="card"><div class="card-b"><div class="toolbar filters">
      <${Field} label="From"><input class="input" type="date" value=${f.from} onInput=${e=>setF(x=>({...x,from:e.target.value}))}/><//><${Field} label="To"><input class="input" type="date" value=${f.to} onInput=${e=>setF(x=>({...x,to:e.target.value}))}/><//>
      ${sec!=="store"&&html`<${Field} label="Department">${sel("dept",depts.map(d=>[d,d]),"All departments")}<//><${Field} label="Status">${sel("status",[["Completed","Completed"],["In progress","In progress"],["Rejected / cancelled","Rejected / cancelled"]],"All statuses")}<//>`}
      ${sec==="vend"&&html`<${Field} label="Vendor">${sel("vendor",state.vendors.map(v=>[v.id,v.name]),"All vendors")}<//>`}
      ${sec==="store"&&html`<${Field} label="Store">${sel("store",stores.map(s=>[s,s]),"All stores")}<//><${Field} label="Category">${sel("cat",[...new Set(state.stock.map(s=>s.category))].map(c=>[c,c]),"All categories")}<//><${Field} label="Document">${sel("docType",[...new Set(state.docs.map(d=>d.type))].map(t=>[t,t]),"All documents")}<//>`}
      <button class="btn btn-ghost btn-sm" style="align-self:end" disabled=${!active.length} onClick=${()=>setF(blankF)}><${Icon} name="refresh"/>Clear filters</button></div>
      ${active.length>0&&html`<div class="row wrap" style="margin-top:8px">${active.map(([k,v])=>html`<button class="chip" onClick=${()=>setF(x=>({...x,[k]:blankF[k]}))}>${k==="month"?mLabel(v):k==="vendor"?vname(v):v} <${Icon} name="x"/></button>`)}</div>`}</div></div>

    ${sec==="proc"&&html`
      <div class="grid4"><${Kpi} label="Requests" value=${reqs.length} sub=${`${reqs.filter(x=>x.urgency==="Emergency").length} emergency`}/><${Kpi} label="PO value (incl. tax)" value=${html`<small>PKR</small>${fmt(sum(pos,p=>p.gross||p.net))}`} sub=${`${pos.length} purchase orders`} tone="brand"/><${Kpi} label="Pending approvals" value=${reqs.filter(x=>x.status==="active"&&APPROVER_ROLES.includes(ownerOf(x)||"")).length} tone="warn"/><${Kpi} label="Escalated (48h)" value=${reqs.filter(isEscalated).length} tone=${reqs.some(isEscalated)?"bad":"ok"}/></div>
      <div class="grid3">
        <${Card} title="Requests by status" desc="Click a slice to filter"><${Donut} data=${statusData} center=${statusData.reduce((s,d)=>s+d.value,0)} active=${f.status!=="all"?f.status:null} onPick=${d=>set("status",d.label)}/><//>
        <${Card} title="Waiting at which step" desc="Open requests by who must act">${pendingData.length?html`<${BarsH} data=${pendingData}/>`:html`<${Empty} title="Nothing pending"/>`}<//>
        <${Card} title="PO value by department" desc="Incl. tax · click to filter">${spendByDept.length?html`<${BarsH} data=${spendByDept} money active=${f.dept!=="all"?f.dept:null} onPick=${d=>set("dept",d.label)}/>`:html`<${Empty} title="No POs in this period"/>`}<//>
        <${Card} title="Monthly PO value" desc="Last 12 months · click a month"><${Columns} data=${trend} money active=${f.month||null} onPick=${d=>set("month",d.key)}/><//>
        <${Card} title="Average hours per step" desc="How long each approver takes">${cycleData.length?html`<${BarsH} data=${cycleData}/>`:html`<${Empty} title="Not enough data"/>`}<//>
        ${r!=="admin_officer"&&html`<${Card} title="Budget utilisation %" desc="Spent + committed vs allocation">${budgetData.length?html`<${BarsH} data=${budgetData}/>`:html`<${Empty} title="No budget lines"/>`}<//>`}
        <${Card} title="Requests by department" desc="Click to filter"><${BarsH} data=${reqByDept} active=${f.dept!=="all"?f.dept:null} onPick=${d=>set("dept",d.label)}/><//>
      </div>
      <${Card} title="Request register" desc=${`${reqs.length} requests match the filters`}><${RequestTable} rows=${reqs} openReq=${openReq}/><//>`}

    ${sec==="vend"&&html`

        <${Card} title="RFQ status"><${Donut} data=${rfqStatus} center=${rfqs.length}/><//>
        <${Card} title="Vendor response to RFQs" desc="Magic-link status"><${Donut} data=${resp} center=${quotes.length}/><//>

/* ---------- Tracking log ---------- */
function LogPage({state,user,openReq,openDoc}){

/* ---------- Signature: draw it, or upload a photo of a signature on paper ----------
   A paper photo is cleaned: near-white pixels become transparent and the ink is cropped. */
function cleanSignature(img){
  const maxW=600, sc=Math.min(1,maxW/img.width); const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h); const p=d.data; let lum=0; for(let i=0;i<p.length;i+=4) lum+=0.3*p[i]+0.59*p[i+1]+0.11*p[i+2]; const avg=lum/(p.length/4); const cut=Math.min(200,avg-35);
  let minX=w,minY=h,maxX=0,maxY=0;
  for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ const i=(y*w+xx)*4; const l=0.3*p[i]+0.59*p[i+1]+0.11*p[i+2]; if(l>cut){ p[i+3]=0; } else { p[i]=Math.min(p[i],40); p[i+1]=Math.min(p[i+1],50); p[i+2]=Math.max(90,Math.min(p[i+2],140)); p[i+3]=255; if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
  x.putImageData(d,0,0); if(maxX<=minX||maxY<=minY) return null;
  const pad=6, cw=maxX-minX+pad*2, ch=maxY-minY+pad*2; const o=document.createElement("canvas"); o.width=cw; o.height=ch; o.getContext("2d").drawImage(c,minX-pad,minY-pad,cw,ch,0,0,cw,ch);
  return o.toDataURL("image/png");
}
function SignatureModal({user,A,onClose}){
  const [name,setName]=useState(user.name||""); const [desig,setDesig]=useState(user.designation||""); const [sig,setSig]=useState(user.signature||""); const [tab,setTab]=useState("draw"); const [err,setErr]=useState("");
  const cv=useRef(); const drawing=useRef(false); const dirty=useRef(false); const fileRef=useRef();
  useEffect(()=>{ const c=cv.current; if(!c) return; const r=c.getBoundingClientRect(); c.width=r.width*2; c.height=r.height*2; const x=c.getContext("2d"); x.scale(2,2); x.lineWidth=2.4; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#0B2E8A"; },[tab]);
  const pos=e=>{ const r=cv.current.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-r.left,t.clientY-r.top]; };
  const down=e=>{ e.preventDefault(); drawing.current=true; const x=cv.current.getContext("2d"); const [a,b]=pos(e); x.beginPath(); x.moveTo(a,b); };
  const move=e=>{ if(!drawing.current) return; e.preventDefault(); const x=cv.current.getContext("2d"); const [a,b]=pos(e); x.lineTo(a,b); x.stroke(); dirty.current=true; };
  const up=()=>{ if(!drawing.current) return; drawing.current=false; if(dirty.current){ const img=new Image(); img.onload=()=>{ const s=cleanSignature(img); if(s) setSig(s); }; img.src=cv.current.toDataURL(); } };

  const onFile=e=>{ const f=e.target.files[0]; if(!f) return; const img=new Image(); img.onload=()=>{ const s=cleanSignature(img); if(s){ setSig(s); setErr(""); } else setErr("No signature found — use a dark pen on white paper, good light, and crop close to the signature."); }; img.src=URL.createObjectURL(f); e.target.value=""; };
  return html`<${Modal} title="Signature, name & designation" sub=${user.username} onClose=${onClose} narrow footer=${html`<span class="grow"/><button class="btn btn-ghost" onClick=${onClose}>Cancel</button><button class="btn btn-primary" disabled=${!name.trim()||!desig.trim()} onClick=${()=>{ A.saveProfileSign(user.id,{name:name.trim(),designation:desig.trim(),signature:sig}); onClose(); }}><${Icon} name="check"/>Save</button>`}>

      :html`<div class="stack"><div class="sm muted">Sign on plain white paper with a dark pen, take a photo or scan, and upload it. The background is removed automatically.</div><input type="file" accept="image/*" capture="environment" class="hidden" ref=${fileRef} onChange=${onFile}/><button class="btn btn-ghost" onClick=${()=>fileRef.current.click()}><${Icon} name="upload"/>Choose photo / scan</button>${err&&html`<div class="notice notice-warn"><${Icon} name="alert"/><span>${err}</span></div>`}</div>`}
    <div class="row between"><b class="sm">Preview</b><button class="btn btn-ghost btn-sm" onClick=${clear}>Clear</button></div>

/* ---------- Stock register workbook (AKF format): Home + Received + Dispatched ----------

function parseRegisterWorkbook(wb){

      if(!name||/^particulars?$/i.test(name)) continue;

      const it={row:i+1,name,category:ci.cat>=0?norm(r[ci.cat]):"",uom:(ci.uom>=0&&norm(r[ci.uom]))||"Unit",opening:num("open"),min:num("min"),price:num("price"),excelBal:ci.bal>=0&&r[ci.bal]!==""?num("bal"):null,store:ci.store>=0?norm(r[ci.store]):""};

    const list=[], today=nowISO().slice(0,10);
