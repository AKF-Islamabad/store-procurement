<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alkhidmat Islamabad · Procurement & Store Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0B2E8A; --brand-2:#0B51A7; --brand-3:#1E6FD9;
  --ice:#EEF3FC; --ice-2:#DCE6F8;
  --bg:#EEF2FA; --surface:#FFFFFF; --surface-2:#F6F8FD;
  --line:#D9E1F0; --line-2:#C5D1E8;
  --ink:#14203F; --ink-2:#4B5878; --ink-3:#7A86A6;
  --ok:#0F8A5F; --ok-bg:#E3F5EC; --warn:#B96A00; --warn-bg:#FFF3DF; --bad:#C8322B; --bad-bg:#FDE8E6; --info:#0B51A7; --info-bg:#E6EEFB; --violet:#5B3FD3; --violet-bg:#ECE8FB;
  --shadow:0 1px 2px rgba(20,32,63,.05),0 10px 30px -14px rgba(11,46,138,.22);
  --grad:linear-gradient(135deg,#0B2E8A 0%,#0B51A7 55%,#1E6FD9 100%);
  --r:18px; --r-sm:12px; --r-xs:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#0B2E8A; --brand-2:#2B6FD6; --brand-3:#5B94E8;
    --ice:#15213F; --ice-2:#1C2C52;
    --bg:#0D1526; --surface:#141E36; --surface-2:#182441;
    --line:#26345A; --line-2:#33447A;
    --ink:#E9EEF9; --ink-2:#B4BFD9; --ink-3:#7E8BAB;
    --ok:#3FCB91; --ok-bg:#12382C; --warn:#F2B257; --warn-bg:#3C2E12; --bad:#F27B74; --bad-bg:#44201E; --info:#7FB0F2; --info-bg:#1A2E55; --violet:#A796F0; --violet-bg:#2A2452;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#0B2E8A; --brand-2:#2B6FD6; --brand-3:#5B94E8;
  --ice:#15213F; --ice-2:#1C2C52;
  --bg:#0D1526; --surface:#141E36; --surface-2:#182441;
  --line:#26345A; --line-2:#33447A;
  --ink:#E9EEF9; --ink-2:#B4BFD9; --ink-3:#7E8BAB;
  --ok:#3FCB91; --ok-bg:#12382C; --warn:#F2B257; --warn-bg:#3C2E12; --bad:#F27B74; --bad-bg:#44201E; --info:#7FB0F2; --info-bg:#1A2E55; --violet:#A796F0; --violet-bg:#2A2452;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
#app{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:var(--brand-2)}
:focus-visible{outline:2px solid var(--brand-3);outline-offset:2px;border-radius:6px}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}
.id{font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:700}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Login shared ---------- */
.login-err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-xs);padding:9px 12px;font-weight:600;font-size:13px}

/* ---------- Form controls ---------- */
.field{display:grid;gap:5px}
.field > span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-3) 22%,transparent)}
.textarea{min-height:70px;resize:vertical}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-sm);padding:9px 14px;font-weight:700;font-size:13.5px;border:1px solid transparent;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px rgba(11,81,167,.7)}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 20px -8px rgba(11,81,167,.8)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand-3);background:var(--ice)}
.btn-soft{background:var(--ice);color:var(--brand-2)}
.btn-soft:hover{background:var(--ice-2)}
.btn-ok{background:linear-gradient(135deg,#0F8A5F,#19A874);color:#fff;box-shadow:0 6px 16px -8px rgba(15,138,95,.7)}
.btn-bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn-bad:hover{background:var(--bad);color:#fff}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:12px 18px;font-size:15px;border-radius:12px}
.btn-block{width:100%}
.icon{width:16px;height:16px;flex:none}
.icon-lg{width:20px;height:20px}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--grad);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:18px 14px;gap:6px;position:sticky;overflow:hidden}
.side::before{content:"";position:absolute;right:-90px;bottom:60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.16),rgba(255,255,255,0) 65%);pointer-events:none}
.side::after{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,0) 70%);pointer-events:none}
.side>*{position:relative;z-index:1}
.side-brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px}
.side-brand img{width:46px;height:46px;border-radius:13px;flex:none;box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.side-brand b{display:block;font-size:13.5px;line-height:1.15}
.side-brand span{font-size:11px;color:rgba(255,255,255,.7)}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.82);font-weight:600;font-size:13.5px;text-align:left;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.active{background:#fff;color:var(--brand);box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.nav .count{margin-left:auto;font-size:11px;font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav button.active .count{background:var(--ice);color:var(--brand)}
.side-user{margin-top:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.side-user b{font-size:13px}
.side-user span{font-size:11.5px;color:rgba(255,255,255,.72)}
.side-user .row{margin-top:8px;gap:14px}
.side-user button{justify-self:start;font-size:12px;color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:6px;opacity:.9}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.topbar .sub{font-size:12.5px;color:var(--ink-2)}
.search{flex:1;max-width:440px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:7px 12px}
.search input{border:0;background:none;flex:1;min-width:0;outline:none;font-size:13.5px}
.iconbtn{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
.iconbtn:hover{border-color:var(--brand-3);color:var(--brand-2)}
.iconbtn .pip{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.content{padding:20px 24px 90px;max-width:1340px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.content>*,.stack>*,.grid2>*,.grid3>*,.grid4>*,.split>*,.card-b,.card-b>*{min-width:0}
.rolepill{font-size:11.5px;font-weight:800;color:var(--brand-2);background:var(--ice);border-radius:999px;padding:3px 10px}
.viewonly{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
.mobilenav{display:none}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:10px 14px}
  .topbar .sub{display:none}
  .topbar .search{display:none}
  .topbar h1{font-size:17px}
  .content{padding:14px 14px 96px}
  .mobilenav{display:grid;grid-auto-flow:column;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .mobilenav button{display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--ink-3);font-size:10px;font-weight:700}
  .mobilenav button.active{color:var(--brand-2);background:var(--ice)}
  .mobilenav .count{position:absolute;top:2px;right:8px;background:var(--bad);color:#fff;border-radius:999px;font-size:9px;padding:0 5px}
  .mobilenav button{position:relative}
}

/* ---------- Cards & tables ---------- */
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h h3::before{content:"";display:inline-block;width:4px;height:14px;border-radius:3px;background:var(--grad);margin-right:9px;vertical-align:-2px}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.005em}
.card-h .desc{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.card-b{padding:14px 18px 18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)!important}.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px 18px;display:grid;gap:4px;text-align:left;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--kpi-accent,var(--ice));opacity:.35}
.kpi:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 16px 34px -16px rgba(11,46,138,.35)}
.kpi .lbl{position:relative}.kpi .val{position:relative}.kpi .sub{position:relative}
.kpi.tone-warn{--kpi-accent:var(--warn-bg)}.kpi.tone-bad{--kpi-accent:var(--bad-bg)}.kpi.tone-ok{--kpi-accent:var(--ok-bg)}.kpi.tone-brand{--kpi-accent:var(--info-bg)}
.kpi .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.kpi .val{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-top:2px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--ink-3);margin-right:4px}
.kpi .sub{font-size:12px;color:var(--ink-3)}
.kpi.tone-warn .val{color:var(--warn)} .kpi.tone-bad .val{color:var(--bad)} .kpi.tone-ok .val{color:var(--ok)} .kpi.tone-brand .val{color:var(--brand-2)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--r-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.3}
.tag-ok{background:var(--ok-bg);color:var(--ok)} .tag-warn{background:var(--warn-bg);color:var(--warn)} .tag-bad{background:var(--bad-bg);color:var(--bad)} .tag-info{background:var(--info-bg);color:var(--info)} .tag-violet{background:var(--violet-bg);color:var(--violet)} .tag-neutral{background:var(--ice);color:var(--ink-2)}
.tag .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r-sm);padding:26px 16px;text-align:center;color:var(--ink-2);font-size:13.5px}
.empty b{display:block;color:var(--ink);margin-bottom:3px}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;background:var(--surface);display:grid;gap:5px;text-align:left;transition:border-color .15s}
button.item:hover{border-color:var(--brand-3)}
.item .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .t b{font-size:13.5px}
.item .m{font-size:12.5px;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--ice);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button.active{background:var(--surface);color:var(--brand-2);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar .input,.toolbar .select{width:auto}
.notice{border-radius:var(--r-sm);padding:10px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.notice-info{background:var(--info-bg);color:var(--info)} .notice-warn{background:var(--warn-bg);color:var(--warn)} .notice-ok{background:var(--ok-bg);color:var(--ok)} .notice-bad{background:var(--bad-bg);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600;margin:0}
.kv dd{margin:0;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line-2);padding-top:8px;margin-top:4px}
.total b{font-size:18px;letter-spacing:-.01em}
.bar{height:8px;background:var(--ice);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-2);border-radius:999px}

/* ---------- Journey rail (approval tracking) ---------- */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;overflow-x:auto;padding:4px 0}
.rail .st{display:grid;gap:7px;justify-items:center;text-align:center;position:relative;min-width:88px;padding:0 4px}
.rail .st::before,.rail .st::after{content:"";position:absolute;top:13px;height:2px;background:var(--line-2);width:50%}
.rail .st::before{left:0} .rail .st::after{right:0}
.rail .st:first-child::before,.rail .st:last-child::after{display:none}
.rail .st.done::before,.rail .st.done::after,.rail .st.now::before{background:var(--ok)}
.rail .st.bad.now::before{background:var(--bad)}
.rail .pt{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);display:grid;place-items:center;position:relative;z-index:1;color:var(--ink-3);font-size:11px;font-weight:800}
.rail .st.done .pt{background:var(--ok);border-color:var(--ok);color:#fff}
.rail .st.now .pt{border-color:var(--brand-2);color:var(--brand-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-2) 18%,transparent)}
.rail .st.now.bad .pt{border-color:var(--bad);color:var(--bad);background:var(--bad);color:#fff;box-shadow:none}
.rail .st b{font-size:12px;line-height:1.2}
.rail .st span{font-size:10.5px;color:var(--ink-3);line-height:1.25}
.rail .st.now b{color:var(--brand-2)}
.rail .st.now.bad b{color:var(--bad)}
.timeline{display:grid;gap:0;border-left:2px solid var(--line-2);margin-left:9px;padding-left:16px}
.timeline .ev{position:relative;padding:4px 0 14px}
.timeline .ev::before{content:"";position:absolute;left:-23px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--brand-2);border:2px solid var(--surface)}
.timeline .ev.bad::before{background:var(--bad)} .timeline .ev.ok::before{background:var(--ok)}
.timeline .ev b{font-size:13px}
.timeline .ev .who{font-size:12px;color:var(--ink-2)}
.timeline .ev .cm{font-size:12.5px;margin-top:3px;background:var(--surface-2);border-radius:8px;padding:6px 9px;display:inline-block}
.timeline .ev time{font-size:11.5px;color:var(--ink-3);float:right}

/* ---------- Overlay ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,20,50,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){.overlay{align-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:880px;max-height:min(92vh,980px);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
@media (min-width:700px){.modal{border-radius:18px}}
.modal.narrow{max-width:520px}
.modal-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px;font-weight:800}
.modal-h .close{margin-left:auto}
.modal-b{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal-b>*{flex:none;min-width:0}
.modal-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface-2)}
.actions{display:grid;gap:10px;background:var(--ice);border-radius:var(--r-sm);padding:12px}
.actions h4{margin:0;font-size:13px;color:var(--brand-2)}
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,420px)}
@media (max-width:980px){.toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);display:flex;gap:9px;align-items:center;animation:pop .2s ease-out}
.toast.ok{background:var(--ok);color:#fff} .toast.bad{background:var(--bad);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pop{position:absolute;right:0;top:44px;width:min(360px,92vw);z-index:40}
.qr{display:grid;justify-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:#000}
.qr svg{width:132px;height:132px;display:block}
.qr .cap{font-size:11px;color:#333;text-align:center;word-break:break-all}
.doc{border:1.5px solid var(--line-2);border-radius:var(--r);padding:18px;background:var(--surface);display:grid;gap:12px}
.doc-h{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--brand);padding-bottom:12px}
.doc-h img{width:52px;height:52px;border-radius:12px}
.doc-h h4{margin:0;font-size:16px}
.doc-h .sub{font-size:12.5px;color:var(--ink-2)}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sig div{border-top:1.5px solid var(--line-2);padding-top:6px;font-size:12px;color:var(--ink-2);text-align:center}
.sig b{display:block;color:var(--ink);font-size:12.5px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.items-grid{display:grid;grid-template-columns:minmax(0,1.6fr) 90px 80px 72px 100px 32px;gap:6px;align-items:center}
.items-grid .hd{font-size:11.5px;font-weight:700;color:var(--ink-2)}
@media (max-width:640px){.items-grid{grid-template-columns:minmax(0,1fr) 70px 70px;}.items-grid .hd{display:none}.items-grid .wide{grid-column:1 / -1}}
.stepnum{width:22px;height:22px;border-radius:50%;background:var(--ice);color:var(--brand-2);font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;flex:none}
/* ---------- Premium look layer ---------- */
:root{--accent:#F07A1A;--shadow-lg:0 1px 2px rgba(20,32,63,.04),0 18px 40px -22px rgba(11,46,138,.28)}
body{background:radial-gradient(1200px 600px at 100% -10%,color-mix(in srgb,var(--brand-3) 9%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.card{border-radius:16px;box-shadow:var(--shadow-lg);transition:box-shadow .2s,transform .2s}
.card-h h3::before{width:4px;height:16px;background:linear-gradient(180deg,var(--brand-2),var(--brand-3))}
.content>.page-body>*,.page-body>.stack>*{animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pg-title{position:relative;padding-bottom:5px}
.pg-title::after{content:"";position:absolute;left:0;bottom:0;width:calc(100% - 10px);max-width:220px;height:3px;border-radius:3px;background:var(--brand)}
.pg-title::before{content:"";position:absolute;bottom:-3px;width:9px;height:9px;border-radius:50%;background:var(--accent);left:min(calc(100% - 8px),222px)}
.topbar{padding:10px 22px;gap:10px;box-shadow:0 1px 0 var(--line),0 10px 30px -24px rgba(11,46,138,.5)}
.clock{display:flex;gap:6px;flex:none}
.clock span{background:var(--brand);color:#fff;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13.5px;letter-spacing:.01em;box-shadow:0 6px 16px -10px rgba(11,46,138,.9)}
.clock .chip-t{min-width:104px;text-align:center}
.clock small{font-size:9.5px;margin-left:3px;opacity:.85}
.me{display:flex;align-items:center;gap:9px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);flex:none;text-align:left}
.me:hover{border-color:var(--brand-3)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;font-size:12px;font-weight:800;letter-spacing:.02em;flex:none}
.me-t{display:grid;line-height:1.15;max-width:150px}
.me-t b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-t span{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1280px){.clock{display:none}}
@media (max-width:1100px){.me-t{display:none}.me{padding:3px}}
.kpi{border-left:4px solid transparent}
.kpi.tone-warn{border-left-color:var(--warn)}.kpi.tone-bad{border-left-color:var(--bad)}.kpi.tone-ok{border-left-color:var(--ok)}.kpi.tone-brand{border-left-color:var(--brand-2)}
.tbl th{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;color:var(--ink-3);padding:10px 12px}
.tbl td{padding:11px 12px}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--ice) 55%,transparent)}
.tbl th.c,.tbl td.c{text-align:center}
.tag{padding:4px 10px;border-radius:8px;font-weight:800;letter-spacing:.01em}
.nav button{border-radius:12px;transition:background .15s,transform .15s}
.nav button:not(.active):hover{transform:translateX(2px)}
.nav button.active{box-shadow:0 10px 24px -12px rgba(0,0,0,.55),inset 3px 0 0 var(--accent)}
.modal{border-radius:20px}
.modal-h{background:var(--grad);color:#fff;border-bottom:0;padding:16px 20px}
.modal-h .muted,.modal-h .sm{color:rgba(255,255,255,.8)!important}
.modal-h .iconbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.btn-primary{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 60%,var(--brand-3) 100%)}
/* Track view */
.track{display:grid;gap:12px}
.track-head{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--ice),color-mix(in srgb,var(--ice-2) 60%,var(--surface)));border:1px solid var(--ice-2);border-radius:14px;padding:12px 16px}
.track-k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-2)}
.track-t{font-size:15px;font-weight:600;color:var(--ink)}
.track-pct{display:grid;justify-items:end;line-height:1}
.track-pct b{font-size:26px;font-weight:800;color:var(--brand)}
.track-pct span{font-size:11px;color:var(--ink-3)}
.track-bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.track-bar i{height:7px;border-radius:4px;background:var(--line)}
.track-bar i.d{background:linear-gradient(90deg,#0F8A5F,#19A874)}
.track-bar i.n{background:var(--warn);animation:pulse 1.4s ease-in-out infinite}
.track-bar i.x{background:var(--bad)}
.track-tbl table{min-width:720px}
.track-tbl .tnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ice);color:var(--brand-2);font-size:11px;font-weight:800}
.track-tbl tr.tr-done .tnum{background:var(--ok-bg);color:var(--ok)}
.track-tbl tr.tr-now td{background:color-mix(in srgb,var(--warn-bg) 70%,transparent)}
.track-tbl tr.tr-now .tnum{background:var(--warn);color:#fff}
.track-tbl tr.tr-bad td{background:var(--bad-bg)}
.track-tbl tr.tr-next td{color:var(--ink-3)}
.track-tbl tr.tr-next b{color:var(--ink-3);font-weight:600}
@media (max-width:700px){
  .track-tbl{border:0}
  .track-tbl table,.track-tbl tbody,.track-tbl tr,.track-tbl td{display:block;min-width:0!important;width:100%}
  .track-tbl thead{display:none}
  .track-tbl tr{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:6px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
  .track-tbl td{border:0!important;padding:2px 0!important;background:none!important}
  .track-tbl td[data-l="#"]{grid-row:span 3}
  .track-tbl td[data-l="Status"]{grid-column:3;grid-row:1}
  .track-tbl td[data-l="Name"],.track-tbl td[data-l="Designation"],.track-tbl td[data-l="Date"],.track-tbl td[data-l="Remarks"]{grid-column:2;font-size:12.5px}
  .track-tbl td:empty,.track-tbl td[data-l="Remarks"]:empty{display:none}
}
/* Notifications */
.notif{width:min(400px,94vw)}
.item.note{position:relative;padding-left:14px}
.item.note.read{opacity:.6;background:var(--surface-2)}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.link-like{color:var(--brand-2);font-weight:700;justify-self:start;cursor:pointer}
/* Vendor link buttons */
.sendlink{gap:4px;flex-wrap:nowrap}
.iconbtn.sm{width:30px;height:30px}
.iconbtn.wa{color:#1FA855}
.iconbtn.wa:hover{border-color:#1FA855;color:#1FA855}
/* Vendor quotation page */
.vq{min-height:100%;display:flex;flex-direction:column}
.vq-h{background:var(--grad);color:#fff;display:flex;align-items:center;gap:12px;padding:16px max(16px,calc(50% - 440px))}
.vq-h img{width:46px;height:46px;border-radius:12px}
.vq-h b{display:block;font-size:15px}.vq-h span{font-size:12px;opacity:.8}
.vq-main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:20px 16px}
.vq-card{animation:rise .35s ease-out both}
.vq-center{text-align:center;padding:36px 20px;display:grid;justify-items:center;gap:6px}
.vq-center h2{margin:6px 0 0}
.vq-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn)}
.vq-ic.ok{background:var(--ok-bg);color:var(--ok)}
.vq-ic .icon{width:26px;height:26px}
.vq-tax{justify-self:start}
.vq-f{text-align:center;font-size:12px;color:var(--ink-3);padding:16px}

/* ---------- ERP additions ---------- */
.pick{display:grid;gap:6px;min-width:0}
.card-h .card-print{width:30px;height:30px;opacity:0;transition:opacity .15s;flex:none}
.card:hover .card-print,.card-print:focus-visible{opacity:1}
@media (hover:none){.card-h .card-print{opacity:.7}}
#chart-tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.35;padding:7px 10px;border-radius:9px;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);display:none;max-width:260px}
.chart .bar-g,.clickable .slice{transition:opacity .15s}
.chart.clickable .bar-g,.clickable .slice{cursor:pointer}
.chart .bar-g:hover .bar,.slice:hover{filter:brightness(1.12)}
.legend .lg{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);padding:2px 6px;border-radius:6px;text-align:left}
.legend .lg:not(:disabled):hover,.legend .lg.on{background:var(--ice);color:var(--ink)}
.legend .lg:disabled{opacity:1;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;background:var(--ice);color:var(--brand-2);border:1px solid var(--ice-2);border-radius:999px;padding:4px 10px}
.chip .icon{width:12px;height:12px}
.toolbar.filters{align-items:flex-end;flex-wrap:wrap}
.toolbar.filters .field{min-width:150px;flex:1}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.signbox{display:grid;justify-items:center;text-align:center;gap:1px;border-top:1.5px solid var(--line-2);padding-top:4px;font-size:12px;color:var(--ink-2)}
.signbox .sigimg{height:52px;display:grid;place-items:center;width:100%;order:-1;border-bottom:1px dashed var(--line-2);margin-bottom:4px}
.signbox .sigimg img{max-height:50px;max-width:100%;object-fit:contain}
.signbox b{color:var(--ink);font-size:12.5px}
:root[data-theme="dark"] .signbox .sigimg img{filter:invert(1) hue-rotate(180deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .signbox .sigimg img{filter:invert(1) hue-rotate(180deg)}}
.sigpad{display:grid;gap:4px}
.sigpad canvas{width:100%;height:160px;background:#fff;border:1.5px dashed var(--line-2);border-radius:12px;touch-action:none;cursor:crosshair}
.scanner{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.search .scanbtn{width:28px;height:28px;border:0;background:var(--ice);color:var(--brand-2);flex:none}
.letter{font-size:13.5px;line-height:1.6}
.letter p{margin:0 0 10px}
.matrix{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:13px}
.formcard{display:grid;gap:6px;text-align:left;padding:18px;align-content:start;border:1.5px solid transparent;cursor:pointer}
.formcard:hover,.formcard.on{border-color:var(--brand-3)}
.formcard .ric{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ice);color:var(--brand-2)}
.formcard .link{font-weight:800;color:var(--brand-2);font-size:13px;margin-top:4px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stepcard{display:grid;gap:6px;align-content:start;justify-items:start;border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--surface-2)}
/* Stock: received / issued action tiles, receipt-type toggle, register */
.stock-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:stretch}
.sa{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font:inherit;color:var(--ink);transition:transform .15s,border-color .15s}
.sa:hover:not(:disabled){transform:translateY(-1px);border-color:var(--brand-3)}
.sa:disabled{opacity:.5;cursor:not-allowed}
.sa b{display:block;font-size:14.5px}.sa small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.sa-ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--ice);color:var(--brand-2)}
.sa-in .sa-ic{background:var(--ok-bg);color:var(--ok)} .sa-out .sa-ic{background:var(--warn-bg);color:var(--warn)}
.sa-more{align-content:center;justify-content:flex-end;max-width:260px}
.kind-toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kt{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font:inherit;color:var(--ink)}
.kt b{font-size:15px;letter-spacing:.02em}.kt span{font-size:12.5px;color:var(--ink-2)}
.kt.on.kt-p{border-color:var(--info);background:var(--info-bg)} .kt.on.kt-d{border-color:var(--ok);background:var(--ok-bg)}
.reg-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.rk{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);font:inherit;color:var(--ink)}
button.rk{cursor:pointer} button.rk.on{border-color:var(--brand-3);background:var(--ice)}
.rk span{font-size:11.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.rk b{font-size:20px}
.rk-p b,.c-p{color:var(--info)} .rk-d b,.c-d{color:var(--ok)} .rk-i b,.c-i{color:var(--warn)} .rk-bad b{color:var(--bad)}
.reg-tbl th small{font-weight:600;opacity:.75;text-transform:none;letter-spacing:0}
.reg-tbl td:nth-child(3){min-width:200px}
.reg-tbl tfoot td{border-top:2px solid var(--line-2);background:var(--surface-2)}
.import-mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.im{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);cursor:pointer;background:var(--surface-2)}
.im b{display:block}.im small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px;line-height:1.45}
.im.on{border-color:var(--brand-3);background:var(--ice)} .im.on.bad{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:900px){.stock-actions{grid-template-columns:1fr}.sa-more{max-width:none;justify-content:flex-start}.reg-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.import-mode,.kind-toggle{grid-template-columns:1fr}}
.blankform .bf-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.blankform .bf-fields div{display:grid;gap:2px;font-size:12px;color:var(--ink-2)}
.blankform .bf-fields i{display:block;border-bottom:1px solid var(--ink-3);height:20px}
.blankform .bf-checks{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px}
.bf-table td{height:28px}
.print-only{display:none}
#print-root{display:none}
/* collapsible sidebar: thin icon rail that opens while the mouse is over it */
.side-pin{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);flex:none}
.side-pin:hover{background:rgba(255,255,255,.22)}
.side-brand>div.lbl{min-width:0}
.side-toggle{display:none;flex:none}
.shell{transition:grid-template-columns .2s ease}
.shell.collapsed{grid-template-columns:72px minmax(0,1fr)}
.shell.collapsed .side-toggle{display:grid}
.shell.collapsed .side{width:72px;z-index:35;transition:width .2s ease,box-shadow .2s;padding:18px 12px}
.shell.collapsed .side:hover{width:248px;padding:18px 14px;box-shadow:12px 0 40px -12px rgba(11,46,138,.55)}
.shell.collapsed .side:not(:hover) .lbl{display:none}
.shell.collapsed .side:not(:hover) .nav button{justify-content:center;padding:10px 0;position:relative}
.shell.collapsed .side:not(:hover) .nav .count{position:absolute;top:2px;right:4px;font-size:9px;padding:0 4px;min-width:0}
.shell.collapsed .side:not(:hover) .side-brand{justify-content:center;padding:4px 0 16px}
.shell.collapsed .side:not(:hover) .side-user{padding:10px 6px;justify-items:center}
.shell.collapsed .side:not(:hover) .side-user .row{flex-direction:column;gap:10px;margin-top:0}
.side .nav button,.side-brand{white-space:nowrap}
.side-user>.lbl{display:grid;gap:2px;min-width:0}
.side-user>.lbl b,.side-user>.lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .row{flex-wrap:wrap;row-gap:6px}
.side .nav{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
/* AI assistant */
.ai{position:fixed;right:18px;bottom:18px;z-index:45;display:grid;justify-items:end;gap:10px}
.ai-fab{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;font-weight:800;border-radius:999px;padding:12px 16px;box-shadow:0 12px 30px -10px rgba(11,46,138,.7)}
.ai-fab:hover{filter:brightness(1.08)}
.ai-panel{width:min(400px,calc(100vw - 32px));height:min(560px,calc(100dvh - 120px));display:flex;flex-direction:column;overflow:hidden}
.ai-panel .card-h{align-items:center;gap:10px}
.ai-msgs{flex:1;overflow:auto;padding:12px 14px;display:grid;gap:8px;align-content:start}
.ai-msg{background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:13px;line-height:1.45;max-width:92%}
.ai-msg.me{justify-self:end;background:var(--brand-2);color:#fff;border-color:transparent;border-radius:14px 14px 4px 14px}
.ai-msg a{color:inherit;font-weight:800}
.ai-chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.ai-chips .chip{white-space:nowrap}
.ai-in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:pulse 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@media (max-width:980px){
  .shell.collapsed{grid-template-columns:1fr}
  .shell.collapsed .side-toggle,.side-toggle{display:none}
  .topbar .iconbtn[aria-label="Print this page"]{display:none}
  .topbar .search{display:flex!important;flex:0 0 auto;padding:0;border:0;background:none;margin-left:auto;max-width:none}
  .topbar .search>svg,.topbar .search>input,.topbar .search>.pop{display:none}
  .topbar .search .scanbtn{width:36px;height:36px;border:1px solid var(--line-2);background:var(--surface)}
  .ai{bottom:84px;right:12px}
  .ai-fab span{display:none}
  .mobilenav{grid-auto-columns:minmax(62px,1fr);overflow-x:auto;scrollbar-width:none}
  .blankform .bf-fields{grid-template-columns:1fr}
}
@media print{
  body.printing-area #app,body.printing-area .ai,body.printing-area #chart-tip{display:none!important}
  body.printing-area #print-root{display:block!important}
  #print-root .print-only{display:block}
  #print-root .modal{max-height:none;box-shadow:none;border:0;width:auto;overflow:visible}
  #print-root .modal-b{overflow:visible;max-height:none}
  #print-root .card{box-shadow:none;break-inside:avoid}
  #print-root .tbl-wrap{overflow:visible}
  .ai{display:none!important}
  *,*::before,*::after{animation:none!important;transition:none!important}
  #print-root .modal-h{background:none;color:#000;border-bottom:2px solid #0B2E8A}
  #print-root .modal-h .sm{color:#333!important}
}
@media print{
  .side,.topbar,.mobilenav,.toasts,.modal-f,.no-print{display:none!important}
  .shell{display:block} .content{padding:0;max-width:none}
  .overlay{position:static;background:none;padding:0;display:block}
  .modal{max-height:none;box-shadow:none;border:0}

  .card{box-shadow:none;break-inside:avoid}
}

/* ---------- Hero band ---------- */
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:22px 26px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden;box-shadow:0 20px 40px -22px rgba(11,46,138,.6)}
.hero::before{content:"";position:absolute;right:-80px;top:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.22),rgba(255,255,255,0) 62%)}
.hero>*{position:relative}
.hero h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.015em}
.hero p{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:13.5px;max-width:60ch}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap}
.hero .stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;min-width:110px}
.hero .stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.hero .stat span{font-size:11.5px;color:rgba(255,255,255,.8)}

@media (max-width:860px){.hero{grid-template-columns:1fr;padding:18px}.hero img{display:none}}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tbl tr.click:hover td{background:var(--ice)!important}
.tbl th{letter-spacing:.02em}
.item{border-radius:14px}
button.item{border-left:3px solid transparent}
button.item:hover{border-left-color:var(--brand-2);background:var(--surface-2)}
.rail .st.done .pt{background:linear-gradient(135deg,#0F8A5F,#19A874);box-shadow:0 6px 14px -6px rgba(15,138,95,.8)}
.rail .st.now .pt{background:var(--surface);border-width:2.5px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-2) 18%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--brand-2) 8%,transparent)}}
.modal-h{background:var(--grad);color:#fff;border-bottom:0}
.modal-h .sm.muted{color:rgba(255,255,255,.8)}
.modal-h .iconbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.modal{border-radius:22px}
@media (max-width:699px){.modal{border-radius:22px 22px 0 0}}
.actions{background:linear-gradient(180deg,var(--ice),var(--surface));border:1px solid var(--ice-2)}
.topbar{background:color-mix(in srgb,var(--bg) 80%,transparent)}
.seg{background:var(--ice-2)}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:34px 32px;box-shadow:var(--shadow)}
.quick button{border-radius:12px}
.login-hero h1{font-size:38px}
.tag{border-radius:8px}

/* ---------- Animated auth card ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:1fr auto;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,#DCE6F8 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#DCE6F8 0%,transparent 55%),var(--bg);position:relative;overflow:hidden}
.auth-bg i{position:absolute;border-radius:50%;background:var(--grad);opacity:.14;filter:blur(2px);animation:float 14s ease-in-out infinite}
.auth-bg i:nth-child(1){width:380px;height:380px;left:-120px;top:-100px}
.auth-bg i:nth-child(2){width:260px;height:260px;right:-80px;top:10%;animation-delay:-4s;animation-duration:18s}
.auth-bg i:nth-child(3){width:200px;height:200px;left:8%;bottom:-60px;animation-delay:-8s}
.auth-bg i:nth-child(4){width:140px;height:140px;right:14%;bottom:8%;animation-delay:-2s;animation-duration:11s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(8deg)}}
.auth-stage{width:100%;max-width:900px;perspective:1600px;position:relative;z-index:1}
.auth-card{position:relative;width:100%;height:580px;background:var(--surface);border-radius:32px;box-shadow:0 40px 90px -40px rgba(11,46,138,.55),0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden;transition:transform .35s ease;transform-style:preserve-3d}
.auth-card .form-box{position:absolute;top:0;width:50%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--surface);transition:all .6s cubic-bezier(.65,0,.35,1);z-index:1;padding:28px 36px;overflow:auto}
.auth-card .form-box form,.auth-card .roles{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.auth-card .form-box.fb-login{right:0;opacity:1;visibility:visible;transform:translateX(0)}
.auth-card.active .form-box.fb-login{transform:translateX(100%);opacity:0;visibility:hidden;z-index:0}
.auth-card .form-box.fb-register{left:0;opacity:0;visibility:hidden;transform:translateX(-100%)}
.auth-card.active .form-box.fb-register{transform:translateX(0);opacity:1;visibility:visible;z-index:1}
.auth-card h1{font-size:28px;font-weight:800;margin:4px 0 0;letter-spacing:-.02em}
.auth-card .lead{margin:0 0 6px;color:var(--ink-2);font-size:13.5px}
.auth-logo-sm{display:flex;align-items:center;gap:10px}
.auth-logo-sm img{width:44px;height:44px;border-radius:12px;box-shadow:0 8px 20px -10px rgba(11,46,138,.7)}
.auth-logo-sm b{display:block;font-size:13.5px;line-height:1.1}.auth-logo-sm span{font-size:11.5px;color:var(--ink-3)}
.input-box{position:relative;width:100%}
.input-box input{width:100%;background:var(--ice);border:1.5px solid transparent;border-radius:12px;padding:13px 46px 13px 15px;font-size:14px;font-weight:600;outline:none;transition:border-color .15s,background .15s}
.input-box input:focus{border-color:var(--brand-3);background:var(--surface)}
.input-box input::placeholder{color:var(--ink-3);font-weight:500}
.in-ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:18px;height:18px;pointer-events:none}
.in-ico.eye{pointer-events:auto;cursor:pointer;display:grid;place-items:center;width:28px;height:28px;right:9px;border-radius:8px}
.in-ico.eye:hover{color:var(--brand-2);background:var(--ice-2)}
.auth-btn{width:100%;background:var(--grad);color:#fff;padding:13px;border-radius:12px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 24px -10px rgba(11,81,167,.8);transition:transform .15s,filter .15s;margin-top:2px}
.auth-btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.auth-btn:active{transform:scale(.98)}
.hint{margin:4px 0 0;font-size:12px;color:var(--ink-3);text-align:center}
.link-btn{font-size:13px;font-weight:700;color:var(--brand-2);text-align:center;padding:6px}
.only-mobile{display:none}
.role-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.role{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:30px 1fr;gap:2px 10px;align-items:center;transition:border-color .15s,transform .15s,box-shadow .15s}
.role:hover{border-color:var(--brand-3);transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(11,46,138,.5)}
.role .ric{grid-row:1/3;width:30px;height:30px;border-radius:9px;background:var(--ice);color:var(--brand-2);display:grid;place-items:center}
.role b{font-size:13px}.role span:not(.ric){font-size:11px;color:var(--ink-3)}
.toggle-box{position:absolute;top:0;left:0;width:50%;height:100%;background:var(--grad);border-radius:0 160px 110px 0;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .6s cubic-bezier(.65,0,.35,1);overflow:hidden;box-shadow:12px 0 40px -20px rgba(11,46,138,.6)}
.toggle-box::before{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.22),rgba(255,255,255,0) 62%)}
.toggle-box::after{content:"";position:absolute;left:-80px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,0) 70%)}
.auth-card.active .toggle-box{transform:translateX(100%);border-radius:160px 0 0 110px;box-shadow:-12px 0 40px -20px rgba(11,46,138,.6)}
.toggle-panel{position:absolute;width:100%;height:100%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;transition:all .6s cubic-bezier(.65,0,.35,1);gap:10px}
.toggle-panel.toggle-left{transform:translateX(-200%)}.auth-card.active .toggle-panel.toggle-left{transform:translateX(0)}
.toggle-panel.toggle-right{transform:translateX(0)}.auth-card.active .toggle-panel.toggle-right{transform:translateX(200%)}
.toggle-panel h2{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1}
.toggle-panel p{margin:0;font-size:13.5px;color:rgba(255,255,255,.85);max-width:34ch}
.auth-logo{width:108px;height:108px;border-radius:26px;box-shadow:0 24px 50px -20px rgba(0,0,0,.65),0 0 0 6px rgba(255,255,255,.12);transform:translateZ(40px);animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotateY(-6deg)}50%{transform:translateY(-8px) rotateY(6deg)}}
.mini-flow{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:330px}
.mini-flow span{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 8px}
.toggle-btn{width:170px;height:46px;background:transparent;border:2px solid #fff;color:#fff;border-radius:12px;font-weight:800;margin-top:6px;transition:all .2s}
.toggle-btn:hover{background:#fff;color:var(--brand)}
.auth-foot{font-size:12px;color:var(--ink-3);padding-top:14px;position:relative;z-index:1}
@media (max-width:820px){
  .auth-card{height:720px;transform:none!important}
  .auth-card .form-box{width:100%;height:74%;top:auto;bottom:0;padding:26px 20px;align-items:flex-start}
  .auth-card .form-box.fb-login{right:0;left:0}
  .auth-card.active .form-box.fb-login{transform:translateY(100%)}
  .auth-card .form-box.fb-register{left:0;right:0;top:0;bottom:auto;transform:translateY(-100%)}
  .auth-card.active .form-box.fb-register{transform:translateY(0)}
  .toggle-box{width:100%;height:26%;border-radius:0 0 110px 110px}
  .auth-card.active .toggle-box{transform:translateY(284.6%);border-radius:110px 110px 0 0}
  .toggle-panel{padding:0 20px;gap:6px}.toggle-panel h2{font-size:20px}.toggle-panel p,.mini-flow,.toggle-btn{display:none}
  .auth-logo{width:70px;height:70px;border-radius:18px}
  .only-mobile{display:block}
  .role-grid{grid-template-columns:1fr;gap:6px}
  .role{padding:7px 10px;grid-template-columns:28px 1fr auto;gap:0 10px;align-items:center}
  .role .ric{grid-row:auto}
  .role b{font-size:12.5px}.role span:not(.ric){font-size:10.5px}
  .auth-card .roles h1{font-size:22px}
  .toggle-panel.toggle-left,.toggle-panel.toggle-right{transform:none!important;transition:opacity .3s}
  .toggle-panel.toggle-left{opacity:0}.auth-card.active .toggle-panel.toggle-left{opacity:1}
  .auth-card.active .toggle-panel.toggle-right{opacity:0}
  .toggle-panel h2{display:none}
}

/* ===================== Tasks (task planner) ===================== */
.tk-page{display:flex;flex-direction:column;gap:16px}
.tk-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.tk-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tk-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tk-kpis .kpi.on{box-shadow:0 0 0 2px var(--brand-3),var(--shadow)}
.tk-quick{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.tk-quick:focus-within{border-color:var(--brand-3);box-shadow:0 0 0 4px var(--ice-2)}
.tk-quick>svg{width:18px;height:18px;color:var(--brand-3);flex:none}
.tk-quick input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:40px;font:inherit;font-size:14.5px;color:var(--ink)}
.tk-quick input::placeholder{color:var(--ink-3)}
.tk-hint{font-size:12px;color:var(--ink-3);padding:0 6px;margin-top:-8px}
.tk-hint code{font-family:inherit;font-weight:700;background:var(--ice);color:var(--ink-2);padding:0 5px;border-radius:5px}
.tk-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-toolbar .select{height:38px;width:auto;max-width:190px}
.tk-search{flex:1 1 220px;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tk-search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.tk-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)}
.tk-views{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tk-views .seg button{display:inline-flex;align-items:center;gap:6px}
.tk-views .seg svg{width:14px;height:14px}
.tk-page{min-width:0}
.ua-box{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);display:grid;gap:10px}
.ua-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ua-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.ua-opt.on{border-color:var(--brand-3);color:var(--ink);box-shadow:0 0 0 2px var(--ice-2)}
.ua-opt svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.ua-opt em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:800;color:var(--warn)}
.ua-opt.wide{grid-column:1/-1}
.ua-opt input{accent-color:var(--brand-2)}
.tk-views .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.tk-views .seg::-webkit-scrollbar{display:none}
.tk-views .seg button{flex:none}
@media (max-width:560px){.tk-quick .btn-ghost{display:none}.tk-board{grid-auto-columns:86%}.tk-views .btn-primary{width:100%}}
.tk-timer{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-weight:800;font-size:12.5px}
.tk-timer svg{width:14px;height:14px}
.tk-timer button{height:24px;padding:0 10px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:800;font-size:11.5px}

/* board */
.tk-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(256px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tk-col{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:280px;scroll-snap-align:start;transition:border-color .15s,box-shadow .15s,background .15s}
.tk-col.over{border-color:var(--brand-3);background:var(--ice);box-shadow:inset 0 0 0 2px var(--brand-3)}
.tk-col.deny{opacity:.55}
.tk-col-h{display:flex;align-items:center;gap:8px;padding:13px 14px 10px;font-weight:800;font-size:13px;color:var(--ink)}
.tk-col-h i{width:9px;height:9px;border-radius:50%;flex:none}
.tk-col-h .n{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11.5px;color:var(--ink-3)}
.tk-col-b{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;max-height:68vh;overflow-y:auto}
.tk-col-empty{font-size:12px;color:var(--ink-3);text-align:center;padding:18px 6px;border:1px dashed var(--line-2);border-radius:12px}
.tk-card{position:relative;display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px 16px;cursor:pointer;color:var(--ink);transition:transform .12s,box-shadow .15s,border-color .15s}
.tk-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--pri)}
.tk-card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.tk-card.od{border-color:var(--bad)}
.tk-card.dragging{opacity:.4}
.tk-card-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;min-height:20px}
.tk-id{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.02em}
.tk-rep{display:inline-grid;color:var(--ink-3)}
.tk-rep svg{width:12px;height:12px}
.tk-ttl{font-weight:700;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tk-meta{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.tk-meta span{display:inline-flex;align-items:center;gap:4px}
.tk-meta svg{width:13px;height:13px}
.tk-meta .bad,.tk-bad{color:var(--bad)} .tk-meta .warn,.tk-warn{color:var(--warn)}
.tk-av{width:24px;height:24px;font-size:9.5px}
.tk-dept{font-size:11px;color:var(--ink-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* list */
.tk-tbl th{cursor:pointer;user-select:none;white-space:nowrap}
.tk-tbl th.on{color:var(--brand-2)}
.tk-tbl tbody tr{cursor:pointer}
.tk-tbl td.t{min-width:220px}

/* calendar */
.tk-cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1100px){.tk-cal-wrap{grid-template-columns:minmax(0,1fr)}}
.tk-cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tk-cal-h h3{margin:0;font-size:18px;min-width:160px}
.tk-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tk-cal .dow{background:var(--surface-2);padding:8px;text-align:center;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.tk-cal .day{background:var(--surface);min-width:0;min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;color:var(--ink);transition:background .15s}
.tk-cal .day:hover{background:var(--surface-2)}
.tk-cal .day.out{background:var(--surface-2);color:var(--ink-3)}
.tk-cal .day.sel{box-shadow:inset 0 0 0 2px var(--brand-3)}
.tk-cal .day.over{background:var(--ice);box-shadow:inset 0 0 0 2px var(--brand-3)}
.tk-cal .dn{font-size:12px;font-weight:800;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.tk-cal .day.today .dn{background:var(--grad);color:#fff}
.tk-cal .ev{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--pri);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-cal .ev.done{text-decoration:line-through;opacity:.55}
.tk-cal .ev.od{background:var(--bad-bg);color:var(--bad)}
.tk-cal .ev[draggable=true]{cursor:grab}
.tk-cal .more{font-size:10.5px;color:var(--ink-3);font-weight:700}
.tk-cal .dots{display:none;gap:3px;flex-wrap:wrap}
.tk-cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--pri);display:block}
@media (max-width:700px){.tk-cal .day{min-height:56px;padding:4px}.tk-cal .ev,.tk-cal .more{display:none}.tk-cal .dots{display:flex}}

/* rows used in agenda, workload, leaderboard */
.tk-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--ink);border-radius:10px}
.tk-row:last-child{border-bottom:0}
button.tk-row:hover{background:var(--surface-2)}
.tk-row .pri{width:4px;align-self:stretch;border-radius:3px;flex:none;background:var(--pri)}
.tk-row .g{flex:1;min-width:0}
.tk-row .g b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-row .g small{color:var(--ink-3);font-size:11.5px}
.tk-wl{display:grid;grid-template-columns:220px minmax(0,1fr) 130px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.tk-wl:last-child{border-bottom:0}
@media (max-width:760px){.tk-wl{grid-template-columns:minmax(0,1fr);gap:6px}}
.tk-who{display:flex;align-items:center;gap:10px;min-width:0}
.tk-who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-who small{color:var(--ink-3);font-size:11.5px}
.tk-bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);display:flex;overflow:hidden}
.tk-bar i{display:block;height:100%}
.tk-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);font-weight:700}
.tk-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.tk-rank{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface-2);color:var(--ink-2);flex:none}
.tk-rank.top{background:var(--warn-bg);color:var(--warn)}
.tk-stars{display:inline-flex;gap:2px}
.tk-stars button,.tk-stars span{font-size:18px;line-height:1;color:var(--line-2);padding:0 1px}
.tk-stars .on{color:#E0A100}
.tk-stars.sm span{font-size:12px}

/* task dialog */
.tk-title{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink);padding:2px 0}
.tk-title:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.tk-sec{display:flex;flex-direction:column;gap:8px}
.tk-sec>h4{margin:0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.tk-sec>h4 svg{width:15px;height:15px;color:var(--ink-3)}
.tk-sec>h4 .grow{flex:1}
.tk-sub{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:9px}
.tk-sub:hover{background:var(--surface-2)}
.tk-sub span{flex:1;font-size:13.5px;word-break:break-word}
.tk-sub.done span{text-decoration:line-through;color:var(--ink-3)}
.tk-chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.tk-chk.on{background:var(--ok);border-color:var(--ok)}
.tk-chk svg{width:12px;height:12px}
.tk-x{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.tk-x:hover{background:var(--bad-bg);color:var(--bad)}
.tk-x svg{width:14px;height:14px}
.tk-inline{display:flex;gap:8px}
.tk-inline .input{flex:1;min-width:0}
.tk-chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:999px;background:var(--ice);color:var(--brand-2);font-size:12px;font-weight:700}
.tk-chip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:inherit}
.tk-chip button:hover{background:rgba(0,0,0,.08)}
.tk-chip svg{width:11px;height:11px}
.tk-cmt{display:flex;gap:10px}
.tk-cmt .bubble{flex:1;min-width:0;background:var(--surface-2);border-radius:14px;padding:8px 12px}
.tk-cmt .bubble b{font-size:12.5px}
.tk-cmt .bubble small{color:var(--ink-3);margin-left:6px;font-size:11px}
.tk-cmt .bubble p{margin:3px 0 0;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.tk-cmt .m{color:var(--brand-2);font-weight:800}
.tk-mention{position:absolute;left:0;right:0;bottom:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:200px;overflow-y:auto;z-index:5;padding:4px}
.tk-mention button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;text-align:left;color:var(--ink);font-size:13px}
.tk-mention button:hover,.tk-mention button.on{background:var(--ice)}
.tk-act{font-size:12px;color:var(--ink-2);padding:5px 0;border-bottom:1px dashed var(--line)}
.tk-act:last-child{border-bottom:0}
.tk-flow{display:flex;gap:4px;flex-wrap:wrap}
.tk-flow span{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.tk-flow span.past{background:var(--ok-bg);color:var(--ok)}
.tk-flow span.now{background:var(--grad);color:#fff}
.tk-moves{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
.tk-file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.tk-file .g{flex:1;min-width:0}
.tk-file .g b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-file .g small{color:var(--ink-3);font-size:11.5px}
</style>

/* Requests created under the old flow (submitted → verified → approved …) keep working:
   an old "verified" procurement request goes back to Finance so no new step is skipped. */
function migrateRequest(r){
  if(r.type==="procurement"&&r.stage==="verified") r.stage="submitted";
  r.attachments=r.attachments||[]; r.links=r.links||{};
  return r;
}
/* The stage key stored on a request is the LAST COMPLETED stage.
   The next stage's owner is who must act. */
function stageIndex(req){ return FLOW[req.type].findIndex(s=>s.key===req.stage); }
function nextStage(req){ if(req.status==="rejected"||req.stage==="closed") return null; return FLOW[req.type][stageIndex(req)+1]||null; }
function ownerOf(req){ const n=nextStage(req); return n?n.owner:null; }
function statusLabel(req){
  if(req.status==="rejected") return "Rejected";
  if(req.status==="cancelled") return "Cancelled";
  if(req.stage==="closed") return "Completed";
  const n=nextStage(req); return "Awaiting "+(n?n.who:"");
}
function statusTone(req){
  if(req.status==="rejected"||req.status==="cancelled") return "bad";
  if(req.stage==="closed") return "ok";
  if(APPROVER_ROLES.includes(ownerOf(req))) return "violet";
  if(ownerOf(req)==="hod") return "info";
  return "warn";
}
function hoursSince(iso){ return (Date.now()-new Date(iso).getTime())/36e5; }
function isEscalated(req){
  if(req.status!=="active"||req.stage==="closed") return false;
  const last=req.timeline[req.timeline.length-1];
  return hoursSince(last.at) > SETTINGS.escalationHours;
}
function reqTotal(req){ return req.items.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0); }

/* ===== FBR tax (unchanged rules) ===== */
function whtRate(type,filer){ return type==="Services" ? (filer?SETTINGS.whtServicesFiler:SETTINGS.whtServicesNonFiler) : (filer?SETTINGS.whtGoodsFiler:SETTINGS.whtGoodsNonFiler); }
function taxCalc(sub,type,filer){
  const gst=Math.round(sub*SETTINGS.gst), wht=Math.round(sub*whtRate(type,filer));
  return { gst, wht, net: sub+gst-wht };
}
/* Quotation tax: if the vendor's amount already includes all taxes it is split back into
   subtotal + GST; otherwise GST is added from the vendor's profile (GST-registered or not).
   gross = total cost to Alkhidmat (used to compare vendors); net = payable after WHT. */
function quoteCalc(amount,inclusive,v){
  const g=v&&v.gstRegistered===false?0:SETTINGS.gst; const a=Number(amount)||0;
  const sub=inclusive?Math.round(a/(1+g)):Math.round(a); const gst=inclusive?Math.round(a)-sub:Math.round(sub*g);
  const gross=sub+gst; const wht=Math.round(sub*whtRate((v||{}).type,(v||{}).filer));
  return { sub, gst, gross, wht, net:gross-wht, inclusive:!!inclusive, gstRate:g };
}
const grossOf = q => q.gross||((q.sub||0)+(q.gst||0));
/* Scoring 60 / 20 / 10 / 10 : price, documents, past performance, delivery */
function scoreQuotes(quotes, vendors){
  const subs=quotes.filter(q=>q.status==="Submitted");
  if(!subs.length) return {};
  const lowest=Math.min(...subs.map(grossOf));
  const fastest=Math.min(...subs.map(q=>q.deliveryDays||1));
  const out={};
  subs.forEach(q=>{
    const v=vendors.find(v=>v.id===q.vendorId)||{};
    const price=Math.round(60*lowest/grossOf(q));
    const docs=Math.round(20*(q.docs||0)/100);
    const perf=Math.round(10*(v.rating||3)/5);
    const del=Math.round(10*fastest/(q.deliveryDays||1));
    out[q.id]={price,docs,perf,del,total:price+docs+perf+del};
  });
  return out;
}

const pkr = n => "PKR "+fmt(n);
const pad = (n,l=4) => String(n).padStart(l,"0");
function nowISO(){ return new Date().toISOString(); }
function fmtDT(iso){ const d=new Date(iso); return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function fmtD(iso){ return new Date(iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function monthKey(iso){ const d=new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}`; }
function uid(){ return Math.random().toString(36).slice(2,8); }
function ago(iso){ const h=hoursSince(iso); if(h<1) return Math.max(1,Math.round(h*60))+" min ago"; if(h<24) return Math.round(h)+" h ago"; return Math.round(h/24)+" d ago"; }
const daysAgo = (d,h=9,m=0)=>{ const t=new Date(); t.setDate(t.getDate()-d); t.setHours(h,m,0,0); return t.toISOString(); };

/* ===== Budget helpers ===== */
function budgetUse(state, code){
  const reqs=state.requests.filter(r=>r.projectCode===code&&r.status==="active");
  const poSpend=state.pos.filter(p=>(state.requests.find(r=>r.id===p.requestId)||{}).projectCode===code).reduce((s,p)=>s+p.net,0);
  const committed=reqs.filter(r=>!r.links.po&&r.stage!=="closed").reduce((s,r)=>s+reqTotal(r),0);
  const b=state.budgets.find(b=>b.code===code);
  const allocated=b?b.allocated:0;
  return { allocated, spent:poSpend, committed, remaining:allocated-poSpend-committed, exists:!!b };
}

/* ===== Storage backend =====
   LOCAL mode (default): everything in this browser's localStorage.
   SUPABASE mode: window.AKF_SUPABASE = { url, anonKey, emailDomain } is set and
   the supabase-js library is present. Every record becomes one row in the
   public.portal_rows table (collection, id, data); logins use Supabase Auth. */
const SB_CONFIG = (typeof window!=="undefined" && window.AKF_SUPABASE) || null;
const SB_READY = !!(SB_CONFIG && SB_CONFIG.url && SB_CONFIG.anonKey && !/YOUR-PROJECT|YOUR-ANON/i.test(SB_CONFIG.url+SB_CONFIG.anonKey) && typeof supabase!=="undefined");
const SB_MODE = !!SB_CONFIG;
const sb = SB_READY ? supabase.createClient(SB_CONFIG.url, SB_CONFIG.anonKey) : null;

const COLLECTIONS = ["users","vendors","stock","ledger","docs","requests","rfqs","pos","audit","smsLog","budgets","invoices","assets","beneficiaries","tasks"];
/* tasks use a random key as the row id, so two people creating a task at the same moment never overwrite each other */
const KEY_FIELD = { assets:"tag", tasks:"key" };
const NEWEST_FIRST = { ledger:"at", docs:"at", requests:"createdAt", rfqs:"at", pos:"at", audit:"at", smsLog:"at", beneficiaries:"at", assets:"at", invoices:"at", tasks:"createdAt" };
function rowKey(col,item){ const k=KEY_FIELD[col]||"id"; if(!item[k]) item[k]=(col==="budgets"&&item.code)?item.code:uid(); return String(item[k]); }
function emailFor(username){ return username.includes("@")?username:`${username}@${(SB_CONFIG&&SB_CONFIG.emailDomain)||"akf.local"}`; }

const DB = {
  /* read everything and rebuild the in-memory state object */
  async load(){
    const authLoaded=!!(await sb.auth.getSession()).data.session;
    /* Supabase returns at most 1,000 rows per request, so read page by page. A single request silently
       dropped the newest rows (new tasks, requests, stock moves) once the table passed 1,000 rows. */
    let data=[], error=null;
    for(let from=0;;from+=1000){
      const res=await sb.from("portal_rows").select("collection,id,data,created_at").order("created_at",{ascending:true}).order("collection",{ascending:true}).order("id",{ascending:true}).range(from,from+999);
      if(res.error){ error=res.error; break; }
      data=data.concat(res.data||[]);
      if(!res.data||res.data.length<1000) break;
    }
    /* before sign-in the locked table refuses the public key: show the login screen, not an error */
    if(error && !authLoaded && (error.code==="42501" || /permission denied/i.test(error.message||""))){ data=[]; error=null; }
    if(error) throw error;
    const seed=seedState();
    const state={ version:3, settings:{...DEFAULT_SETTINGS} };
    COLLECTIONS.forEach(c=>state[c]=[]);
    (data||[]).forEach(r=>{ if(r.collection==="settings"){ state.settings={...DEFAULT_SETTINGS,...r.data}; return; } if(state[r.collection]) state[r.collection].push(r.data); });
    Object.entries(NEWEST_FIRST).forEach(([c,f])=>state[c].sort((a,b)=>(a[f]||"")<(b[f]||"")?1:-1));
    state.requests.forEach(migrateRequest); normalizeVendorQuotes(state);
    state.empty = data.length===0; state.authLoaded = authLoaded;
    state.seeded = state.requests.length>0;
    return state;
  },
  /* write only what changed between prev and next */
  async save(prev,next){
    const upserts=[], deletes=[];
    COLLECTIONS.forEach(col=>{
      const before=new Map((prev[col]||[]).map(i=>[rowKey(col,i),JSON.stringify(i)]));
      const after=new Set();
      (next[col]||[]).forEach(item=>{ const k=rowKey(col,item); after.add(k); const j=JSON.stringify(item); if(before.get(k)!==j) upserts.push({collection:col,id:k,data:item}); });
      before.forEach((_,k)=>{ if(!after.has(k)) deletes.push({col,k}); });
    });
    if(JSON.stringify(prev.settings)!==JSON.stringify(next.settings)) upserts.push({collection:"settings",id:"global",data:next.settings});
    if(upserts.length){ const { error } = await sb.from("portal_rows").upsert(upserts,{onConflict:"collection,id"}); if(error) throw error; }
    for(const col of new Set(deletes.map(d=>d.col))){ const ids=deletes.filter(d=>d.col===col).map(d=>d.k); const { error } = await sb.from("portal_rows").delete().eq("collection",col).in("id",ids); if(error) throw error; }
    return upserts.length+deletes.length;
  },
  /* replace everything except user profiles (used by demo seed / restore) */
  async replaceAll(next,keepUsers=true){
    const current=await DB.load();
    const blank={ settings:{...DEFAULT_SETTINGS} }; COLLECTIONS.forEach(c=>blank[c]=[]);
    if(keepUsers){ blank.users=current.users; next={...next,users:current.users}; }
    await DB.save(current,blank);
    await DB.save(blank,next);
  },
  subscribe(onChange){
    const ch=sb.channel("portal-rows").on("postgres_changes",{event:"*",schema:"public",table:"portal_rows"},()=>onChange()).subscribe();
    return ()=>sb.removeChannel(ch);
  },
  /* ---- auth ---- */
  async signIn(username,password){
    const { data, error } = await sb.auth.signInWithPassword({ email:emailFor(username.trim().toLowerCase()), password });
    if(error) throw error; return data.user;
  },
  async session(){ const { data } = await sb.auth.getSession(); return data.session?data.session.user:null; },
  /* vendor magic link (no login): security-definer functions expose only that one RFQ — see supabase-update.sql */
  async vendorRfq(token){ const { data, error } = await sb.rpc("rfq_for_vendor",{ p_token:token }); if(error) throw error; return data; },
  async vendorSubmit(token,quote){ const { data, error } = await sb.rpc("rfq_submit_quote",{ p_token:token, p_quote:quote }); if(error) throw error; return data; },
  async signOut(){ await sb.auth.signOut(); },
  async changePassword(next){ const { error } = await sb.auth.updateUser({ password:next }); if(error) throw error; },
  /* a second client that does not keep a session, so creating a login never signs the Super Admin out */
  async createLogin(username,password){ const tmp=supabase.createClient(SB_CONFIG.url, SB_CONFIG.anonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"akf-signup-tmp"}}); const { error } = await tmp.auth.signUp({ email:emailFor(username.trim().toLowerCase()), password }); if(error) throw error; },
  onAuth(cb){ const { data } = sb.auth.onAuthStateChange((_e,s)=>cb(s?s.user:null)); return ()=>data.subscription.unsubscribe(); },
};
/* Map a Supabase auth user to a portal profile (users collection). The very first
   person to sign in on an empty portal becomes Super Admin automatically. */
function profileFor(state, authUser){
  const email=(authUser.email||"").toLowerCase(); const uname=email.split("@")[0];
  return state.users.find(u=>(u.email||"").toLowerCase()===email) || state.users.find(u=>u.username===uname) || null;
}

/* ---------- Print only the open area ----------
   The chosen node is cloned into #print-root and only that is printed.
   With a dialog open, the dialog is printed; otherwise the current page (no sidebar). */
function printNode(node){
  if(!node){ window.print(); return; }
  let root=document.getElementById("print-root"); if(!root){ root=document.createElement("div"); root.id="print-root"; document.body.appendChild(root); }
  const clone=node.cloneNode(true); clone.querySelectorAll(".no-print,.modal-f,.card-print,.close").forEach(n=>n.remove());
  node.querySelectorAll("canvas").forEach((c,i)=>{ const cc=clone.querySelectorAll("canvas")[i]; if(cc){ const img=document.createElement("img"); img.src=c.toDataURL(); img.style.maxWidth="100%"; cc.replaceWith(img); } });
  root.innerHTML=""; root.appendChild(clone); document.body.classList.add("printing-area");
  const done=()=>{ document.body.classList.remove("printing-area"); root.innerHTML=""; window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done); setTimeout(()=>window.print(),30);
}
function printOpenArea(){
  const modals=document.querySelectorAll(".overlay .modal"); if(modals.length) return printNode(modals[modals.length-1]);

  const [other,setOther]=useState(custom);
  const show=other||custom;
  return html`<div class="pick" style=${style||""}><select class="select" disabled=${disabled} value=${show?"__other":value} onChange=${e=>{ if(e.target.value==="__other"){ setOther(true); onChange(""); } else { setOther(false); onChange(e.target.value); } }}>${opts.map(o=>html`<option value=${o}>${labels&&labels[o]?labels[o]:o}</option>`)}<option value="__other">Other…</option></select>${show&&html`<input class="input" placeholder=${placeholder||"Please specify…"} value=${custom?value:""} disabled=${disabled} onInput=${e=>onChange(e.target.value)}/>`}</div>`;
}

function parseAnyDate(v){

  const s=String(v).trim(); let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); if(m) return `${m[1]}-${pad(+m[2],2)}-${pad(+m[3],2)}`;
  m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(s); if(m){ let y=+m[3]; if(y<100) y+=2000; const d=+m[1], mo=+m[2]; if(mo<1||mo>12||d<1||d>31) return ""; return `${y}-${pad(mo,2)}-${pad(d,2)}`; }

function normCondition(text,name){

  if(/repair/i.test(probe)) return CONDITIONS[2];
  if(/\bused\b|\bold\b|second|refurb/i.test(probe)) return CONDITIONS[1];
