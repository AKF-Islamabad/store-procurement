function buildInsights(state,user){
  const out=[]; const reqs=visibleRequests(user,state.requests); const open=reqs.filter(r=>r.status==="active"&&r.stage!=="closed");
  const mine=reqs.filter(r=>canAct(user,r)); if(mine.length) out.push({tone:"warn",t:`${mine.length} request${mine.length>1?"s":""} waiting for your action`,d:mine.slice(0,3).map(r=>r.id).join(", ")+(mine.length>3?"…":""),id:mine[0].id});
  const esc=open.filter(isEscalated); if(esc.length){ const by={}; esc.forEach(r=>{ const w=nextStage(r).who; by[w]=(by[w]||0)+1; }); const [w,c]=Object.entries(by).sort((a,b)=>b[1]-a[1])[0]; out.push({tone:"bad",t:`Bottleneck: ${w} has ${c} request${c>1?"s":""} over ${SETTINGS.escalationHours}h`,d:"Send a reminder or name an acting approver in Settings.",id:esc[0].id}); }
  const hrs={}; reqs.forEach(r=>r.timeline.forEach((t,i)=>{ if(!i) return; const k=(FLOW[r.type]||[]).find(s=>s.key===t.stage); if(!k) return; (hrs[k.who]=hrs[k.who]||[]).push((new Date(t.at)-new Date(r.timeline[i-1].at))/36e5); }));
  const slow=Object.entries(hrs).map(([w,a])=>[w,a.reduce((s,x)=>s+x,0)/a.length]).sort((a,b)=>b[1]-a[1])[0]; if(slow&&slow[1]>24) out.push({tone:"info",t:`Slowest step on average: ${slow[0]} (${Math.round(slow[1])}h)`,d:"Agreeing a 24-hour service level for this step would shorten the whole cycle.",tab:"reports"});
  if(!["hod","admin_officer","finance"].includes(user.role)){ const low=state.stock.filter(s=>s.qty<=s.min); if(low.length) out.push({tone:"warn",t:`${low.length} stock item${low.length>1?"s":""} at or below minimum`,d:low.slice(0,4).map(s=>`${s.name} (${s.qty}/${s.min})`).join(", ")+" — raise a reorder from the Store page.",tab:"store"});
    const exp=state.stock.filter(s=>s.expiry&&(new Date(s.expiry)-Date.now())/864e5<30&&s.qty>0); if(exp.length) out.push({tone:"warn",t:`${exp.length} item${exp.length>1?"s":""} expiring within 30 days`,d:exp.map(s=>s.name).join(", ")+" — issue first (FEFO) or plan disposal.",tab:"store"}); }
  if(["super","finance","president","regional_manager","manager_hr","gen_sec"].includes(user.role)) state.budgets.forEach(b=>{ const u=budgetUse(state,b.code); if(u.allocated&&u.remaining<0) out.push({tone:"bad",t:`Budget ${b.code} is over by ${pkr(-u.remaining)}`,d:"Finance should revise the line or hold new requests.",tab:"finance"}); else if(u.allocated&&(u.spent+u.committed)/u.allocated>0.85) out.push({tone:"info",t:`Budget ${b.code} is ${Math.round((u.spent+u.committed)/u.allocated*100)}% used`,d:`${pkr(u.remaining)} left.`,tab:"finance"}); });
  const openRfq=state.rfqs.filter(r=>r.status==="Open"&&new Date(r.deadline)<new Date()); if(openRfq.length&&["super","admin_officer"].includes(user.role)) out.push({tone:"warn",t:`${openRfq.length} RFQ${openRfq.length>1?"s":""} past deadline still open`,d:"Close them and send the comparative statement to the committee.",id:openRfq[0].requestId});
  const noSig=state.users.filter(u=>u.active&&(APPROVER_ROLES.includes(u.role)||["store_officer","admin_officer"].includes(u.role))&&!u.signature); if(user.role==="super"&&noSig.length) out.push({tone:"info",t:`${noSig.length} signing officer${noSig.length>1?"s have":" has"} no signature on file`,d:noSig.map(u=>u.name).join(", "),tab:"users"});
  const vend=state.vendors.filter(v=>!(v.ntn&&v.bank&&v.cheque)); if(vend.length&&["super","admin_officer"].includes(user.role)) out.push({tone:"info",t:`${vend.length} vendor${vend.length>1?"s":""} with incomplete documents`,d:"They cannot receive RFQs until NTN, bank and cheque copy are recorded.",tab:"vendors"});
  if(!out.length) out.push({tone:"ok",t:"Everything is on track",d:"No delays, stock alerts or budget risks right now."});
  return out;
}

/* Built-in answers: understands status look-ups, "pending", "stock", "budget", "vendor", "how do I …" */
function builtinAnswer(q,state,user){
  const s=q.toLowerCase(); const reqs=visibleRequests(user,state.requests);
  const idm=/akf-(mr|sr)-\d{4}-\d{4}|po-\d{4}-\d{4}|rfq-\d{4}-\d{3}/i.exec(q);
  if(idm){ const id=idm[0].toUpperCase(); const r=reqs.find(x=>x.id===id); if(r){ const n=nextStage(r); const last=r.timeline[r.timeline.length-1]; return `**${r.id}** — ${r.purpose} (${r.dept}, ${pkr(reqTotal(r))}).\nStatus: **${statusLabel(r)}**. Last step: ${last.action} by ${last.by}, ${ago(last.at)}.${n?`\nNext: **${n.label}** by **${n.who}**.${isEscalated(r)?" ⚠ This step is past the escalation limit.":""}`:""}`; } const po=state.pos.find(p=>p.id===id); if(po) return `**${po.id}**: ${(state.vendors.find(v=>v.id===po.vendorId)||{}).name}, total incl. tax ${pkr(po.gross||po.net)}, status ${po.status}, delivery by ${fmtD(po.deliveryBy)}.`; return `I could not find ${id} among the records you can see.`; }
  if(/pending|waiting|my action|to do|todo/.test(s)){ const mine=reqs.filter(r=>canAct(user,r)); return mine.length?`You have **${mine.length}** item(s) waiting:\n`+mine.map(r=>`• ${r.id} — ${nextStage(r).label} · ${r.purpose} · ${pkr(reqTotal(r))}`).join("\n"):"Nothing is waiting for you right now. 👍"; }
  if(/delay|late|escalat|bottleneck|slow/.test(s)){ const e=reqs.filter(isEscalated); return e.length?`**${e.length}** request(s) are past ${SETTINGS.escalationHours}h:\n`+e.map(r=>`• ${r.id} waiting for ${nextStage(r).who} for ${Math.round(hoursSince(r.timeline[r.timeline.length-1].at))}h`).join("\n"):"No request is past the escalation limit."; }
  if(/stock|store|inventory|expir|minimum|reorder/.test(s)){ const low=state.stock.filter(x=>x.qty<=x.min), exp=state.stock.filter(x=>x.expiry&&(new Date(x.expiry)-Date.now())/864e5<30); return `Stock: **${state.stock.length}** items worth **${pkr(state.stock.reduce((a,x)=>a+x.qty*x.price,0))}**.\n`+(low.length?`Below minimum: ${low.map(x=>`${x.name} (${x.qty}/${x.min} ${x.uom})`).join(", ")}.\n`:"No item is below minimum.\n")+(exp.length?`Expiring within 30 days: ${exp.map(x=>`${x.name} (${fmtD(x.expiry)})`).join(", ")}.`:"Nothing expires within 30 days."); }
  if(/budget|fund|allocat|spend|spent/.test(s)) return "Budget lines:\n"+state.budgets.map(b=>{ const u=budgetUse(state,b.code); return `• ${b.code}: ${pkr(u.allocated)} allocated, ${pkr(u.spent)} spent, ${pkr(u.committed)} committed → **${pkr(u.remaining)}** left`; }).join("\n");
  if(/vendor|supplier|quotation|rfq/.test(s)){ const top=state.vendors.map(v=>({v,n:state.pos.filter(p=>p.vendorId===v.id).length})).sort((a,b)=>b.n-a.n).slice(0,3); return `**${state.vendors.length}** vendors (${state.vendors.filter(v=>v.filer).length} filers). Open RFQs: ${state.rfqs.filter(r=>r.status==="Open").length}.\nMost POs: ${top.map(x=>`${x.v.name} (${x.n})`).join(", ")}.\nTip: always compare totals **including tax** — the portal adds GST automatically when a vendor's price excludes it.`; }
  if(/tax|gst|wht|filer/.test(s)) return `GST ${Math.round(SETTINGS.gst*100)}% is added to quotations that exclude tax (only for GST-registered vendors). WHT at payment: goods ${SETTINGS.whtGoodsFiler*100}% filer / ${SETTINGS.whtGoodsNonFiler*100}% non-filer; services ${SETTINGS.whtServicesFiler*100}% / ${SETTINGS.whtServicesNonFiler*100}%.`;
  if(/how|process|flow|step|matrix|approv/.test(s)) return "**Procurement:** "+FLOW.procurement.map(x=>x.who+" ("+x.label+")").join(" → ")+`.\nAbove ${pkr(SETTINGS.directPurchaseLimit||100000)}: RFQ to vendors → committee selects one vendor (comparative statement) → PO + regret letters → GRN-P → GIN to HOD or place in store.\n\n**Store:** `+FLOW.store.map(x=>x.who+" ("+x.label+")").join(" → ")+".\nRaise either one from **Request Forms**.";
  if(/suggest|recommend|improve|better|tip/.test(s)) return "Recommendations right now:\n"+buildInsights(state,user).map(i=>`• **${i.t}** — ${i.d}`).join("\n");
  if(/hello|hi|salam|assalam/.test(s)) return `Wa alaikum assalam ${user.name.split(" ")[0]}! Ask me about pending approvals, a request ID, stock, budgets, vendors, taxes or the approval process.`;
  return "I can answer from live portal data: try **What is pending for me?**, **Any delays?**, **Stock alerts**, **Budget status**, **Vendors**, **How does approval work?**, **Recommendations**, or type a request ID like AKF-MR-2026-0003."+(SETTINGS.aiProvider!=="gemini"?"\n\nFor open-ended questions the Super Admin can connect a free Google Gemini key in Settings → AI assistant.":"");
}

function loadState(){ try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const s=JSON.parse(raw); if(s&&s.version>=2){ const seed=seedState(); s.budgets=s.budgets||seed.budgets; s.invoices=s.invoices||seed.invoices; s.settings={...DEFAULT_SETTINGS,...(s.settings||{})}; s.assets=s.assets||seed.assets; s.requests.forEach(migrateRequest); normalizeVendorQuotes(s); seed.users.forEach(u=>{ if(!s.users.some(x=>x.username===u.username)&&APPROVER_ROLES.includes(u.role)) s.users.push(u); }); s.version=3; return s; } } }catch(e){} return seedState(); }
function saveState(s){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(s)); }catch(e){} }
function loadSession(){ try{ return sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY)||null; }catch(e){ return null; } }

const TSTAGE=Object.fromEntries(TSTAGES.map((s,i)=>[s.k,{...s,i}]));
const TPRI={ Urgent:{tone:"bad",color:"#D23B3B",rank:0}, High:{tone:"warn",color:"#E08A12",rank:1}, Medium:{tone:"info",color:"#2567CF",rank:2}, Low:{tone:"neutral",color:"#9AA5BD",rank:3} };
const TREC={ none:"Does not repeat", daily:"Every day", weekly:"Every week", monthly:"Every month" };
const TASK_ADMIN=["super","regional_manager"];               // manage every task
const TASK_VIEW_ALL=["super","regional_manager","president","gen_sec"];
const TASK_NO_CREATE=["president","gen_sec"];               // view and comment only
const T_OPEN=["new","progress","review","hod","approved"];
const T_WORK=["new","progress","review","hod"];             // counted as overdue after the planned date

/* ---- dates: always local calendar days (no UTC shift) ---- */
const tISO=d=>d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);
const tToday=()=>tISO(new Date());
function tDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); if(!m) return null; const d=new Date(+m[1],+m[2]-1,+m[3]); return d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?d:null; }
function tAddDays(s,n){ const d=tDate(s)||new Date(); d.setDate(d.getDate()+n); return tISO(d); }
/* month step that keeps the wanted day where the month has it (31 Jan → 28/29 Feb → 31 Mar) */
function tAddMonths(s,n,day){ const d=tDate(s)||new Date(); const want=day||d.getDate(); const x=new Date(d.getFullYear(),d.getMonth()+n,1); const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(want,last)); return tISO(x); }
const tFmt=s=>{ const d=tDate(s); return d?d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}):"No date"; };
const tFmtY=s=>{ const d=tDate(s); return d?d.toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}):"No date"; };
const tLocalDay=iso=>iso?tISO(new Date(iso)):"";
const tMin=m=>{ m=Math.round(m||0); if(!m) return "0m"; const h=Math.floor(m/60), r=m%60; return (h?h+"h":"")+(h&&r?" ":"")+(r?r+"m":""); };
/* "1h 30m", "1.5h", "45m", "45" → minutes. A bare number means minutes. */
function tParseMin(v){ const s=String(v||"").trim().toLowerCase(); if(!s) return 0; if(/^\d+(\.\d+)?$/.test(s)) return Math.round(+s);
  let tot=0, ok=false; const rest=s.replace(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)\b/g,(_,n,u)=>{ ok=true; tot+=u[0]==="h"?n*60:+n; return ""; });
  return ok&&!rest.trim()?Math.round(tot):NaN; }
const tToast=(m,t)=>window.__toast&&window.__toast(m,t);
const tLS={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} } };
const tNum=t=>{ const m=/(\d+)-(\d+)$/.exec(t.id||""); return m?(+m[1])*1e6+(+m[2]):0; };

/* ---- who may do what ---- */
const tUser=(state,id)=>state.users.find(u=>u.id===id);
const tIsAdmin=u=>TASK_ADMIN.includes(u.role)||!!u.taskAdmin;   // taskAdmin: ticked by the Super Admin under Users → Access
function taskVisible(u,t){ return TASK_VIEW_ALL.includes(u.role)||!!u.taskAdmin||t.assigneeId===u.id||t.creatorId===u.id||(u.role==="hod"&&t.dept===u.dept)||(t.watchers||[]).includes(u.id); }
function tCanManage(u,t){ return tIsAdmin(u)||(u.role==="hod"&&t.dept===u.dept)||t.creatorId===u.id; }   // fields, dates, assignee
function tCanWork(u,t){ return tCanManage(u,t)||t.assigneeId===u.id; }                                   // checklist, time, files
function tIsApprover(u,t){ return (tIsAdmin(u)||(u.role==="hod"&&t.dept===u.dept))&&u.id!==t.assigneeId; }
function tCanDelete(u,t){ return tIsAdmin(u)||(u.role==="hod"&&t.dept===u.dept&&t.assigneeId!==u.id)||(t.creatorId===u.id&&t.stage==="new"); }
const tCanCreate=u=>!TASK_NO_CREATE.includes(u.role);
const tDeptsFor=u=>tIsAdmin(u)?DEPTS:[u.dept];
function tAssignable(state,u,dept){ const act=state.users.filter(x=>x.active&&!TASK_NO_CREATE.includes(x.role)); return tIsAdmin(u)?act:act.filter(x=>x.dept===dept||x.id===u.id); }
const tOverdue=t=>T_WORK.includes(t.stage)&&!!t.plannedDate&&t.plannedDate<tToday();
function tDepsOpen(state,t){ return (t.deps||[]).map(k=>(state.tasks||[]).find(x=>x.key===k)).filter(x=>x&&x.stage!=="done"&&x.stage!=="cancelled"); }
/* the HOD of the task's department decides; Regional Manager / Super Admin step in when there is no HOD or the HOD is the assignee */
function tPrimaryApprover(state,u,t){ const hod=state.users.some(x=>x.active&&x.role==="hod"&&x.dept===t.dept&&x.id!==t.assigneeId); return u.role==="hod"?tIsApprover(u,t):(tIsAdmin(u)&&!hod&&u.id!==t.assigneeId); }

/* the buttons a user may press on a task right now */
function taskMoves(u,t){
  const m=[]; const appr=tIsApprover(u,t), work=tCanWork(u,t);
  const reviewer=t.creatorId!==t.assigneeId&&t.creatorId===u.id&&!appr;
  const back={to:"progress",label:"Send back",icon:"back",tone:"btn-ghost",comment:true};
  if(t.stage==="new"&&work) m.push({to:"progress",label:"Start work",icon:"play",tone:"btn-primary"});
  if(t.stage==="progress"&&work) m.push({to:"review",label:"Submit for review",icon:"send",tone:"btn-primary"});
  if(t.stage==="review"){ if(appr) m.push({to:"approved",label:"Approve",icon:"check",tone:"btn-ok"}); else if(reviewer) m.push({to:"hod",label:"Checked · send to HOD",icon:"send",tone:"btn-primary"}); if(appr||reviewer) m.push(back); }
  if(t.stage==="hod"&&appr) m.push({to:"approved",label:"Approve",icon:"check",tone:"btn-ok"},back);
  if(t.stage==="approved"&&appr) m.push({to:"done",label:"Close as done",icon:"check",tone:"btn-ok"},back);
  if(t.stage==="done"&&appr) m.push({to:"progress",label:"Reopen",icon:"refresh",tone:"btn-ghost",comment:true});
  if(t.stage==="cancelled"&&appr) m.push({to:"new",label:"Restore",icon:"refresh",tone:"btn-ghost"});
  if(T_OPEN.includes(t.stage)&&(appr||(t.creatorId===u.id&&t.stage==="new"))) m.push({to:"cancelled",label:"Cancel task",icon:"x",tone:"btn-bad",comment:true});
  return m;
}
/* is this task waiting for *me*? (drives the badge, the KPI and notifications) */
function tNeedsMe(state,u,t){
  if(t.assigneeId===u.id&&(t.stage==="new"||t.stage==="progress")) return true;
  if(t.stage==="review"){ if(t.creatorId!==t.assigneeId&&!tIsApprover(tUser(state,t.creatorId)||{},t)) return t.creatorId===u.id; return tPrimaryApprover(state,u,t); }
  if(t.stage==="hod"||t.stage==="approved") return tPrimaryApprover(state,u,t);
  return false;
}
function tNextHint(state,t){
  const a=tUser(state,t.assigneeId), c=tUser(state,t.creatorId);
  if(t.stage==="new") return `${a?a.name:"The assignee"} starts the work`;
  if(t.stage==="progress") return `${a?a.name:"The assignee"} submits it for review`;
  if(t.stage==="review") return t.creatorId!==t.assigneeId&&c&&!tIsApprover(c,t)?`${c.name} checks it and sends it to the HOD`:`The ${t.dept} HOD approves or sends it back`;
  if(t.stage==="hod") return `The ${t.dept} HOD approves or sends it back`;
  if(t.stage==="approved") return "The HOD closes it as done";
  return "";
}

/* ---- actions: every change re-checks permissions against the saved data ---- */
function makeTaskActions(commit,user,toast){
  const me=d=>d.users.find(u=>u.id===user.id)||user;
  const find=(d,key)=>{ d.tasks=d.tasks||[]; return d.tasks.find(t=>t.key===key); };
  const act=(t,text,u)=>{ t.activity=t.activity||[]; t.activity.unshift({at:nowISO(),by:u.name,uid:u.id,text}); if(t.activity.length>200) t.activity.length=200; t.updatedAt=nowISO(); };
  const audit=(d,t,u,action,comment)=>d.audit.unshift({id:uid(),at:nowISO(),doc:t.id,action,comment:comment||t.title,dept:t.dept,by:u.name,role:u.role,uid:u.id,desig:u.designation||""});
  const nextNo=d=>{ const pre=`TSK-${new Date().getFullYear()}-`; let max=0; (d.tasks||[]).forEach(t=>{ if((t.id||"").startsWith(pre)) max=Math.max(max,+t.id.slice(pre.length)||0); }); return pre+pad(max+1,4); };
  const newKey=()=>uid()+uid()+Date.now().toString(36);
  const run=(fn,ok)=>{ let err=null, out; commit(d=>{ d.tasks=d.tasks||[]; try{ out=fn(d,me(d)); }catch(e){ err=e.message; } }); if(err){ toast(err,"bad"); return null; } if(ok) toast(typeof ok==="function"?ok(out):ok,"ok"); return out===undefined?true:out; };
  const fail=m=>{ throw new Error(m); };
  const checkDates=(sd,pd)=>{ if(!pd) fail("A planned (due) date is required."); if(!tDate(pd)) fail("The planned date is not a real date."); if(sd&&!tDate(sd)) fail("The start date is not a real date."); if(sd&&sd>pd) fail("The start date is after the planned date."); };
  const LABEL={title:"title",dept:"department",assigneeId:"assignee",plannedDate:"planned date",startDate:"start date",priority:"priority",recurring:"repeat",estimateMin:"estimate",tags:"tags",deps:"dependencies",description:"description"};
  const MANAGE=["title","dept","assigneeId","plannedDate","startDate","priority","recurring","estimateMin","tags","deps"];

  return {
    tCreate(f){
      return run((d,u)=>{
        if(!tCanCreate(u)) fail("Your role can view and comment on tasks but not create them.");
        if(!String(f.title||"").trim()) fail("Give the task a title.");
        if(!tDeptsFor(u).includes(f.dept)) fail("You can only create tasks in your own department.");
        if(!tAssignable(d,u,f.dept).some(x=>x.id===f.assigneeId)) fail("Choose someone from this department to do the task.");
        checkDates(f.startDate,f.plannedDate);
        const a=tUser(d,f.assigneeId);
        const t={ key:newKey(), id:nextNo(d), title:f.title.trim().slice(0,200), description:String(f.description||"").slice(0,5000), dept:f.dept, assigneeId:f.assigneeId, creatorId:u.id,
          plannedDate:f.plannedDate, startDate:f.startDate||"", priority:TPRI[f.priority]?f.priority:"Medium", tags:(f.tags||[]).slice(0,12), estimateMin:Math.max(0,f.estimateMin||0),
          loggedMin:0, timeLog:[], subtasks:[], deps:[], files:[], comments:[], watchers:[], recurring:TREC[f.recurring]?f.recurring:"none", repeatDay:(tDate(f.plannedDate)||new Date()).getDate(),
          stage:"new", createdAt:nowISO(), updatedAt:nowISO(), assignedAt:nowISO(), activity:[] };
        act(t,a.id===u.id?"Created the task":`Created the task and assigned it to ${a.name}`,u);
        d.tasks.unshift(t); audit(d,t,u,"Task created",`${t.title} → ${a.name}`);
        return t;
      },t=>`${t.id} created`);
    },
    tUpdate(key,patch){
      return run((d,u)=>{
        const t=find(d,key); if(!t) fail("This task no longer exists.");
        if(!T_OPEN.includes(t.stage)) fail("This task is closed. Reopen it before changing it.");
        const keys=Object.keys(patch).filter(k=>JSON.stringify(patch[k])!==JSON.stringify(t[k])); if(!keys.length) return;
        if(keys.some(k=>MANAGE.includes(k))&&!tCanManage(u,t)) fail("Only the creator, the HOD or the Regional Manager can change this.");
        if(!tCanWork(u,t)) fail("You can't edit this task.");
        const nx={...t,...patch};
        if(!String(nx.title).trim()) fail("The title can't be empty.");
        if(keys.includes("dept")&&!tDeptsFor(u).includes(nx.dept)) fail("You can only move tasks within your own department.");
        if((keys.includes("dept")||keys.includes("assigneeId"))&&!tAssignable(d,u,nx.dept).some(x=>x.id===nx.assigneeId)) fail(`${(tUser(d,nx.assigneeId)||{name:"That person"}).name} is not in ${nx.dept}. Choose someone from that department.`);
        if(keys.includes("plannedDate")||keys.includes("startDate")) checkDates(nx.startDate,nx.plannedDate);
        if(keys.includes("deps")){
          const reach=(from,seen)=>{ if(from===t.key) return true; if(seen.has(from)) return false; seen.add(from); const x=d.tasks.find(z=>z.key===from); return !!x&&(x.deps||[]).some(k=>reach(k,seen)); };
          if(nx.deps.some(k=>reach(k,new Set()))) fail("That would make the two tasks wait for each other forever.");
        }
        keys.forEach(k=>{ t[k]=patch[k]; });
        t.title=String(t.title).trim().slice(0,200);
        if(keys.includes("plannedDate")) t.repeatDay=(tDate(t.plannedDate)||new Date()).getDate();
        if(keys.includes("assigneeId")){ t.assignedAt=nowISO(); act(t,`Assigned to ${tUser(d,t.assigneeId).name}`,u); }
        const rest=keys.filter(k=>k!=="assigneeId"&&k!=="subtasks");
        if(rest.length) act(t,"Changed "+rest.map(k=>k==="plannedDate"?`planned date to ${tFmt(t.plannedDate)}`:k==="priority"?`priority to ${t.priority}`:k==="dept"?`department to ${t.dept}`:LABEL[k]||k).join(", "),u);
        else t.updatedAt=nowISO();
      });
    },
    tMove(key,to,comment){
      return run((d,u)=>{
        const t=find(d,key); if(!t) fail("This task no longer exists.");
        const mv=taskMoves(u,t).find(m=>m.to===to);
        if(!mv){ const nx=tNextHint(d,t); fail(`You can't move ${t.id} to “${TSTAGE[to].label}”.${nx?" Next step: "+nx+".":""}`); }
        const why=String(comment||"").trim().slice(0,1000);
        if(mv.comment&&!why) fail("Please give a short reason.");
        if(to==="done"){ const open=tDepsOpen(d,t); if(open.length) fail(`Still waiting for ${open.map(x=>x.id).join(", ")} to finish.`); }
        const from=t.stage; t.stage=to;
        if(to==="progress"&&from==="new") t.startedAt=nowISO();
        if(to==="progress"&&from!=="new") t.sentBack={at:nowISO(),by:u.name,uid:u.id,comment:why};
        if(to==="review"){ t.submittedAt=nowISO(); t.sentBack=null; }
        if(to==="approved"){ t.approvedAt=nowISO(); t.approvedBy=u.id; }
        if(to==="done") t.completedAt=nowISO();
        if(from==="done"){ t.completedAt=""; t.rating=0; t.ratedBy=""; }
        act(t,`${mv.label}: ${TSTAGE[from].label} → ${TSTAGE[to].label}${why?" — “"+why+"”":""}`,u);
        if(["approved","done","cancelled"].includes(to)||from==="done") audit(d,t,u,`Task ${mv.label.toLowerCase()}`,why||t.title);
        /* a repeating task creates its next occurrence once, when it is first closed */
        if(to==="done"&&t.recurring&&t.recurring!=="none"&&!t.spawnedNext){
          const step=x=>t.recurring==="daily"?tAddDays(x,1):t.recurring==="weekly"?tAddDays(x,7):tAddMonths(x,1,t.repeatDay);
          let nd=step(t.plannedDate||tToday()), guard=0; while(nd<tToday()&&guard++<500) nd=step(nd);
          const c={...JSON.parse(JSON.stringify(t)), key:newKey(), id:nextNo(d), stage:"new", plannedDate:nd, startDate:"", loggedMin:0, timeLog:[], files:[], comments:[], activity:[],
            rating:0, ratedBy:"", completedAt:"", submittedAt:"", approvedAt:"", approvedBy:"", startedAt:"", sentBack:null, spawnedNext:false, repeatOf:t.id,
            subtasks:(t.subtasks||[]).map(s=>({...s,id:uid(),done:false})), createdAt:nowISO(), updatedAt:nowISO(), assignedAt:nowISO()};
          act(c,`Next occurrence of ${t.id} (${TREC[t.recurring].toLowerCase()})`,u); d.tasks.unshift(c); t.spawnedNext=true;
          return {next:c.id};
        }
      },out=>out&&out.next?`Moved to ${TSTAGE[to].label} · next occurrence ${out.next} created`:`Moved to ${TSTAGE[to].label}`);
    },
    tComment(key,text){
      return run((d,u)=>{
        const t=find(d,key); if(!t||!taskVisible(u,t)) fail("You can't comment on this task.");
        const body=String(text||"").trim().slice(0,2000); if(!body) fail("Write something first.");
        const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
        const ment=d.users.filter(x=>x.active&&x.id!==u.id&&new RegExp("(^|[\\s(])@"+esc(x.username)+"(?![\\w.-])","i").test(body)).map(x=>x.id);
        t.comments=t.comments||[]; t.comments.push({id:uid(),uid:u.id,by:u.name,text:body,at:nowISO(),mentions:ment});
        t.watchers=[...new Set([...(t.watchers||[]),...ment])]; t.updatedAt=nowISO();
      });
    },
    tLogTime(key,min){
      return run((d,u)=>{
        const t=find(d,key); if(!t||!tCanWork(u,t)) fail("Only people working on this task can log time.");
        if(!(min>=1&&min<=24*60)) fail("Enter a time between 1 minute and 24 hours, e.g. 45m or 1h 30m.");
        t.loggedMin=(t.loggedMin||0)+min; t.timeLog=t.timeLog||[]; t.timeLog.push({id:uid(),at:nowISO(),uid:u.id,by:u.name,min}); act(t,`Logged ${tMin(min)}`,u);
      },`Logged ${tMin(min)}`);
    },
    tRate(key,n){
      return run((d,u)=>{
        const t=find(d,key); if(!t||!tIsApprover(u,t)||!["approved","done"].includes(t.stage)) fail("Only the approving HOD can rate an approved task.");
        t.rating=Math.max(1,Math.min(5,n)); t.ratedBy=u.name; act(t,`Rated ${t.rating}/5`,u);
      });
    },
    tAddFile(key,file){
      return run((d,u)=>{ const t=find(d,key); if(!t||!tCanWork(u,t)) fail("You can't attach files to this task."); t.files=t.files||[]; t.files.push({id:uid(),at:nowISO(),by:u.name,...file}); act(t,`Attached ${file.name}`,u); },`Attached ${file.name}`);
    },
    tRemoveFile(key,fid){
      return run((d,u)=>{ const t=find(d,key); if(!t||!tCanWork(u,t)) fail("You can't change this task."); const f=(t.files||[]).find(x=>x.id===fid); t.files=(t.files||[]).filter(x=>x.id!==fid); if(f) act(t,`Removed ${f.name}`,u); });
    },
    tDelete(key){
      return run((d,u)=>{
        const t=find(d,key); if(!t) return; if(!tCanDelete(u,t)) fail("Only the HOD, the Regional Manager, or the creator of a task that has not started can delete it.");
        d.tasks=d.tasks.filter(x=>x.key!==key); d.tasks.forEach(x=>{ if((x.deps||[]).includes(key)){ x.deps=x.deps.filter(k=>k!==key); act(x,`Dependency ${t.id} removed (task deleted)`,u); } });
        audit(d,t,u,"Task deleted",t.title);
      },"Task deleted");
    },
  };
}

/* ---- notifications for the bell (merged into buildNotifications) ---- */
function taskNotifications(state,user){
  const n=[]; const tasks=(state.tasks||[]).filter(t=>taskVisible(user,t));
  tasks.forEach(t=>{
    if(t.assigneeId===user.id&&t.stage==="new"&&t.creatorId!==user.id) n.push({tone:"info",icon:"tasks",t:`New task · ${t.id}`,d:`${t.title} · due ${tFmt(t.plannedDate)}`,at:t.assignedAt||t.createdAt,task:t.key});
    if(t.assigneeId===user.id&&t.stage==="progress"&&t.sentBack) n.push({tone:"warn",icon:"back",t:`Sent back · ${t.id}`,d:`${t.sentBack.by}: ${t.sentBack.comment}`,at:t.sentBack.at,task:t.key});
    if(["review","hod","approved"].includes(t.stage)&&tNeedsMe(state,user,t)) n.push({tone:"info",icon:"stamp",t:`${t.stage==="approved"?"Ready to close":t.stage==="hod"?"Approval needed":"Review needed"} · ${t.id}`,d:`${t.title} · ${(tUser(state,t.assigneeId)||{}).name||""}`,at:t.updatedAt,task:t.key});
    if(t.assigneeId===user.id&&tOverdue(t)) n.push({tone:"bad",icon:"alert",t:`Overdue · ${t.id}`,d:`${t.title} was due ${tFmt(t.plannedDate)}`,at:t.plannedDate+"T00:00:00",task:t.key,key:"tod|"+t.key+"|"+t.plannedDate});
    (t.comments||[]).filter(c=>(c.mentions||[]).includes(user.id)&&hoursSince(c.at)<24*14).forEach(c=>n.push({tone:"info",icon:"msg",t:`${c.by} mentioned you · ${t.id}`,d:c.text.slice(0,120),at:c.at,task:t.key,key:"tm|"+c.id}));
  });
  return n;
}
const tWaitingCount=(state,user)=>(state.tasks||[]).filter(t=>taskVisible(user,t)&&tNeedsMe(state,user,t)).length;

/* ---- running timer: kept per user on this device, survives a reload ---- */
function useTaskTimer(user){
  const k="akf-timer-"+user.id;
  const read=()=>{ try{ return JSON.parse(tLS.get(k)||"null"); }catch(e){ return null; } };
  const [tm,setTm]=useState(read); const [,tick]=useState(0);
  useEffect(()=>{ const f=()=>setTm(read()); window.addEventListener("akf-timer",f); window.addEventListener("storage",f); return ()=>{ window.removeEventListener("akf-timer",f); window.removeEventListener("storage",f); }; },[]);
  useEffect(()=>{ if(!tm) return; const i=setInterval(()=>tick(x=>x+1),1000); return ()=>clearInterval(i); },[tm&&tm.start]);
  const set=v=>{ tLS.set(k,v?JSON.stringify(v):null); window.dispatchEvent(new Event("akf-timer")); };
  const secs=tm?Math.max(0,Math.floor((Date.now()-tm.start)/1000)):0;
  return { tm, secs, label:`${pad(Math.floor(secs/3600),2)}:${pad(Math.floor(secs/60)%60,2)}:${pad(secs%60,2)}`, start:key=>set({key,start:Date.now()}), clear:()=>set(null) };
}
function stopTimer(timer,A){ const min=Math.round(timer.secs/60); const key=timer.tm.key; timer.clear(); if(min>=1) A.tLogTime(key,Math.min(min,24*60)); else tToast("Timer stopped — under a minute, nothing logged",""); }

/* ---- small pieces ---- */
const TStage=({k})=>html`<${Tag} tone=${TSTAGE[k].tone} dot>${TSTAGE[k].label}</${Tag}>`;
const TPriTag=({p})=>html`<${Tag} tone=${TPRI[p].tone}>${p}</${Tag}>`;
const TStars=({n,onPick,sm})=>html`<span class=${"tk-stars"+(sm?" sm":"")}>${[1,2,3,4,5].map(i=>onPick?html`<button type="button" class=${i<=n?"on":""} title=${i+" of 5"} onClick=${()=>onPick(i)}>★</button>`:html`<span class=${i<=n?"on":""}>★</span>`)}</span>`;
const TAvatar=({state,id,sm})=>{ const u=tUser(state,id); return html`<span class=${"avatar"+(sm?" tk-av":"")} title=${u?u.name:"Unknown"}>${initials(u?u.name:"?")}</span>`; };
function tSorted(list){ return list.slice().sort((a,b)=>TPRI[a.priority].rank-TPRI[b.priority].rank||(a.plannedDate||"9").localeCompare(b.plannedDate||"9")); }

/* ---- quick add: "Prepare ration list @ali tomorrow !high #ramadan" ---- */
function tParseQuick(text,state,user){
  let s=" "+text+" "; const out={tags:[]};
  s=s.replace(/\s@([\w.-]+)/g,(_,n)=>{ const u=state.users.find(x=>x.username.toLowerCase()===n.toLowerCase()||x.name.toLowerCase().split(" ")[0]===n.toLowerCase()); if(u) out.assigneeId=u.id; else out.badUser=n; return " "; });
  s=s.replace(/\s!(urgent|high|medium|low)\b/gi,(_,p)=>{ out.priority=p[0].toUpperCase()+p.slice(1).toLowerCase(); return " "; });
  s=s.replace(/\s#([\w-]+)/g,(_,tg)=>{ out.tags.push(tg.toLowerCase()); return " "; });
  const days=["sun","mon","tue","wed","thu","fri","sat"];
  s=s.replace(/\s(today|tomorrow|next week|(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)(?=\s)/i,(_,w)=>{ const x=w.toLowerCase();
    if(x==="today") out.plannedDate=tToday(); else if(x==="tomorrow") out.plannedDate=tAddDays(tToday(),1); else if(x==="next week") out.plannedDate=tAddDays(tToday(),7);
    else if(/^\d/.test(x)){ const [d,m,y]=x.split("/").map(Number); const yy=y?(y<100?2000+y:y):new Date().getFullYear(); const iso=yy+"-"+pad(m,2)+"-"+pad(d,2); if(tDate(iso)) out.plannedDate=iso; else out.badDate=w; }
    else { const i=days.indexOf(x.slice(0,3)); let n=(i-new Date().getDay()+7)%7||7; out.plannedDate=tAddDays(tToday(),n); }
    return " "; });
  out.title=s.replace(/\s+/g," ").trim();
  return out;
}

/* ---- board ---- */
function TBoard({tasks,state,user,A,open}){
  const [over,setOver]=useState(null); const [dragKey,setDragKey]=useState(null);
  const dragging=dragKey&&tasks.find(t=>t.key===dragKey);
  const allowed=dragging?taskMoves(user,dragging).map(m=>m.to):[];
  const drop=to=>{ const t=dragging; setOver(null); setDragKey(null); if(!t||t.stage===to) return; tryMove(t,to,user,A,state); };
  return html`<div class="tk-board">${TSTAGES.map(s=>{
    let col=tasks.filter(t=>t.stage===s.k); const total=col.length; const closed=s.k==="done"||s.k==="cancelled";
    col=closed?col.sort((a,b)=>(b.completedAt||b.updatedAt||"").localeCompare(a.completedAt||a.updatedAt||"")).slice(0,40):tSorted(col);
    const deny=dragging&&dragging.stage!==s.k&&!allowed.includes(s.k);
    return html`<section class=${"tk-col"+(over===s.k?" over":"")+(deny?" deny":"")} aria-label=${s.label}
      onDragOver=${e=>{ if(!dragging) return; e.preventDefault(); if(over!==s.k) setOver(s.k); }} onDragLeave=${e=>{ if(!e.currentTarget.contains(e.relatedTarget)) setOver(o=>o===s.k?null:o); }} onDrop=${e=>{ e.preventDefault(); drop(s.k); }}>
      <header class="tk-col-h"><i style=${"background:"+s.color}/>${s.label}<span class="n">${total}</span></header>
      <div class="tk-col-b">${col.map(t=>html`<${TCard} key=${t.key} t=${t} state=${state} onOpen=${()=>open(t.key)} dragging=${dragKey===t.key} onDragStart=${()=>setDragKey(t.key)} onDragEnd=${()=>{ setDragKey(null); setOver(null); }}/>`)}
        ${!col.length&&html`<div class="tk-col-empty">${deny?"Not a step you can move it to":"Nothing here"}</div>`}
        ${closed&&total>40&&html`<div class="xs faint" style="text-align:center">Latest 40 of ${total} · see List for all</div>`}</div>
    </section>`; })}</div>`;
}
function tryMove(t,to,user,A,state){
  const m=taskMoves(user,t).find(x=>x.to===to);
  if(!m){ const nx=tNextHint(state,t); tToast(`${t.id} can't go to “${TSTAGE[to].label}” from here.${nx?" Next: "+nx+".":""}`,"bad"); return; }
  let why="";
  if(m.comment){ why=prompt(`${m.label} ${t.id} — reason:`); if(why===null) return; if(!why.trim()){ tToast("A reason is needed","bad"); return; } }
  A.tMove(t.key,to,why);
}

/* ---- list ---- */
function TList({tasks,state,open}){

/* ---- planner (month calendar) ---- */
function TCalendar({tasks,state,user,A,open,onCreate}){
  const [month,setMonth]=useState(()=>tToday().slice(0,7)); const [sel,setSel]=useState(tToday());
  const [over,setOver]=useState(null); const drag=useRef(null);
  const [y,m]=month.split("-").map(Number); const first=new Date(y,m-1,1); const lead=(first.getDay()+6)%7;
  const cells=[]; for(let i=0;i<42;i++) cells.push(tISO(new Date(y,m-1,1-lead+i)));
  if(cells.slice(35).every(d=>+d.slice(5,7)!==m)) cells.length=35;
  const byDay={}; tasks.forEach(t=>{ if(t.plannedDate&&t.stage!=="cancelled") (byDay[t.plannedDate]=byDay[t.plannedDate]||[]).push(t); });
  Object.values(byDay).forEach(l=>l.sort((a,b)=>(a.stage==="done")-(b.stage==="done")||TPRI[a.priority].rank-TPRI[b.priority].rank));
  const shift=n=>{ const d=new Date(y,m-1+n,1); setMonth(tISO(d).slice(0,7)); };
  const today=tToday(); const agenda=byDay[sel]||[];
  const dropOn=day=>{ const t=drag.current; drag.current=null; setOver(null); if(!t||t.plannedDate===day) return; if(!tCanManage(user,t)){ tToast("Only the creator, the HOD or the Regional Manager can reschedule this task","bad"); return; } A.tUpdate(t.key,{plannedDate:day}); };
  return html`<div class="tk-cal-wrap"><${Card}>
      <div class="tk-cal-h"><button class="iconbtn" aria-label="Previous month" onClick=${()=>shift(-1)}><${Icon} name="back"/></button><h3>${first.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</h3><button class="iconbtn" aria-label="Next month" onClick=${()=>shift(1)}><${Icon} name="arrow"/></button><span class="grow"/><button class="btn btn-ghost btn-sm" onClick=${()=>{ setMonth(today.slice(0,7)); setSel(today); }}>Today</button></div>
      <div class="tk-cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>html`<div class="dow">${d}</div>`)}
        ${cells.map(d=>{ const l=byDay[d]||[]; return html`<div role="button" tabindex="0" class=${"day"+(+d.slice(5,7)!==m?" out":"")+(d===today?" today":"")+(d===sel?" sel":"")+(over===d?" over":"")} onClick=${()=>setSel(d)} onKeyDown=${e=>{ if(e.key==="Enter") setSel(d); }}
          onDragOver=${e=>{ if(!drag.current) return; e.preventDefault(); if(over!==d) setOver(d); }} onDrop=${e=>{ e.preventDefault(); dropOn(d); }}>
          <span class="dn">${+d.slice(8)}</span>
          ${l.slice(0,3).map(t=>{ const can=T_OPEN.includes(t.stage)&&tCanManage(user,t); return html`<div class=${"ev"+(t.stage==="done"?" done":"")+(tOverdue(t)?" od":"")} style=${"--pri:"+TPRI[t.priority].color} draggable=${can?"true":"false"} title=${t.id+" · "+t.title} onDragStart=${e=>{ drag.current=t; try{ e.dataTransfer.setData("text/plain",t.key); }catch(_){} }} onClick=${e=>{ e.stopPropagation(); open(t.key); }}>${t.title}</div>`; })}
          ${l.length>3&&html`<span class="more">+${l.length-3} more</span>`}
          ${l.length>0&&html`<span class="dots">${l.slice(0,6).map(t=>html`<i style=${"--pri:"+TPRI[t.priority].color}/>`)}</span>`}
        </div>`; })}</div>
      <div class="xs faint" style="margin-top:8px">Drag a task to another day to reschedule it.</div>
    <//>
    <${Card} title=${tFmtY(sel)} desc=${`${agenda.length} task${agenda.length===1?"":"s"} planned`} right=${onCreate&&html`<button class="btn btn-primary btn-sm" onClick=${()=>onCreate(sel)}><${Icon} name="plus"/>Add</button>`}>
      ${agenda.length?agenda.map(t=>html`<button class="tk-row" style=${"--pri:"+TPRI[t.priority].color} onClick=${()=>open(t.key)}><span class="pri"/><span class="g"><b>${t.title}</b><small>${t.id} · ${(tUser(state,t.assigneeId)||{}).name||""}</small></span><${TStage} k=${t.stage}/></button>`):html`<${Empty} title="Free day">Nothing planned for this date.<//>`}
    <//></div>`;
}

/* ---- workload ---- */
function TWorkload({tasks,state,open}){
  const open_=tasks.filter(t=>T_OPEN.includes(t.stage));
  const rows=[...new Set(open_.map(t=>t.assigneeId))].map(id=>{ const u=tUser(state,id)||{name:"Unknown",dept:""}; const l=open_.filter(t=>t.assigneeId===id);
    const od=l.filter(tOverdue).length, wait=l.filter(t=>!tOverdue(t)&&["review","hod","approved"].includes(t.stage)).length, prog=l.filter(t=>!tOverdue(t)&&t.stage==="progress").length, nw=l.length-od-wait-prog;
    return {u,id,n:l.length,od,wait,prog,nw,est:l.reduce((s,t)=>s+Math.max(0,(t.estimateMin||0)-(t.loggedMin||0)),0),urgent:l.filter(t=>t.priority==="Urgent").length}; }).sort((a,b)=>b.n-a.n||b.od-a.od);
  const max=Math.max(1,...rows.map(r=>r.n));
  const seg=(n,c)=>n?html`<i style=${`width:${n/max*100}%;background:${c}`}/>`:"";
  return html`<${Card} title="Workload" desc="Open tasks per person — each task is counted once">
    <div class="tk-legend" style="margin-bottom:6px"><span><i style="background:var(--bad)"/>Overdue</span><span><i style="background:#1E6FD9"/>In progress</span><span><i style="background:#8C9AB0"/>Not started</span><span><i style="background:#5B3FD3"/>With reviewer / HOD</span></div>

      <div class="tk-bar" title=${`${r.od} overdue · ${r.prog} in progress · ${r.nw} not started · ${r.wait} waiting`}>${seg(r.od,"var(--bad)")}${seg(r.prog,"#1E6FD9")}${seg(r.nw,"#8C9AB0")}${seg(r.wait,"#5B3FD3")}</div>
      <div class="xs bold" style="text-align:right">${r.n} open${r.od?html` · <span class="tk-bad">${r.od} late</span>`:""}<div class="faint">${r.est?tMin(r.est)+" left":"no estimate"}</div></div></div>`)
    :html`<${Empty} title="No open tasks">Everyone is clear.<//>`}<//>`;
}

/* ---- performance (one month at a time, every number for the same month) ---- */
function TPerformance({tasks,state}){
  const [month,setMonth]=useState(tToday().slice(0,7));
  const [y,m]=month.split("-").map(Number); const mLabel=new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  const done=tasks.filter(t=>t.stage==="done"&&tLocalDay(t.completedAt).slice(0,7)===month);
  const onTime=t=>!t.plannedDate||tLocalDay(t.submittedAt||t.completedAt)<=t.plannedDate;
  const rated=done.filter(t=>t.rating);
  const mins=tasks.reduce((s,t)=>s+(t.timeLog||[]).filter(l=>tLocalDay(l.at).slice(0,7)===month).reduce((a,l)=>a+l.min,0),0);
  const created=tasks.filter(t=>tLocalDay(t.createdAt).slice(0,7)===month).length;
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  const lb=[...new Set(done.map(t=>t.assigneeId))].map(id=>{ const l=done.filter(t=>t.assigneeId===id); const r=l.filter(t=>t.rating); const ot=l.filter(onTime).length;
    return {u:tUser(state,id)||{name:"Unknown",dept:""},n:l.length,ot,rate:r.length?r.reduce((s,t)=>s+t.rating,0)/r.length:0,score:l.length*2+ot+(r.length?r.reduce((s,t)=>s+t.rating,0)/r.length:0)}; }).sort((a,b)=>b.score-a.score);
  const byDept=[...new Set(tasks.map(t=>t.dept))].map(d=>({d,done:done.filter(t=>t.dept===d).length,late:done.filter(t=>t.dept===d&&!onTime(t)).length,open:tasks.filter(t=>t.dept===d&&T_OPEN.includes(t.stage)).length})).filter(x=>x.done||x.open).sort((a,b)=>b.done-a.done);
  const dmax=Math.max(1,...byDept.map(x=>x.done+x.open));
  return html`<div class="stack" style="gap:16px">
    <div class="row wrap" style="gap:8px"><button class="iconbtn" aria-label="Previous month" onClick=${()=>setMonth(tISO(new Date(y,m-2,1)).slice(0,7))}><${Icon} name="back"/></button><b style="font-size:17px;min-width:150px;text-align:center">${mLabel}</b><button class="iconbtn" aria-label="Next month" onClick=${()=>setMonth(tISO(new Date(y,m,1)).slice(0,7))}><${Icon} name="arrow"/></button><span class="xs faint">Every figure on this page is for ${mLabel}.</span></div>
    <div class="tk-kpis">
      <${Kpi} label="Completed" value=${done.length} sub=${`${created} created this month`} tone="ok"/>
      <${Kpi} label="On time" value=${pct(done.filter(onTime).length,done.length)} sub="submitted by the planned date" tone="info"/>
      <${Kpi} label="Average rating" value=${rated.length?(rated.reduce((s,t)=>s+t.rating,0)/rated.length).toFixed(1)+" ★":"—"} sub=${`${rated.length} rated by HODs`} tone="warn"/>
      <${Kpi} label="Time logged" value=${tMin(mins)} sub="across all tasks" tone="violet"/>
      <${Kpi} label="Still overdue" value=${tasks.filter(tOverdue).length} sub="today, all months" tone="bad"/>
    </div>
    <div class="grid2">
      <${Card} title="Leaderboard" desc=${`Completed in ${mLabel} · on-time and HOD rating`}>${lb.length?lb.slice(0,12).map((r,i)=>html`<div class="tk-row"><span class=${"tk-rank"+(i<3?" top":"")}>${i+1}</span><span class="avatar">${initials(r.u.name)}</span><span class="g"><b>${r.u.name}</b><small>${r.u.dept} · ${r.n} done · ${pct(r.ot,r.n)} on time</small></span>${r.rate?html`<${TStars} n=${Math.round(r.rate)} sm/>`:html`<span class="xs faint">not rated</span>`}</div>`):html`<${Empty} title="No completed tasks">Nothing was closed in ${mLabel}.<//>`}<//>
      <${Card} title="By department" desc="Done this month vs. still open"><div class="tk-legend" style="margin-bottom:6px"><span><i style="background:#0F8A5F"/>Done</span><span><i style="background:var(--bad)"/>Done late</span><span><i style="background:#9DB9E6"/>Open</span></div>${byDept.length?byDept.map(x=>html`<div class="tk-wl" style="grid-template-columns:140px minmax(0,1fr) 70px"><b class="sm">${x.d}</b><div class="tk-bar"><i style=${`width:${(x.done-x.late)/dmax*100}%;background:#0F8A5F`}/><i style=${`width:${x.late/dmax*100}%;background:var(--bad)`}/><i style=${`width:${x.open/dmax*100}%;background:#9DB9E6`}/></div><span class="xs bold" style="text-align:right">${x.done} / ${x.open}</span></div>`):html`<${Empty} title="No data">No tasks for this month.<//>`}<//>
    </div></div>`;
}

      ${work&&html`<div class="tk-inline"><input class="input" placeholder="Add a checklist item" value=${sub} onInput=${e=>setSub(e.target.value)} onKeyDown=${e=>{ if(e.key==="Enter"&&sub.trim()){ up({subtasks:[...subs,{id:uid(),title:sub.trim().slice(0,200),done:false}]}); setSub(""); } }}/><button class="btn btn-ghost" disabled=${!sub.trim()} onClick=${()=>{ up({subtasks:[...subs,{id:uid(),title:sub.trim().slice(0,200),done:false}]}); setSub(""); }}><${Icon} name="plus"/>Add</button></div>`}</div>
    <div class="tk-sec"><h4><${Icon} name="dep"/>Waits for</h4>
      ${deps.map(x=>html`<div class="tk-sub"><${TStage} k=${x.stage}/><span><button class="link-like" onClick=${()=>open(x.key)}>${x.id}</button> ${x.title}</span>${manage&&html`<button class="tk-x" aria-label="Remove" onClick=${()=>up({deps:t.deps.filter(k=>k!==x.key)})}><${Icon} name="x"/></button>`}</div>`)}
      ${!deps.length&&html`<span class="xs faint">Nothing — this task can be closed on its own.</span>`}
      ${manage&&depChoices.length>0&&html`<select class="select" value="" onChange=${e=>{ if(e.target.value) up({deps:[...(t.deps||[]),e.target.value]}); e.target.value=""; }}><option value="">+ Add a task this one waits for…</option>${depChoices.slice(0,200).map(x=>html`<option value=${x.key}>${x.id} · ${x.title.slice(0,60)}</option>`)}</select>`}</div>
    <div class="tk-sec"><h4><${Icon} name="clip"/>Files<span class="grow"/>${work&&html`<button class="btn btn-ghost btn-sm" disabled=${busy} onClick=${()=>fileRef.current.click()}><${Icon} name="upload"/>${busy?"Uploading…":"Attach"}</button>`}</h4>
      <input type="file" class="hidden" ref=${fileRef} onChange=${onFile}/>
      ${(t.files||[]).map(f=>html`<div class="tk-file"><${Icon} name="file"/><div class="g"><b>${f.name}</b><small>${Math.max(1,Math.round((f.size||0)/1024))} KB · ${f.by} · ${fmtD(f.at)}</small></div><button class="btn btn-ghost btn-sm" onClick=${()=>openFile(f)}>Open</button>${work&&html`<button class="tk-x" aria-label="Remove file" onClick=${()=>delFile(f)}><${Icon} name="trash"/></button>`}</div>`)}
      ${!(t.files||[]).length&&html`<span class="xs faint">No files. ${SB_READY?"Any file up to 10 MB.":"Up to 400 KB each in offline mode."}</span>`}</div>
    ${tCanWork(user,t)&&T_OPEN.includes(t.stage)&&html`<div class="tk-sec"><h4><${Icon} name="clock"/>Time</h4><div class="tk-inline"><input class="input" placeholder="e.g. 45m or 1h 30m" value=${logv} onInput=${e=>setLogv(e.target.value)} onKeyDown=${e=>{ if(e.key==="Enter") logTime(); }}/><button class="btn btn-ghost" onClick=${logTime}>Log time</button>
      ${mine?html`<button class="btn btn-soft" onClick=${()=>stopTimer(timer,A)}><${Icon} name="stop"/>Stop ${timer.label}</button>`:html`<button class="btn btn-ghost" disabled=${!!timer.tm} title=${timer.tm?"Another timer is running":""} onClick=${()=>timer.start(t.key)}><${Icon} name="play"/>Start timer</button>`}</div></div>`}
    ${["approved","done"].includes(t.stage)&&(appr||t.rating)&&html`<div class="tk-sec"><h4><${Icon} name="star"/>HOD rating</h4><div class="row" style="gap:10px"><${TStars} n=${t.rating||0} onPick=${appr?(n=>A.tRate(t.key,n)):null}/>${t.ratedBy&&html`<span class="xs faint">by ${t.ratedBy}</span>`}</div></div>`}
    <div class="tk-sec"><h4><${Icon} name="msg"/>Comments</h4>
      ${(t.comments||[]).map(c=>html`<div class="tk-cmt"><span class="avatar tk-av">${initials(c.by)}</span><div class="bubble"><b>${c.by}</b><small>${fmtDT(c.at)}</small><p>${renderText(c.text)}</p></div></div>`)}
      <div style="position:relative">${mList.length>0&&html`<div class="tk-mention">${mList.map(u=>html`<button onClick=${()=>pickMent(u)}><span class="avatar tk-av">${initials(u.name)}</span><b>${u.name}</b><span class="xs faint">@${u.username} · ${u.dept}</span></button>`)}</div>`}
        <div class="tk-inline"><textarea class="textarea" style="min-height:44px" placeholder="Write a comment — type @ to mention someone" value=${cmt} onInput=${onCmt} onKeyDown=${e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) sendCmt(); if(e.key==="Escape"&&ment!==null){ e.stopPropagation(); setMent(null); } }}/><button class="btn btn-primary" disabled=${!cmt.trim()} onClick=${sendCmt}><${Icon} name="send"/></button></div></div></div>
    <div class="tk-sec"><h4><${Icon} name="list"/>Activity<span class="grow"/><button class="btn btn-ghost btn-sm" onClick=${()=>setShowAct(s=>!s)}>${showAct?"Hide":"Show"} (${(t.activity||[]).length})</button></h4>
      ${showAct&&(t.activity||[]).map(a=>html`<div class="tk-act"><b>${a.by}</b> ${a.text} <span class="faint">· ${fmtDT(a.at)}</span></div>`)}</div>
  <//>`;
}

/* ---------- Vendor quotation page (opened from a magic link, no login) ---------- */
const VENDOR_KEYS=["amount","inclusive","deliveryDays","validityDays","note","contact","lines","fileName","file"];
function localVendorRfq(token){ const s=loadState(); for(const r of s.rfqs){ const q=r.quotes.find(x=>x.token===token); if(q){ if(q.status==="Sent"){ q.status="Opened"; q.openedAt=nowISO(); saveState(s); } const req=s.requests.find(x=>x.id===r.requestId)||{}; const v=s.vendors.find(x=>x.id===q.vendorId)||{}; return {rfq:{id:r.id,at:r.at,deadline:r.deadline,status:r.status},quote:{status:q.status,at:q.at,amount:q.amount},items:(req.items||[]).map(i=>({name:i.name,qty:i.qty,uom:i.uom,category:i.category})),purpose:req.purpose,vendor:{name:v.name,gstRegistered:v.gstRegistered,filer:v.filer,type:v.type},org:(s.settings||{}).orgName}; } } return null; }
function localVendorSubmit(token,quote){ const s=loadState(); for(const r of s.rfqs){ const q=r.quotes.find(x=>x.token===token); if(q){ if(r.status!=="Open") return "closed"; if(new Date(r.deadline)<new Date()) return "expired"; if(["Submitted","Expired"].includes(q.status)) return "used"; const clean={}; VENDOR_KEYS.forEach(k=>{ if(quote[k]!==undefined) clean[k]=quote[k]; }); Object.assign(q,clean,{status:"Submitted",at:nowISO(),byVendor:true}); const v=s.vendors.find(x=>x.id===q.vendorId)||{}; s.audit.unshift({id:uid(),at:nowISO(),doc:r.id,by:v.name||"Vendor",role:"vendor",action:`Quotation submitted online by ${v.name}`,comment:`${pkr(quote.amount)} ${quote.inclusive?"incl. tax":"+ tax"}`,dept:"Admin"}); normalizeVendorQuotes(s); saveState(s); return "ok"; } } return "invalid"; }
function VendorQuote({token}){
  const [data,setData]=useState(null); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false); const [done,setDone]=useState(false);
  const [lines,setLines]=useState([]); const [inclusive,setInclusive]=useState(false); const [days,setDays]=useState(3); const [valid,setValid]=useState(15); const [note,setNote]=useState(""); const [contact,setContact]=useState(""); const [file,setFile]=useState(null);
  useEffect(()=>{ (async()=>{ try{ const d=SB_READY?await DB.vendorRfq(token):localVendorRfq(token); if(!d){ setErr("invalid"); return; } setData(d); if(d.org) SETTINGS={...SETTINGS,orgName:d.org}; setLines(d.items.map(i=>({...i,price:""}))); }catch(e){ setErr(e.message||String(e)); } })(); },[]);
  const total=lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0);
  const v=(data&&data.vendor)||{}; const t=total>0?quoteCalc(total,inclusive,{...v,filer:true}):null;
  const expired=data&&new Date(data.rfq.deadline)<new Date(); const closed=data&&data.rfq.status!=="Open"; const used=data&&["Submitted","Expired"].includes(data.quote.status);
  const onFile=e=>{ const f=e.target.files[0]; if(!f) return; if(f.size>400*1024){ alert("Please keep the file under 400 KB (compress the PDF or photo)."); e.target.value=""; return; } const rd=new FileReader(); rd.onload=()=>setFile({name:f.name,data:rd.result}); rd.readAsDataURL(f); };
  const submit=async()=>{ if(!confirm(`Submit your quotation of ${pkr(total)} ${inclusive?"(including all taxes)":"(taxes extra)"}? You cannot change it afterwards.`)) return; setBusy(true);
    const payload={amount:Math.round(total),inclusive,deliveryDays:Number(days)||0,validityDays:Number(valid)||0,note:note.slice(0,500),contact:contact.slice(0,100),lines:lines.map(l=>({item:l.name,qty:Number(l.qty),uom:l.uom,price:Number(l.price)||0})),fileName:file?file.name:"",file:file?file.data:""};
    try{ const r=SB_READY?await DB.vendorSubmit(token,payload):localVendorSubmit(token,payload); if(r==="ok") setDone(true); else setErr(r); }catch(e){ setErr(e.message||String(e)); } setBusy(false); };
  const msg={invalid:["Link not valid","This quotation link is not recognised. Please use the exact link you received."],expired:["Deadline has passed","This request for quotation is closed for new submissions."],closed:["RFQ closed","Quotations for this RFQ are no longer being accepted."],used:["Already submitted","A quotation has already been received from this link. Thank you."]};
  const state=err?(msg[err]?err:"error"):!data?"loading":done?"done":used?"used":expired?"expired":closed?"closed":"form";
  return html`<div class="vq"><header class="vq-h"><img src=${LOGO} alt=""/><div><b>${(data&&data.org)||"Alkhidmat Foundation Islamabad Region"}</b><span>Vendor quotation portal · secure link</span></div></header>
    <main class="vq-main">
      ${state==="loading"&&html`<div class="card vq-card"><div class="card-b">Loading your request for quotation…</div></div>`}
      ${state==="error"&&html`<div class="card vq-card"><div class="card-b"><div class="notice notice-bad"><${Icon} name="alert"/><span>Could not open this link: ${err}</span></div></div></div>`}
      ${msg[state]&&html`<div class="card vq-card vq-center"><span class="vq-ic"><${Icon} name=${state==="used"?"check":"clock"}/></span><h2>${msg[state][0]}</h2><p class="muted">${msg[state][1]}</p></div>`}
      ${state==="done"&&html`<div class="card vq-card vq-center"><span class="vq-ic ok"><${Icon} name="check"/></span><h2>Quotation received</h2><p class="muted">Thank you, ${v.name}. Your quotation of <b>${pkr(total)}</b> ${inclusive?"including all taxes":"plus applicable taxes"} for ${data.rfq.id} has been recorded. The purchase committee will evaluate all offers and you will be informed of the result.</p></div>`}
      ${state==="form"&&html`<div class="card vq-card"><div class="card-b stack">
        <div class="row between wrap"><div><div class="xs faint">Request for quotation</div><h2 style="margin:2px 0 0">${data.rfq.id}</h2></div><${Tag} tone="warn"><${Icon} name="clock" cls="icon" style="width:12px"/>Closes ${fmtDT(data.rfq.deadline)}</${Tag}></div>
        <div class="kv"><dt>Vendor</dt><dd>${v.name}</dd>${data.purpose&&html`<dt>Purpose</dt><dd>${data.purpose}</dd>`}</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Your unit price (PKR)</th><th class="r">Amount</th></tr></thead><tbody>${lines.map((l,i)=>html`<tr><td><b>${l.name}</b><div class="xs faint">${l.category||""}</div></td><td class="r num nowrap">${l.qty} ${l.uom}</td><td class="r"><input class="input" style="max-width:150px;margin-left:auto" type="number" min="0" inputmode="decimal" value=${l.price} onInput=${e=>setLines(ls=>ls.map((x,j)=>j===i?{...x,price:e.target.value}:x))}/></td><td class="r num bold">${fmt((Number(l.qty)||0)*(Number(l.price)||0))}</td></tr>`)}<tr><td colspan="3" class="r bold">Total quoted</td><td class="r num bold">${pkr(total)}</td></tr></tbody></table></div>
        <div class="seg vq-tax"><button class=${!inclusive?"active":""} onClick=${()=>setInclusive(false)}>Prices exclude taxes</button><button class=${inclusive?"active":""} onClick=${()=>setInclusive(true)}>Prices include all taxes</button></div>
        ${t&&html`<div class="notice notice-info"><${Icon} name="shield"/><span class="num">${inclusive?`Total ${pkr(t.gross)} including GST ${pkr(t.gst)}.`:v.gstRegistered===false?`Total ${pkr(t.gross)} (not GST-registered — no GST added).`:`GST ${Math.round(SETTINGS.gst*100)}% will be added: ${pkr(t.sub)} + ${pkr(t.gst)} = ${pkr(t.gross)}.`} Income-tax withholding is deducted at payment as per FBR rules.</span></div>`}
        <div class="grid3"><${Field} label="Delivery time (days)"><input class="input" type="number" min="1" value=${days} onInput=${e=>setDays(e.target.value)}/><//><${Field} label="Offer valid for (days)"><input class="input" type="number" min="1" value=${valid} onInput=${e=>setValid(e.target.value)}/><//><${Field} label="Contact person & phone"><input class="input" value=${contact} onInput=${e=>setContact(e.target.value)} placeholder="Name · 0300-0000000"/><//></div>
        <${Field} label="Remarks (brand, warranty, terms)"><textarea class="textarea" value=${note} onInput=${e=>setNote(e.target.value)} style="min-height:60px"/><//>
        <div class="row wrap"><label class="btn btn-ghost" style="cursor:pointer"><${Icon} name="upload"/>${file?file.name:"Attach quotation on letterhead (PDF / photo, optional)"}<input type="file" class="hidden" accept="image/*,.pdf" onChange=${onFile}/></label><span class="grow"/><button class="btn btn-primary" disabled=${busy||!(total>0)||lines.some(l=>!(Number(l.price)>0))} onClick=${submit}><${Icon} name="send"/>${busy?"Submitting…":"Submit quotation"}</button></div>
        <div class="xs faint">Fill a unit price for every item. This link works once and closes at the deadline. Your offer is confidential and is opened only by the purchase committee.</div>
      </div></div>`}
    </main><footer class="vq-f">${(data&&data.org)||"Alkhidmat Foundation"} · Procurement</footer></div>`;
}

const vendorToken=(/#rfq=([0-9a-f]{16,})/i.exec(location.hash||"")||[])[1];
render(vendorToken?html`<${VendorQuote} token=${vendorToken}/>`:html`<${App}/>`, document.getElementById("app"));

</script>
</body>
</html>
